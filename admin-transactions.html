<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Transactions | EarnGig Admin
  </title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #17182f;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    /* =========================================
       HEADER
    ========================================= */

    header {
      background: #0d1038;
      color: white;
    }

    .nav {
      max-width: 1250px;
      margin: auto;
      padding: 14px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 24px;
      font-weight: 700;
    }

    .logo span {
      color: #7c5cff;
    }

    .admin-badge {
      font-size: 12px;
      color: #c9caff;
      margin-left: auto;
    }

    .dashboard-btn {
      text-decoration: none;

      border:
        1px solid
        rgba(255,255,255,.35);

      color: white;

      padding: 8px 13px;

      border-radius: 7px;

      font-size: 13px;
    }

    .dashboard-btn:hover {
      background: rgba(255,255,255,.08);
    }

    /* =========================================
       MAIN
    ========================================= */

    main {
      max-width: 1250px;
      margin: auto;
      padding: 28px 20px 50px;
    }

    /* =========================================
       PAGE HEADER
    ========================================= */

    .page-heading {
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-block;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;

      color: #6d4aff;

      margin-bottom: 6px;
    }

    .page-heading h1 {
      margin: 0 0 6px;
      font-size: 29px;
    }

    .page-heading p {
      margin: 0;

      color: #686a7d;

      line-height: 1.4;

      font-size: 14px;
    }

    /* =========================================
       SECTION TITLE
    ========================================= */

    .section-title {
      margin: 24px 0 11px;
      font-size: 19px;
    }

    /* =========================================
       STATISTICS
    ========================================= */

    .stats-grid {
      display: grid;

      grid-template-columns:
        repeat(6, minmax(0, 1fr));

      gap: 9px;
    }

    .stat-card {
      background: white;

      border:
        1px solid #e6e7ee;

      border-radius: 10px;

      padding: 12px 14px;

      box-shadow:
        0 3px 9px
        rgba(0,0,0,.025);
    }

    .stat-card small {
      display: block;

      color: #77798b;

      font-size: 11px;

      margin-bottom: 4px;
    }

    .stat-card strong {
      display: block;

      font-size: 18px;

      line-height: 1.2;
    }

    .stat-money {
      font-size: 15px !important;
    }

    /* =========================================
       FILTERS
    ========================================= */

    .filter-box {
      background: white;

      border:
        1px solid #e6e7ee;

      border-radius: 11px;

      padding: 13px;

      box-shadow:
        0 3px 10px
        rgba(0,0,0,.025);

      margin-bottom: 12px;
    }

    .filter-grid {
      display: grid;

      grid-template-columns:
        minmax(220px, 2fr)
        minmax(150px, 1fr)
        minmax(150px, 1fr)
        auto;

      gap: 8px;

      align-items: center;
    }

    .filter-input,
    .filter-select {
      width: 100%;

      height: 40px;

      padding: 0 11px;

      border:
        1px solid #dedfe7;

      border-radius: 7px;

      background: white;

      color: #17182f;

      outline: none;

      font-size: 13px;
    }

    .filter-input:focus,
    .filter-select:focus {
      border-color: #6d4aff;
    }

    .refresh-btn {
      height: 40px;

      border: 0;

      background: #6d4aff;

      color: white;

      padding: 0 15px;

      border-radius: 7px;

      font-size: 12px;

      font-weight: 700;

      cursor: pointer;

      white-space: nowrap;
    }

    .refresh-btn:hover {
      opacity: .9;
    }

    .refresh-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    /* =========================================
       RESULT BAR
    ========================================= */

    .result-bar {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin: 0 0 8px;

      color: #686a7d;

      font-size: 12px;
    }

    /* =========================================
       TRANSACTION LIST
    ========================================= */

    .transaction-list {
      display: grid;
      gap: 8px;
    }

    /* =========================================
       TRANSACTION CARD
    ========================================= */

    .transaction-card {
      background: white;

      border:
        1px solid #e1e3ea;

      border-radius: 9px;

      padding: 10px 12px;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,.025);
    }

    .transaction-grid {
      display: grid;

      grid-template-columns:
        155px
        minmax(200px, 2fr)
        minmax(125px, 1fr)
        minmax(125px, 1fr)
        minmax(125px, 1fr)
        120px;

      gap: 8px;

      align-items: center;
    }

    /* =========================================
       TRANSACTION MAIN
    ========================================= */

    .transaction-main {
      min-width: 0;
    }

    .transaction-amount {
      margin: 5px 0 0;

      font-size: 18px;

      line-height: 1.1;

      white-space: nowrap;
    }

    .transaction-description {
      margin: 0;

      color: #2b2d3b;

      font-size: 12px;

      line-height: 1.35;

      word-break: break-word;
    }

    .transaction-type-label {
      margin-top: 3px;

      color: #77798b;

      font-size: 10px;
    }

    /* =========================================
       BADGES
    ========================================= */

    .badge {
      display: inline-block;

      padding: 4px 7px;

      border-radius: 15px;

      font-size: 9px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: .25px;
    }

    .type-badge {
      background: #f0edff;
      color: #6044d7;
    }

    .type-normal {
      background: #e0f2fe;
      color: #0369a1;
    }

    .type-referral {
      background: #fef3c7;
      color: #92400e;
    }

    .type-create {
      background: #dcfce7;
      color: #15803d;
    }

    .type-competition {
      background: #ede9fe;
      color: #6d28d9;
    }

    .type-withdrawal {
      background: #fee2e2;
      color: #b91c1c;
    }

    .type-membership {
      background: #e0e7ff;
      color: #3730a3;
    }

    .type-platform {
      background: #f1f1f1;
      color: #555555;
    }

    .status-completed {
      background: #dcfce7;
      color: #15803d;
    }

    .status-pending {
      background: #fff4cc;
      color: #9a6700;
    }

    .status-failed {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-rejected {
      background: #fee2e2;
      color: #b91c1c;
    }

    .status-cancelled {
      background: #f1f1f1;
      color: #555555;
    }

    .status-default {
      background: #e8e9ef;
      color: #55576a;
    }

    /* =========================================
       DETAILS
    ========================================= */

    .detail {
      background: #fafafa;

      border:
        1px solid #eeeeee;

      border-radius: 7px;

      padding: 7px 8px;

      min-width: 0;
    }

    .detail small {
      display: block;

      color: #77798b;

      font-size: 9px;

      margin-bottom: 3px;
    }

    .detail strong {
      display: block;

      font-size: 11px;

      word-break: break-word;

      line-height: 1.25;
    }

    .user-link {
      color: #6044d7;

      text-decoration: none;

      word-break: break-all;
    }

    .user-link:hover {
      text-decoration: underline;
    }

    /* =========================================
       LOADING
    ========================================= */

    .loading {
      text-align: center;

      padding: 25px 15px;

      background: white;

      border:
        1px solid #e6e7ee;

      border-radius: 10px;

      color: #686a7d;

      font-size: 13px;
    }

    /* =========================================
       EMPTY
    ========================================= */

    .empty-state {
      text-align: center;

      padding: 35px 20px;

      background: white;

      border:
        1px solid #e6e7ee;

      border-radius: 10px;

      color: #686a7d;
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .empty-state h3 {
      margin: 0 0 6px;

      color: #17182f;

      font-size: 17px;
    }

    .empty-state p {
      margin: 0;

      font-size: 13px;
    }

    /* =========================================
       ERROR
    ========================================= */

    .error-box {
      padding: 16px;

      border-radius: 10px;

      background: #fff5f5;

      border:
        1px solid #f0b5b5;

      color: #721c24;

      font-size: 13px;
    }

    .error-box p {
      margin: 7px 0 0;

      word-break: break-word;
    }

    /* =========================================
       RESPONSIVE
    ========================================= */

    @media (max-width: 1150px) {

      .stats-grid {
        grid-template-columns:
          repeat(3, 1fr);
      }

      .transaction-grid {
        grid-template-columns:
          150px
          1.7fr
          1fr
          1fr;
      }

      .transaction-main {
        grid-row: span 2;
      }

    }

    @media (max-width: 850px) {

      .filter-grid {
        grid-template-columns:
          1fr 1fr;
      }

      .filter-input {
        grid-column: 1 / -1;
      }

      .transaction-grid {
        grid-template-columns:
          1fr 1fr;
      }

      .transaction-main {
        grid-column: span 2;
        grid-row: auto;
      }

    }

    @media (max-width: 650px) {

      .nav {
        flex-wrap: wrap;
      }

      .admin-badge {
        margin-left: 0;
        order: 3;
        width: 100%;
      }

      main {
        padding:
          22px 12px 40px;
      }

      .page-heading h1 {
        font-size: 25px;
      }

      .stats-grid {
        grid-template-columns:
          1fr 1fr;
      }

      .filter-grid {
        grid-template-columns: 1fr;
      }

      .filter-input {
        grid-column: auto;
      }

      .refresh-btn {
        width: 100%;
      }

      .transaction-grid {
        grid-template-columns: 1fr;
      }

      .transaction-main {
        grid-column: auto;
      }

    }

    @media (max-width: 420px) {

      .stats-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="nav">

    <a
      href="admin-dashboard.html"
      class="logo"
    >
      Earn<span>Gig</span>
    </a>

    <div class="admin-badge">
      ADMIN PORTAL
    </div>

    <a
      href="admin-dashboard.html"
      class="dashboard-btn"
    >
      ← Admin Dashboard
    </a>

  </div>

</header>


<main>


  <!-- =========================================
       PAGE HEADER
  ========================================= -->

  <section class="page-heading">

    <span class="eyebrow">
      ADMINISTRATION
    </span>

    <h1>
      Transactions
    </h1>

    <p>
      Review wallet activity and platform financial transactions.
    </p>

  </section>


  <!-- =========================================
       OVERVIEW
  ========================================= -->

  <h2 class="section-title">
    Transaction Overview
  </h2>


  <div
    class="stats-grid"
    id="statsGrid"
  >

    <div class="loading">
      Loading transaction statistics...
    </div>

  </div>


  <!-- =========================================
       ALL TRANSACTIONS
  ========================================= -->

  <h2 class="section-title">
    All Transactions
  </h2>


  <div class="filter-box">

    <div class="filter-grid">

      <input
        type="text"
        id="searchInput"
        class="filter-input"
        placeholder="Search description, reference or user ID..."
      >

      <select
        id="typeFilter"
        class="filter-select"
      >
        <option value="">
          All Types
        </option>
      </select>

      <select
        id="statusFilter"
        class="filter-select"
      >
        <option value="">
          All Statuses
        </option>
      </select>

      <button
        type="button"
        class="refresh-btn"
        id="refreshButton"
      >
        ↻ Refresh
      </button>

    </div>

  </div>


  <div class="result-bar">

    <span id="resultCount">
      Loading...
    </span>

  </div>


  <div
    class="transaction-list"
    id="transactionList"
  >

    <div class="loading">
      Loading transactions...
    </div>

  </div>


</main>


<script>

/* =========================================
   GLOBAL
========================================= */

let currentAdmin = null;

let allTransactions = [];


/* =========================================
   TIMEOUT
========================================= */

function withTimeout(
  promise,
  milliseconds = 15000
) {

  return Promise.race([

    promise,

    new Promise(
      function(resolve, reject) {

        setTimeout(
          function() {

            reject(
              new Error(
                "The request took too long. Please check your internet connection and Supabase configuration."
              )
            );

          },
          milliseconds
        );

      }
    )

  ]);

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "—";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   MONEY
========================================= */

function formatMoney(amount) {

  return new Intl.NumberFormat(
    "en-NG",
    {
      style: "currency",
      currency: "NGN",
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }
  ).format(
    Number(amount || 0)
  );

}


/* =========================================
   DATE
========================================= */

function formatDate(date) {

  if (!date) {
    return "—";
  }

  const convertedDate =
    new Date(date);

  if (
    Number.isNaN(
      convertedDate.getTime()
    )
  ) {
    return "—";
  }

  return new Intl.DateTimeFormat(
    "en-NG",
    {
      timeZone: "Africa/Lagos",
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(
    convertedDate
  );

}


/* =========================================
   TEXT
========================================= */

function formatText(value) {

  if (!value) {
    return "—";
  }

  return String(value)
    .replaceAll("_", " ")
    .replace(
      /\b\w/g,
      function(character) {
        return character.toUpperCase();
      }
    );

}


/* =========================================
   STATUS CLASS
========================================= */

function getStatusClass(status) {

  const value =
    String(
      status || ""
    ).toLowerCase();

  if (value === "completed") {
    return "status-completed";
  }

  if (value === "pending") {
    return "status-pending";
  }

  if (value === "failed") {
    return "status-failed";
  }

  if (value === "rejected") {
    return "status-rejected";
  }

  if (value === "cancelled") {
    return "status-cancelled";
  }

  return "status-default";

}


/* =========================================
   TRANSACTION CATEGORY
========================================= */

function getTransactionCategory(type) {

  const value =
    String(
      type || ""
    ).toLowerCase();


  /* NORMAL MEMBER EARNINGS */

  if (
    value === "task_reward" ||
    value === "watch_earn"
  ) {

    return {
      label: "Normal Earning",
      className: "type-normal"
    };

  }


  /* REFERRAL */

  if (
    value === "referral_bonus"
  ) {

    return {
      label: "Referral Bonus",
      className: "type-referral"
    };

  }


  /* CREATE & EARN */

  if (
    value === "novel_writer_earnings"
  ) {

    return {
      label: "Create & Earn",
      className: "type-create"
    };

  }


  /* COMPETITION */

  if (
    value === "competition_prize"
  ) {

    return {
      label: "Competition Prize",
      className: "type-competition"
    };

  }


  /* WITHDRAWALS */

  if (
    value === "withdrawal" ||
    value === "withdrawal_fee"
  ) {

    return {
      label: "Withdrawal",
      className: "type-withdrawal"
    };

  }


  /* MEMBERSHIP */

  if (
    value === "membership_payment" ||
    value === "membership_upgrade" ||
    value === "membership_renewal" ||
    value === "payment" ||
    value === "payment_fee"
  ) {

    return {
      label: "Membership",
      className: "type-membership"
    };

  }


  /* PLATFORM / OTHER */

  return {
    label: "Platform",
    className: "type-platform"
  };

}


/* =========================================
   PAGE ERROR
========================================= */

function showPageError(message) {

  document.getElementById(
    "statsGrid"
  ).innerHTML = `

    <div
      class="error-box"
      style="grid-column:1/-1;"
    >

      <strong>
        Unable to load transactions.
      </strong>

      <p>
        ${escapeHtml(message)}
      </p>

    </div>

  `;

  document.getElementById(
    "transactionList"
  ).innerHTML = `

    <div class="error-box">

      <strong>
        Transaction data could not be loaded.
      </strong>

      <p>
        ${escapeHtml(message)}
      </p>

    </div>

  `;

  document.getElementById(
    "resultCount"
  ).textContent =
    "Unable to load transactions";

}


/* =========================================
   SUPABASE CHECK
========================================= */

function checkSupabaseClient() {

  if (
    typeof supabaseClient ===
    "undefined"
  ) {

    throw new Error(
      "supabaseClient was not found. Please check your supabase.js file."
    );

  }

}


/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin() {

  try {

    checkSupabaseClient();

    const result =
      await withTimeout(
        supabaseClient
          .auth
          .getUser()
      );

    const user =
      result.data.user;

    const error =
      result.error;

    if (
      error ||
      !user
    ) {

      window.location.href =
        "index.html";

      return null;

    }


    const profileResult =
      await withTimeout(

        supabaseClient
          .from("profiles")
          .select(`
            full_name,
            is_admin,
            account_status
          `)
          .eq(
            "id",
            user.id
          )
          .single()

      );

    const profile =
      profileResult.data;

    const profileError =
      profileResult.error;

    if (
      profileError ||
      !profile
    ) {

      throw new Error(
        profileError
          ? profileError.message
          : "Administrator profile could not be loaded."
      );

    }


    if (
      profile.is_admin !== true
    ) {

      await supabaseClient
        .auth
        .signOut();

      alert(
        "Access denied. Administrator privileges are required."
      );

      window.location.href =
        "index.html";

      return null;

    }


    if (
      profile.account_status &&
      profile.account_status !== "active"
    ) {

      await supabaseClient
        .auth
        .signOut();

      alert(
        "This administrator account is not active."
      );

      window.location.href =
        "index.html";

      return null;

    }


    currentAdmin =
      user;

    return user;

  }

  catch (error) {

    console.error(
      "Admin check error:",
      error
    );

    showPageError(
      "Admin verification error: " +
      (
        error.message ||
        "Unknown error"
      )
    );

    return null;

  }

}


/* =========================================
   LOAD TRANSACTIONS
========================================= */

async function loadTransactions() {

  const transactionList =
    document.getElementById(
      "transactionList"
    );

  const statsGrid =
    document.getElementById(
      "statsGrid"
    );

  const refreshButton =
    document.getElementById(
      "refreshButton"
    );


  transactionList.innerHTML = `

    <div class="loading">
      Loading transactions...
    </div>

  `;


  statsGrid.innerHTML = `

    <div class="loading">
      Loading transaction statistics...
    </div>

  `;


  document.getElementById(
    "resultCount"
  ).textContent =
    "Loading...";


  refreshButton.disabled =
    true;

  refreshButton.textContent =
    "Loading...";


  try {

    checkSupabaseClient();


    const result =
      await withTimeout(

        supabaseClient
          .from("transactions")
          .select(`
            id,
            user_id,
            type,
            amount,
            status,
            description,
            reference,
            metadata,
            balance_after,
            processed_at,
            created_at
          `)
          .order(
            "created_at",
            {
              ascending: false
            }
          )

      );


    const transactions =
      result.data;

    const error =
      result.error;


    if (error) {
      throw error;
    }


    allTransactions =
      transactions || [];


    updateFilters();

    updateStatistics();

    displayTransactions();

  }

  catch (error) {

    console.error(
      "Transaction loading error:",
      error
    );

    showPageError(
      error.message ||
      "Unknown error"
    );

  }

  finally {

    refreshButton.disabled =
      false;

    refreshButton.textContent =
      "↻ Refresh";

  }

}


/* =========================================
   UPDATE FILTERS
========================================= */

function updateFilters() {

  const typeFilter =
    document.getElementById(
      "typeFilter"
    );

  const statusFilter =
    document.getElementById(
      "statusFilter"
    );


  const currentType =
    typeFilter.value;

  const currentStatus =
    statusFilter.value;


  const types =
    [
      ...new Set(
        allTransactions
          .map(
            transaction =>
              String(
                transaction.type || ""
              )
          )
          .filter(
            value => value
          )
      )
    ]
    .sort();


  const statuses =
    [
      ...new Set(
        allTransactions
          .map(
            transaction =>
              String(
                transaction.status || ""
              )
          )
          .filter(
            value => value
          )
      )
    ]
    .sort();


  typeFilter.innerHTML = `

    <option value="">
      All Types
    </option>

  `

  +

  types
    .map(
      type => `

        <option
          value="${escapeHtml(type)}"
        >
          ${escapeHtml(
            formatText(type)
          )}
        </option>

      `
    )
    .join("");


  statusFilter.innerHTML = `

    <option value="">
      All Statuses
    </option>

  `

  +

  statuses
    .map(
      status => `

        <option
          value="${escapeHtml(status)}"
        >
          ${escapeHtml(
            formatText(status)
          )}
        </option>

      `
    )
    .join("");


  typeFilter.value =
    types.includes(currentType)
      ? currentType
      : "";


  statusFilter.value =
    statuses.includes(currentStatus)
      ? currentStatus
      : "";

}


/* =========================================
   UPDATE STATISTICS
========================================= */

function updateStatistics() {


  const totalTransactions =
    allTransactions.length;


  const credits =
    allTransactions.filter(
      transaction =>
        Number(
          transaction.amount || 0
        ) > 0
    );


  const debits =
    allTransactions.filter(
      transaction =>
        Number(
          transaction.amount || 0
        ) < 0
    );


  const completed =
    allTransactions.filter(
      transaction =>
        String(
          transaction.status || ""
        ).toLowerCase() ===
        "completed"
    );


  const pending =
    allTransactions.filter(
      transaction =>
        String(
          transaction.status || ""
        ).toLowerCase() ===
        "pending"
    );


  const referralBonuses =
    allTransactions.filter(
      transaction =>
        transaction.type ===
        "referral_bonus"
    );


  const sumAmount = list =>
    list.reduce(
      (
        total,
        transaction
      ) =>
        total +
        Math.abs(
          Number(
            transaction.amount || 0
          )
        ),
      0
    );


  document.getElementById(
    "statsGrid"
  ).innerHTML = `

    <div class="stat-card">

      <small>
        Total Transactions
      </small>

      <strong>
        ${totalTransactions.toLocaleString()}
      </strong>

    </div>


    <div class="stat-card">

      <small>
        Credits
      </small>

      <strong class="stat-money">
        ${formatMoney(
          sumAmount(credits)
        )}
      </strong>

    </div>


    <div class="stat-card">

      <small>
        Debits
      </small>

      <strong class="stat-money">
        ${formatMoney(
          sumAmount(debits)
        )}
      </strong>

    </div>


    <div class="stat-card">

      <small>
        Completed
      </small>

      <strong>
        ${completed.length.toLocaleString()}
      </strong>

    </div>


    <div class="stat-card">

      <small>
        Pending
      </small>

      <strong>
        ${pending.length.toLocaleString()}
      </strong>

    </div>


    <div class="stat-card">

      <small>
        Referral Bonuses
      </small>

      <strong class="stat-money">
        ${formatMoney(
          sumAmount(
            referralBonuses
          )
        )}
      </strong>

    </div>

  `;

}


/* =========================================
   FILTERED TRANSACTIONS
========================================= */

function getFilteredTransactions() {

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const selectedType =
    document
      .getElementById(
        "typeFilter"
      )
      .value;


  const selectedStatus =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  return allTransactions.filter(
    function(transaction) {

      const transactionType =
        String(
          transaction.type || ""
        );


      const transactionStatus =
        String(
          transaction.status || ""
        );


      const searchableText =
        [
          transaction.description,
          transaction.reference,
          transaction.user_id,
          transaction.type,
          transaction.status,
          transaction.amount
        ]
        .join(" ")
        .toLowerCase();


      const matchesSearch =
        !search ||
        searchableText.includes(
          search
        );


      const matchesType =
        !selectedType ||
        transactionType ===
        selectedType;


      const matchesStatus =
        !selectedStatus ||
        transactionStatus ===
        selectedStatus;


      return (
        matchesSearch &&
        matchesType &&
        matchesStatus
      );

    }
  );

}


/* =========================================
   DISPLAY TRANSACTIONS
========================================= */

function displayTransactions() {

  const transactionList =
    document.getElementById(
      "transactionList"
    );


  const transactions =
    getFilteredTransactions();


  document.getElementById(
    "resultCount"
  ).textContent =

    `${transactions.length.toLocaleString()} transaction${
      transactions.length === 1
        ? ""
        : "s"
    } found`;


  if (
    transactions.length === 0
  ) {

    transactionList.innerHTML = `

      <div class="empty-state">

        <div class="empty-icon">
          📭
        </div>

        <h3>
          No transactions found
        </h3>

        <p>
          No transactions match your current search or filters.
        </p>

      </div>

    `;

    return;

  }


  transactionList.innerHTML =
    transactions
      .map(
        transaction =>
          createTransactionCard(
            transaction
          )
      )
      .join("");

}


/* =========================================
   CREATE TRANSACTION CARD
========================================= */

function createTransactionCard(
  transaction
) {

  const status =
    String(
      transaction.status ||
      "unknown"
    );


  const type =
    String(
      transaction.type ||
      "unknown"
    );


  const category =
    getTransactionCategory(
      type
    );


  const userLink =
    transaction.user_id
      ? `
        <a
          class="user-link"
          href="admin-user-details.html?id=${encodeURIComponent(
            transaction.user_id
          )}"
        >
          View User
        </a>
      `
      : "—";


  return `

    <article class="transaction-card">

      <div class="transaction-grid">


        <!-- TYPE / AMOUNT -->

        <div class="transaction-main">

          <span
            class="
              badge
              ${category.className}
            "
          >
            ${escapeHtml(
              category.label
            )}
          </span>

          <h2 class="transaction-amount">

            ${formatMoney(
              transaction.amount
            )}

          </h2>

          <div class="transaction-type-label">

            ${escapeHtml(
              formatText(type)
            )}

          </div>

        </div>


        <!-- DESCRIPTION -->

        <div class="detail">

          <small>
            Description
          </small>

          <strong class="transaction-description">

            ${escapeHtml(
              transaction.description ||
              "No description provided."
            )}

          </strong>

        </div>


        <!-- STATUS -->

        <div class="detail">

          <small>
            Status
          </small>

          <strong>

            <span
              class="
                badge
                ${getStatusClass(status)}
              "
            >

              ${escapeHtml(
                formatText(status)
              )}

            </span>

          </strong>

        </div>


        <!-- REFERENCE -->

        <div class="detail">

          <small>
            Reference
          </small>

          <strong>

            ${escapeHtml(
              transaction.reference
            )}

          </strong>

        </div>


        <!-- USER -->

        <div class="detail">

          <small>
            User
          </small>

          <strong>

            ${userLink}

          </strong>

        </div>


        <!-- DATE -->

        <div class="detail">

          <small>
            Created
          </small>

          <strong>

            ${formatDate(
              transaction.created_at
            )}

          </strong>

        </div>


      </div>

    </article>

  `;

}


/* =========================================
   EVENTS
========================================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function() {
      displayTransactions();
    }
  );


document
  .getElementById(
    "typeFilter"
  )
  .addEventListener(
    "change",
    function() {
      displayTransactions();
    }
  );


document
  .getElementById(
    "statusFilter"
  )
  .addEventListener(
    "change",
    function() {
      displayTransactions();
    }
  );


document
  .getElementById(
    "refreshButton"
  )
  .addEventListener(
    "click",
    async function() {
      await loadTransactions();
    }
  );


/* =========================================
   START
========================================= */

(async function() {

  try {

    const admin =
      await checkAdmin();


    if (!admin) {
      return;
    }


    await loadTransactions();

  }

  catch (error) {

    console.error(
      "Application startup error:",
      error
    );

    showPageError(
      error.message ||
      "Unknown application error"
    );

  }

})();

</script>
