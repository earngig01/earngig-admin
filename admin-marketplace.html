<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Administration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    :root{
      --bg:#07101d;
      --panel:#0d1828;
      --panel2:#111f32;
      --border:#22334a;
      --text:#edf4fb;
      --muted:#8fa1b5;
      --accent:#38bdf8;
      --accent-soft:rgba(56,189,248,.12);
      --green:#34d399;
      --yellow:#fbbf24;
      --red:#fb7185;
      --white:#fff;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button,
    input,
    select{
      font:inherit;
    }

    .page{
      width:min(1120px,100%);
      margin:auto;
      padding:18px;
    }

    /* HEADER */

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .brand-mark{
      width:34px;
      height:34px;
      border-radius:9px;
      background:var(--accent-soft);
      border:1px solid rgba(56,189,248,.25);
      display:grid;
      place-items:center;
      color:var(--accent);
      font-weight:800;
    }

    .brand-title{
      font-size:16px;
      font-weight:750;
      line-height:1.1;
    }

    .brand-sub{
      color:var(--muted);
      font-size:11px;
      margin-top:3px;
    }

    .back-btn{
      border:1px solid var(--border);
      background:transparent;
      color:var(--muted);
      padding:8px 11px;
      border-radius:8px;
      cursor:pointer;
    }

    .back-btn:hover{
      color:var(--text);
      border-color:#36506d;
    }

    /* PAGE TITLE */

    .heading{
      margin-bottom:16px;
    }

    .heading h1{
      margin:0;
      font-size:24px;
      letter-spacing:-.4px;
    }

    .heading p{
      margin:5px 0 0;
      color:var(--muted);
      font-size:13px;
    }

    /* SMALL STATS */

    .stats{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:8px;
      margin-bottom:16px;
    }

    .stat{
      min-width:0;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:9px;
      padding:10px 11px;
    }

    .stat-label{
      color:var(--muted);
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.7px;
      font-weight:700;
    }

    .stat-value{
      margin-top:4px;
      font-size:18px;
      font-weight:800;
    }

    .stat.pending .stat-value{
      color:var(--yellow);
    }

    .stat.approved .stat-value{
      color:var(--green);
    }

    /* TOOLBAR */

    .toolbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .tabs{
      display:flex;
      gap:5px;
      flex-wrap:wrap;
    }

    .tab{
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--muted);
      border-radius:7px;
      padding:7px 10px;
      font-size:11px;
      cursor:pointer;
    }

    .tab.active{
      background:var(--accent-soft);
      border-color:rgba(56,189,248,.4);
      color:var(--accent);
    }

    .search{
      width:220px;
      max-width:100%;
      background:var(--panel);
      border:1px solid var(--border);
      color:var(--text);
      border-radius:7px;
      padding:8px 10px;
      outline:none;
      font-size:12px;
    }

    .search:focus{
      border-color:var(--accent);
    }

    /* APPLICATION GRID */

    .applications{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }

    .application-card{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:10px;
      padding:12px;
      min-width:0;
    }

    .application-card:hover{
      border-color:#36506d;
    }

    .card-top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .vendor-info{
      min-width:0;
    }

    .store-name{
      font-size:14px;
      font-weight:750;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .vendor-name{
      color:var(--muted);
      font-size:11px;
      margin-top:3px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .status{
      flex:none;
      display:inline-flex;
      align-items:center;
      border-radius:999px;
      padding:4px 7px;
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.3px;
    }

    .status.pending{
      color:#fbbf24;
      background:rgba(251,191,36,.10);
    }

    .status.approved{
      color:#34d399;
      background:rgba(52,211,153,.10);
    }

    .status.more_information_required{
      color:#38bdf8;
      background:rgba(56,189,248,.10);
    }

    .status.rejected{
      color:#fb7185;
      background:rgba(251,113,133,.10);
    }

    .status.withdrawn{
      color:#94a3b8;
      background:rgba(148,163,184,.10);
    }

    .card-details{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      margin-top:11px;
    }

    .detail{
      background:#091423;
      border:1px solid #1b2a3e;
      border-radius:7px;
      padding:7px 8px;
      min-width:0;
    }

    .detail-label{
      color:#708399;
      font-size:8px;
      text-transform:uppercase;
      letter-spacing:.5px;
    }

    .detail-value{
      margin-top:3px;
      font-size:11px;
      color:#dbe7f2;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .card-bottom{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      margin-top:10px;
    }

    .date{
      color:#6f8196;
      font-size:9px;
    }

    .view-btn{
      border:1px solid rgba(56,189,248,.35);
      background:var(--accent-soft);
      color:var(--accent);
      border-radius:7px;
      padding:7px 10px;
      font-size:10px;
      font-weight:700;
      cursor:pointer;
    }

    .view-btn:hover{
      background:rgba(56,189,248,.18);
    }

    .empty{
      border:1px dashed var(--border);
      border-radius:9px;
      padding:28px 15px;
      text-align:center;
      color:var(--muted);
      font-size:12px;
      grid-column:1/-1;
    }

    .loading{
      color:var(--muted);
      font-size:12px;
      padding:20px 0;
    }

    .error{
      background:rgba(251,113,133,.08);
      border:1px solid rgba(251,113,133,.25);
      color:#fecdd3;
      border-radius:8px;
      padding:10px;
      font-size:11px;
    }

    /* MOBILE */

    @media(max-width:760px){
      .page{
        padding:13px;
      }

      .topbar{
        margin-bottom:15px;
      }

      .heading h1{
        font-size:20px;
      }

      .stats{
        grid-template-columns:repeat(2,1fr);
      }

      .stats .stat:last-child{
        grid-column:span 2;
      }

      .applications{
        grid-template-columns:1fr;
      }

      .search{
        width:100%;
      }

      .toolbar{
        align-items:stretch;
      }

      .tabs{
        width:100%;
        overflow-x:auto;
        flex-wrap:nowrap;
        padding-bottom:2px;
      }

      .tab{
        flex:none;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark">E</div>
      <div>
        <div class="brand-title">EarnGig Admin</div>
        <div class="brand-sub">Marketplace control</div>
      </div>
    </div>

    <button class="back-btn" onclick="location.href='admin-dashboard.html'">
      ← Dashboard
    </button>
  </div>

  <div class="heading">
    <h1>Marketplace</h1>
    <p>Review vendor applications and marketplace products.</p>
  </div>

  <div class="stats">
    <div class="stat pending">
      <div class="stat-label">Pending</div>
      <div class="stat-value" id="pendingCount">0</div>
    </div>

    <div class="stat approved">
      <div class="stat-label">Approved</div>
      <div class="stat-value" id="approvedCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">More info</div>
      <div class="stat-value" id="moreInfoCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Rejected</div>
      <div class="stat-value" id="rejectedCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-label">Total</div>
      <div class="stat-value" id="totalCount">0</div>
    </div>
  </div>

  <div class="toolbar">

    <div class="tabs">
      <button class="tab active" data-status="pending">Pending</button>
      <button class="tab" data-status="approved">Approved</button>
      <button class="tab" data-status="more_information_required">More Info</button>
      <button class="tab" data-status="rejected">Rejected</button>
      <button class="tab" data-status="withdrawn">Withdrawn</button>
      <button class="tab" data-status="all">All</button>
    </div>

    <input
      id="searchInput"
      class="search"
      type="search"
      placeholder="Search vendor or store..."
    >

  </div>

  <div id="message"></div>
  <div id="applications" class="applications">
    <div class="loading">Loading applications...</div>
  </div>

</div>

<script>
  let allApplications = [];
  let currentStatus = "pending";

  function escapeHtml(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function formatDate(value){
    if(!value) return "—";

    const date = new Date(value);

    if(Number.isNaN(date.getTime())){
      return "—";
    }

    return date.toLocaleDateString("en-NG",{
      day:"numeric",
      month:"short",
      year:"numeric"
    });
  }

  function statusLabel(status){
    const labels = {
      pending:"Pending",
      approved:"Approved",
      more_information_required:"More Info",
      rejected:"Rejected",
      withdrawn:"Withdrawn"
    };

    return labels[status] || status || "Unknown";
  }

  function updateStats(){
    const count = status =>
      allApplications.filter(a => a.status === status).length;

    document.getElementById("pendingCount").textContent =
      count("pending");

    document.getElementById("approvedCount").textContent =
      count("approved");

    document.getElementById("moreInfoCount").textContent =
      count("more_information_required");

    document.getElementById("rejectedCount").textContent =
      count("rejected");

    document.getElementById("totalCount").textContent =
      allApplications.length;
  }

  function renderApplications(){

    const container = document.getElementById("applications");
    const search = document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

    let rows = [...allApplications];

    if(currentStatus !== "all"){
      rows = rows.filter(row => row.status === currentStatus);
    }

    if(search){
      rows = rows.filter(row => {

        const text = [
          row.store_name,
          row.full_name,
          row.email,
          row.phone_number,
          row.business_location,
          row.state,
          row.lga
        ]
        .join(" ")
        .toLowerCase();

        return text.includes(search);
      });
    }

    if(!rows.length){
      container.innerHTML = `
        <div class="empty">
          No vendor applications found.
        </div>
      `;
      return;
    }

    container.innerHTML = rows.map(row => {

      const status = row.status || "pending";

      return `
        <div class="application-card">

          <div class="card-top">

            <div class="vendor-info">
              <div class="store-name">
                ${escapeHtml(row.store_name || "Unnamed Store")}
              </div>

              <div class="vendor-name">
                ${escapeHtml(row.full_name || "Unknown vendor")}
                ${row.email ? " · " + escapeHtml(row.email) : ""}
              </div>
            </div>

            <span class="status ${escapeHtml(status)}">
              ${escapeHtml(statusLabel(status))}
            </span>

          </div>

          <div class="card-details">

            <div class="detail">
              <div class="detail-label">Phone</div>
              <div class="detail-value">
                ${escapeHtml(row.phone_number || "—")}
              </div>
            </div>

            <div class="detail">
              <div class="detail-label">State</div>
              <div class="detail-value">
                ${escapeHtml(row.state || "—")}
              </div>
            </div>

            <div class="detail">
              <div class="detail-label">LGA</div>
              <div class="detail-value">
                ${escapeHtml(row.lga || "—")}
              </div>
            </div>

            <div class="detail">
              <div class="detail-label">Business Location</div>
              <div class="detail-value">
                ${escapeHtml(row.business_location || "—")}
              </div>
            </div>

          </div>

          <div class="card-bottom">

            <div class="date">
              Submitted ${escapeHtml(formatDate(row.created_at))}
            </div>

            <button
              class="view-btn"
              onclick="openApplication('${row.id}')"
            >
              View application →
            </button>

          </div>

        </div>
      `;

    }).join("");
  }

  function openApplication(id){
    window.location.href =
      "marketplace-vendor-review.html?id=" +
      encodeURIComponent(id);
  }

  async function loadApplications(){

    const container = document.getElementById("applications");
    const message = document.getElementById("message");

    message.innerHTML = "";

    const {
      data: { user },
      error: authError
    } = await supabaseClient.auth.getUser();

    if(authError || !user){
      window.location.href = "login.html";
      return;
    }

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("id,full_name,account_status,is_admin")
        .eq("id",user.id)
        .single();

    if(profileError || !profile){
      message.innerHTML = `
        <div class="error">
          Unable to verify administrator profile.
        </div>
      `;
      container.innerHTML = "";
      return;
    }

    if(
      profile.is_admin !== true ||
      String(profile.account_status || "").toLowerCase() !== "active"
    ){
      message.innerHTML = `
        <div class="error">
          Administrator access required.
        </div>
      `;
      container.innerHTML = "";
      return;
    }

    const { data, error } = await supabaseClient
      .from("marketplace_vendor_applications")
      .select(`
        id,
        user_id,
        full_name,
        phone_number,
        email,
        personal_photo_url,
        residential_address,
        state,
        lga,
        store_name,
        business_description,
        business_location,
        business_address,
        business_phone,
        store_logo_url,
        tiktok_url,
        instagram_url,
        facebook_url,
        whatsapp_url,
        website_url,
        additional_information,
        status,
        admin_note,
        reviewed_by,
        reviewed_at,
        created_at,
        updated_at
      `)
      .order("created_at",{ascending:false});

    if(error){
      console.error(error);

      message.innerHTML = `
        <div class="error">
          Could not load marketplace applications.
          ${escapeHtml(error.message || "")}
        </div>
      `;

      container.innerHTML = "";
      return;
    }

    allApplications = data || [];

    updateStats();
    renderApplications();
  }

  document.querySelectorAll(".tab").forEach(tab => {

    tab.addEventListener("click",() => {

      document.querySelectorAll(".tab").forEach(t =>
        t.classList.remove("active")
      );

      tab.classList.add("active");

      currentStatus = tab.dataset.status;

      renderApplications();
    });

  });

  document.getElementById("searchInput")
    .addEventListener("input",renderApplications);

  loadApplications();
</script>

</body>
</html>
