<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Vendor Application Review</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    :root{
      --bg:#07101d;
      --panel:#0d1828;
      --panel2:#091423;
      --border:#22334a;
      --text:#edf4fb;
      --muted:#8fa1b5;
      --accent:#38bdf8;
      --accent-soft:rgba(56,189,248,.11);
      --green:#34d399;
      --green-soft:rgba(52,211,153,.10);
      --yellow:#fbbf24;
      --yellow-soft:rgba(251,191,36,.10);
      --red:#fb7185;
      --red-soft:rgba(251,113,133,.10);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    button,
    textarea{
      font:inherit;
    }

    .page{
      width:min(900px,100%);
      margin:auto;
      padding:15px;
    }

    /* HEADER */

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:15px;
    }

    .back{
      border:1px solid var(--border);
      background:var(--panel);
      color:var(--muted);
      border-radius:7px;
      padding:7px 10px;
      cursor:pointer;
      font-size:11px;
    }

    .back:hover{
      color:var(--text);
    }

    .admin-label{
      color:var(--muted);
      font-size:10px;
    }

    /* TITLE */

    .title-block{
      margin-bottom:14px;
    }

    .title-block h1{
      margin:0;
      font-size:22px;
      letter-spacing:-.3px;
    }

    .title-block p{
      margin:4px 0 0;
      color:var(--muted);
      font-size:12px;
    }

    /* MAIN SUMMARY */

    .summary{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:10px;
      padding:13px;
      margin-bottom:10px;
    }

    .summary-main{
      min-width:0;
    }

    .store-name{
      font-size:17px;
      font-weight:800;
    }

    .vendor-name{
      color:var(--muted);
      font-size:11px;
      margin-top:3px;
    }

    .status{
      flex:none;
      border-radius:999px;
      padding:5px 8px;
      font-size:9px;
      font-weight:800;
      text-transform:uppercase;
    }

    .status.pending{
      color:var(--yellow);
      background:var(--yellow-soft);
    }

    .status.approved{
      color:var(--green);
      background:var(--green-soft);
    }

    .status.more_information_required{
      color:var(--accent);
      background:var(--accent-soft);
    }

    .status.rejected{
      color:var(--red);
      background:var(--red-soft);
    }

    .status.withdrawn{
      color:#94a3b8;
      background:rgba(148,163,184,.1);
    }

    /* SECTIONS */

    .section{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:10px;
      padding:13px;
      margin-bottom:10px;
    }

    .section-title{
      font-size:12px;
      font-weight:800;
      margin-bottom:10px;
    }

    .section-subtitle{
      color:var(--muted);
      font-size:10px;
      margin-top:-5px;
      margin-bottom:10px;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:7px;
    }

    .field{
      background:var(--panel2);
      border:1px solid #1b2a3e;
      border-radius:7px;
      padding:8px;
      min-width:0;
    }

    .field.full{
      grid-column:1/-1;
    }

    .label{
      color:#718399;
      font-size:8px;
      text-transform:uppercase;
      letter-spacing:.5px;
      font-weight:700;
    }

    .value{
      margin-top:4px;
      font-size:11px;
      line-height:1.45;
      color:#dce7f2;
      word-break:break-word;
    }

    .value.empty{
      color:#607288;
    }

    /* IMAGES */

    .media-grid{
      display:grid;
      grid-template-columns:150px 150px;
      gap:10px;
    }

    .media-card{
      background:var(--panel2);
      border:1px solid #1b2a3e;
      border-radius:8px;
      padding:8px;
    }

    .media-label{
      color:#718399;
      font-size:8px;
      text-transform:uppercase;
      margin-bottom:6px;
    }

    .media-card img{
      display:block;
      width:100%;
      height:125px;
      object-fit:cover;
      border-radius:6px;
      background:#07101d;
    }

    .media-fallback{
      height:125px;
      border-radius:6px;
      background:#07101d;
      border:1px dashed #263950;
      display:grid;
      place-items:center;
      color:#607288;
      font-size:10px;
      text-align:center;
      padding:8px;
    }

    /* LINKS */

    .links{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .link{
      display:inline-block;
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--accent);
      padding:6px 8px;
      border-radius:6px;
      font-size:10px;
      word-break:break-all;
    }

    /* REVIEW */

    .review-box{
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:10px;
      padding:13px;
      margin-bottom:10px;
    }

    textarea{
      width:100%;
      min-height:85px;
      resize:vertical;
      background:var(--panel2);
      border:1px solid #1b2a3e;
      color:var(--text);
      border-radius:7px;
      padding:9px;
      outline:none;
      font-size:11px;
    }

    textarea:focus{
      border-color:var(--accent);
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
      margin-top:9px;
    }

    .action{
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      border-radius:7px;
      padding:8px 11px;
      cursor:pointer;
      font-size:10px;
      font-weight:700;
    }

    .action:hover{
      border-color:#36506d;
    }

    .action.approve{
      border-color:rgba(52,211,153,.35);
      background:var(--green-soft);
      color:var(--green);
    }

    .action.info{
      border-color:rgba(56,189,248,.35);
      background:var(--accent-soft);
      color:var(--accent);
    }

    .action.reject{
      border-color:rgba(251,113,133,.35);
      background:var(--red-soft);
      color:var(--red);
    }

    .action:disabled{
      opacity:.5;
      cursor:not-allowed;
    }

    .message{
      margin-bottom:10px;
    }

    .success,
    .error{
      border-radius:7px;
      padding:9px;
      font-size:10px;
    }

    .success{
      color:#bbf7d0;
      background:var(--green-soft);
      border:1px solid rgba(52,211,153,.25);
    }

    .error{
      color:#fecdd3;
      background:var(--red-soft);
      border:1px solid rgba(251,113,133,.25);
    }

    .loading{
      color:var(--muted);
      padding:30px 0;
      text-align:center;
      font-size:12px;
    }

    @media(max-width:600px){

      .page{
        padding:11px;
      }

      .summary{
        align-items:flex-start;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .field.full{
        grid-column:auto;
      }

      .media-grid{
        grid-template-columns:1fr 1fr;
      }

      .media-card img,
      .media-fallback{
        height:110px;
      }

      .actions{
        display:grid;
        grid-template-columns:1fr;
      }

      .action{
        width:100%;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="topbar">
    <button class="back" onclick="history.back()">← Marketplace</button>
    <div class="admin-label">Vendor review</div>
  </div>

  <div id="message" class="message"></div>

  <div id="content">
    <div class="loading">Loading application...</div>
  </div>

</div>

<script>

  const params = new URLSearchParams(window.location.search);
  const applicationId = params.get("id");

  let application = null;
  let currentAdmin = null;

  function escapeHtml(value){
    return String(value ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function valueOrDash(value){
    if(value === null || value === undefined || String(value).trim() === ""){
      return `<span class="empty">Not provided</span>`;
    }

    return escapeHtml(value);
  }

  function formatDate(value){
    if(!value) return "—";

    const d = new Date(value);

    if(Number.isNaN(d.getTime())){
      return "—";
    }

    return d.toLocaleString("en-NG",{
      day:"numeric",
      month:"short",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  function statusLabel(status){
    const labels = {
      pending:"Pending",
      approved:"Approved",
      more_information_required:"More Info Required",
      rejected:"Rejected",
      withdrawn:"Withdrawn"
    };

    return labels[status] || status || "Unknown";
  }

  function imageHtml(url,label){

    if(!url){
      return `
        <div class="media-card">
          <div class="media-label">${escapeHtml(label)}</div>
          <div class="media-fallback">
            No image provided
          </div>
        </div>
      `;
    }

    return `
      <div class="media-card">
        <div class="media-label">${escapeHtml(label)}</div>

        <img
          src="${escapeHtml(url)}"
          alt="${escapeHtml(label)}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='grid';"
        >

        <div
          class="media-fallback"
          style="display:none"
        >
          Image could not be loaded.
        </div>
      </div>
    `;
  }

  function linkHtml(url,label){

    if(!url){
      return "";
    }

    let safeUrl = String(url).trim();

    if(!/^https?:\/\//i.test(safeUrl)){
      safeUrl = "https://" + safeUrl;
    }

    return `
      <a
        class="link"
        href="${escapeHtml(safeUrl)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ${escapeHtml(label)}
      </a>
    `;
  }

  function renderApplication(){

    const a = application;

    document.getElementById("content").innerHTML = `

      <div class="title-block">
        <h1>Vendor Application Review</h1>
        <p>Review the submitted business information before making a decision.</p>
      </div>

      <div class="summary">

        <div class="summary-main">
          <div class="store-name">
            ${valueOrDash(a.store_name)}
          </div>

          <div class="vendor-name">
            ${valueOrDash(a.full_name)}
            ${a.email ? " · " + escapeHtml(a.email) : ""}
          </div>
        </div>

        <span class="status ${escapeHtml(a.status || "pending")}">
          ${escapeHtml(statusLabel(a.status))}
        </span>

      </div>

      <div class="section">

        <div class="section-title">
          Applicant
        </div>

        <div class="grid">

          <div class="field">
            <div class="label">Full name</div>
            <div class="value">${valueOrDash(a.full_name)}</div>
          </div>

          <div class="field">
            <div class="label">Email</div>
            <div class="value">${valueOrDash(a.email)}</div>
          </div>

          <div class="field">
            <div class="label">Phone</div>
            <div class="value">${valueOrDash(a.phone_number)}</div>
          </div>

          <div class="field">
            <div class="label">State</div>
            <div class="value">${valueOrDash(a.state)}</div>
          </div>

          <div class="field">
            <div class="label">LGA</div>
            <div class="value">${valueOrDash(a.lga)}</div>
          </div>

          <div class="field">
            <div class="label">Submitted</div>
            <div class="value">${escapeHtml(formatDate(a.created_at))}</div>
          </div>

          <div class="field full">
            <div class="label">Residential address</div>
            <div class="value">${valueOrDash(a.residential_address)}</div>
          </div>

        </div>

      </div>

      <div class="section">

        <div class="section-title">
          Business
        </div>

        <div class="grid">

          <div class="field">
            <div class="label">Store name</div>
            <div class="value">${valueOrDash(a.store_name)}</div>
          </div>

          <div class="field">
            <div class="label">Business phone</div>
            <div class="value">${valueOrDash(a.business_phone)}</div>
          </div>

          <div class="field">
            <div class="label">Business location</div>
            <div class="value">${valueOrDash(a.business_location)}</div>
          </div>

          <div class="field">
            <div class="label">State / LGA</div>
            <div class="value">
              ${escapeHtml(a.state || "—")} /
              ${escapeHtml(a.lga || "—")}
            </div>
          </div>

          <div class="field full">
            <div class="label">Business address</div>
            <div class="value">${valueOrDash(a.business_address)}</div>
          </div>

          <div class="field full">
            <div class="label">Business description</div>
            <div class="value">${valueOrDash(a.business_description)}</div>
          </div>

        </div>

      </div>

      <div class="section">

        <div class="section-title">
          Verification images
        </div>

        <div class="section-subtitle">
          Personal photo is for administrator verification. Store logo is used for the marketplace store.
        </div>

        <div class="media-grid">

          ${imageHtml(
            a.personal_photo_url,
            "Personal photo"
          )}

          ${imageHtml(
            a.store_logo_url,
            "Store logo"
          )}

        </div>

      </div>

      <div class="section">

        <div class="section-title">
          Social & business links
        </div>

        <div class="links">

          ${linkHtml(a.tiktok_url,"TikTok")}
          ${linkHtml(a.instagram_url,"Instagram")}
          ${linkHtml(a.facebook_url,"Facebook")}
          ${linkHtml(a.whatsapp_url,"WhatsApp")}
          ${linkHtml(a.website_url,"Website")}

          ${
            !a.tiktok_url &&
            !a.instagram_url &&
            !a.facebook_url &&
            !a.whatsapp_url &&
            !a.website_url
              ? `<span class="value empty">No links provided</span>`
              : ""
          }

        </div>

      </div>

      <div class="section">

        <div class="section-title">
          Additional information
        </div>

        <div class="field">
          <div class="value">
            ${valueOrDash(a.additional_information)}
          </div>
        </div>

      </div>

      <div class="review-box">

        <div class="section-title">
          Admin review
        </div>

        <div class="section-subtitle">
          Add a note when approving, rejecting or requesting more information.
        </div>

        <textarea
          id="adminNote"
          placeholder="Write an admin note..."
        >${escapeHtml(a.admin_note || "")}</textarea>

        <div class="actions">

          <button
            class="action approve"
            onclick="updateApplication('approved')"
          >
            Approve application
          </button>

          <button
            class="action info"
            onclick="updateApplication('more_information_required')"
          >
            Request more information
          </button>

          <button
            class="action reject"
            onclick="updateApplication('rejected')"
          >
            Reject application
          </button>

        </div>

      </div>

      ${
        a.reviewed_at
        ? `
          <div class="section">
            <div class="section-title">Review history</div>

            <div class="grid">

              <div class="field">
                <div class="label">Reviewed</div>
                <div class="value">
                  ${escapeHtml(formatDate(a.reviewed_at))}
                </div>
              </div>

              <div class="field">
                <div class="label">Current status</div>
                <div class="value">
                  ${escapeHtml(statusLabel(a.status))}
                </div>
              </div>

            </div>
          </div>
        `
        : ""
      }

    `;
  }

  async function verifyAdmin(){

    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();

    if(error || !user){
      window.location.href = "login.html";
      return false;
    }

    const { data: profile, error: profileError } =
      await supabaseClient
        .from("profiles")
        .select("id,full_name,account_status,is_admin")
        .eq("id",user.id)
        .single();

    if(
      profileError ||
      !profile ||
      profile.is_admin !== true ||
      String(profile.account_status || "").toLowerCase() !== "active"
    ){
      document.getElementById("content").innerHTML = "";
      document.getElementById("message").innerHTML = `
        <div class="error">
          Administrator access required.
        </div>
      `;

      return false;
    }

    currentAdmin = profile;

    return true;
  }

  async function loadApplication(){

    if(!applicationId){

      document.getElementById("content").innerHTML = "";

      document.getElementById("message").innerHTML = `
        <div class="error">
          No application was selected.
        </div>
      `;

      return;
    }

    const ok = await verifyAdmin();

    if(!ok) return;

    const { data, error } = await supabaseClient
      .from("marketplace_vendor_applications")
      .select(`
        id,
        user_id,
        full_name,
        phone_number,
        email,
        personal_photo_url,
        residential_address,
        state,
        lga,
        store_name,
        business_description,
        business_location,
        business_address,
        business_phone,
        store_logo_url,
        tiktok_url,
        instagram_url,
        facebook_url,
        whatsapp_url,
        website_url,
        additional_information,
        status,
        admin_note,
        reviewed_by,
        reviewed_at,
        created_at,
        updated_at
      `)
      .eq("id",applicationId)
      .single();

    if(error || !data){

      console.error(error);

      document.getElementById("content").innerHTML = "";

      document.getElementById("message").innerHTML = `
        <div class="error">
          Unable to load this vendor application.
          ${escapeHtml(error?.message || "")}
        </div>
      `;

      return;
    }

    application = data;

    renderApplication();
  }

  async function updateApplication(newStatus){

    if(!application || !currentAdmin){
      return;
    }

    const noteElement = document.getElementById("adminNote");

    const note = noteElement
      ? noteElement.value.trim()
      : "";

    const buttons = document.querySelectorAll(".action");

    buttons.forEach(button => {
      button.disabled = true;
    });

    document.getElementById("message").innerHTML = `
      <div class="success">
        Saving review...
      </div>
    `;

    const { data, error } = await supabaseClient
      .from("marketplace_vendor_applications")
      .update({
        status:newStatus,
        admin_note:note || null,
        reviewed_by:currentAdmin.id,
        reviewed_at:new Date().toISOString(),
        updated_at:new Date().toISOString()
      })
      .eq("id",application.id)
      .select()
      .single();

    if(error){

      console.error(error);

      buttons.forEach(button => {
        button.disabled = false;
      });

      document.getElementById("message").innerHTML = `
        <div class="error">
          Could not save the review.
          ${escapeHtml(error.message || "")}
        </div>
      `;

      return;
    }

    application = data;

    document.getElementById("message").innerHTML = `
      <div class="success">
        Application updated successfully.
      </div>
    `;

    renderApplication();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }

  loadApplication();

</script>

</body>
</html>
