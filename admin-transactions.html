<script>


/* =========================================
   GLOBAL VARIABLES
========================================= */


let currentAdmin =
  null;


let allTransactions =
  [];


/* =========================================
   REQUEST TIMEOUT
========================================= */


function withTimeout(
  promise,
  milliseconds = 15000
) {


  return Promise.race([


    promise,


    new Promise(

      function(
        resolve,
        reject
      ) {


        setTimeout(

          function() {


            reject(

              new Error(

                "The request took too long. Please check your internet connection and Supabase configuration."

              )

            );


          },

          milliseconds

        );


      }

    )


  ]);


}


/* =========================================
   ESCAPE HTML
========================================= */


function escapeHtml(
  value
) {


  if (

    value === null ||

    value === undefined

  ) {

    return "—";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );


}


/* =========================================
   FORMAT MONEY
========================================= */


function formatMoney(
  amount
) {


  const value =
    Number(amount || 0);


  return new Intl.NumberFormat(

    "en-NG",

    {

      style:
        "currency",

      currency:
        "NGN",

      minimumFractionDigits:
        0,

      maximumFractionDigits:
        2

    }

  )

  .format(value);


}


/* =========================================
   FORMAT DATE
========================================= */


function formatDate(
  date
) {


  if (!date) {

    return "—";

  }


  const convertedDate =
    new Date(date);


  if (

    Number.isNaN(
      convertedDate.getTime()
    )

  ) {

    return "—";

  }


  return convertedDate
    .toLocaleString(

      "en-NG",

      {

        year:
          "numeric",

        month:
          "short",

        day:
          "numeric",

        hour:
          "2-digit",

        minute:
          "2-digit"

      }

    );


}


/* =========================================
   FORMAT TEXT
========================================= */


function formatText(
  value
) {


  if (!value) {

    return "—";

  }


  return String(value)

    .replaceAll(
      "_",
      " "
    )

    .replace(

      /\b\w/g,

      function(
        character
      ) {

        return character
          .toUpperCase();

      }

    );


}


/* =========================================
   GET STATUS CLASS
========================================= */


function getStatusClass(
  status
) {


  const value =
    String(
      status || ""
    )
    .toLowerCase();


  if (

    value ===
    "completed"

  ) {

    return
      "status-completed";

  }


  if (

    value ===
    "pending"

  ) {

    return
      "status-pending";

  }


  if (

    value ===
    "failed"

  ) {

    return
      "status-failed";

  }


  if (

    value ===
    "rejected"

  ) {

    return
      "status-rejected";

  }


  if (

    value ===
    "cancelled"

  ) {

    return
      "status-cancelled";

  }


  return
    "status-default";


}


/* =========================================
   SHOW PAGE ERROR
========================================= */


function showPageError(
  message
) {


  document.getElementById(
    "statsGrid"
  ).innerHTML = `

    <div
      class="error-box"
      style="
        grid-column:1/-1;
      "
    >

      <strong>

        Unable to load transactions.

      </strong>

      <p>

        ${escapeHtml(message)}

      </p>

    </div>

  `;


  document.getElementById(
    "transactionList"
  ).innerHTML = `

    <div
      class="error-box"
    >

      <strong>

        Transaction data could not be loaded.

      </strong>

      <p>

        ${escapeHtml(message)}

      </p>

    </div>

  `;


  document.getElementById(
    "resultCount"
  ).textContent =
    "Unable to load transactions";


}


/* =========================================
   CHECK SUPABASE
========================================= */


function checkSupabaseClient() {


  if (

    typeof supabaseClient ===
    "undefined"

  ) {


    throw new Error(

      "supabaseClient was not found. Please check your supabase.js file."

    );


  }


}


/* =========================================
   ADMIN SECURITY CHECK
========================================= */


async function checkAdmin() {


  try {


    checkSupabaseClient();



    const result =

      await withTimeout(

        supabaseClient

          .auth

          .getUser()

      );


    const user =
      result.data.user;


    const error =
      result.error;



    /* NOT LOGGED IN */


    if (

      error ||

      !user

    ) {


      window.location.href =
        "index.html";


      return null;

    }



    /* LOAD PROFILE */


    const profileResult =

      await withTimeout(

        supabaseClient

          .from(
            "profiles"
          )

          .select(
            `
              full_name,
              is_admin,
              account_status
            `
          )

          .eq(
            "id",
            user.id
          )

          .single()

      );


    const profile =
      profileResult.data;


    const profileError =
      profileResult.error;



    /* PROFILE ERROR */


    if (


      profileError ||

      !profile

    ) {


      throw new Error(

        profileError
          ? profileError.message
          : "Administrator profile could not be loaded."

      );


    }



    /* NOT ADMIN */


    if (

      profile.is_admin !==
      true

    ) {


      await supabaseClient
        .auth
        .signOut();


      alert(

        "Access denied. Administrator privileges are required."

      );


      window.location.href =
        "index.html";


      return null;

    }



    /* INACTIVE ACCOUNT */


    if (

      profile.account_status &&

      profile.account_status !==
      "active"

    ) {


      await supabaseClient
        .auth
        .signOut();


      alert(

        "This administrator account is not active."

      );


      window.location.href =
        "index.html";


      return null;

    }


    currentAdmin =
      user;


    return user;


  }


  catch (error) {


    console.error(

      "Admin check error:",

      error

    );


    showPageError(

      "Admin verification error: " +

      (

        error.message ||
        "Unknown error"

      )

    );


    return null;


  }


}


/* =========================================
   LOAD TRANSACTIONS
========================================= */


async function loadTransactions() {


  const transactionList =

    document.getElementById(
      "transactionList"
    );


  const statsGrid =

    document.getElementById(
      "statsGrid"
    );


  const refreshButton =

    document.getElementById(
      "refreshButton"
    );



  transactionList.innerHTML = `

    <div
      class="loading"
    >

      Loading transactions...

    </div>

  `;


  statsGrid.innerHTML = `

    <div
      class="loading"
    >

      Loading transaction statistics...

    </div>

  `;


  document.getElementById(
    "resultCount"
  ).textContent =
    "Loading...";


  refreshButton.disabled =
    true;


  refreshButton.textContent =
    "Loading...";


  try {


    checkSupabaseClient();



    /* =====================================
       LOAD DIRECTLY FROM TRANSACTIONS TABLE

       NO RPC IS USED HERE
    ===================================== */


    const result =

      await withTimeout(

        supabaseClient

          .from(
            "transactions"
          )

          .select(
            `
              id,
              user_id,
              type,
              amount,
              status,
              description,
              reference,
              metadata,
              balance_after,
              processed_at,
              created_at
            `
          )

          .order(
            "created_at",
            {

              ascending:
                false

            }
          )

      );


    const transactions =
      result.data;


    const error =
      result.error;



    if (error) {

      throw error;

    }


    allTransactions =
      transactions || [];


    updateFilters();


    updateStatistics();


    displayTransactions();


  }


  catch (error) {


    console.error(

      "Transaction loading error:",

      error

    );


    showPageError(

      error.message ||

      "Unknown error"

    );


  }


  finally {


    refreshButton.disabled =
      false;


    refreshButton.textContent =
      "↻ Refresh";


  }


}


/* =========================================
   UPDATE FILTER OPTIONS
========================================= */


function updateFilters() {


  const typeFilter =

    document.getElementById(
      "typeFilter"
    );


  const statusFilter =

    document.getElementById(
      "statusFilter"
    );


  const currentType =
    typeFilter.value;


  const currentStatus =
    statusFilter.value;



  /* GET UNIQUE TYPES */


  const types =

    [

      ...new Set(

        allTransactions

          .map(

            transaction =>

              String(
                transaction.type ||
                ""
              )

          )

          .filter(

            value =>
              value

          )

      )

    ]

    .sort();



  /* GET UNIQUE STATUSES */


  const statuses =

    [

      ...new Set(

        allTransactions

          .map(

            transaction =>

              String(
                transaction.status ||
                ""
              )

          )

          .filter(

            value =>
              value

          )

      )

    ]

    .sort();



  typeFilter.innerHTML = `

    <option value="">

      All Types

    </option>

  `

  +

  types

    .map(

      type => `

        <option
          value="${escapeHtml(type)}"
        >

          ${escapeHtml(
            formatText(type)
          )}

        </option>

      `

    )

    .join("");



  statusFilter.innerHTML = `

    <option value="">

      All Statuses

    </option>

  `

  +

  statuses

    .map(

      status => `

        <option
          value="${escapeHtml(status)}"
        >

          ${escapeHtml(
            formatText(status)
          )}

        </option>

      `

    )

    .join("");



  typeFilter.value =
    types.includes(currentType)

      ? currentType

      : "";



  statusFilter.value =
    statuses.includes(currentStatus)

      ? currentStatus

      : "";


}


/* =========================================
   UPDATE STATISTICS
========================================= */


function updateStatistics() {


  const totalTransactions =

    allTransactions.length;



  const totalAmount =

    allTransactions

      .reduce(

        function(
          total,
          transaction
        ) {


          return (

            total +

            Number(
              transaction.amount || 0
            )

          );


        },

        0

      );



  const completed =

    allTransactions

      .filter(

        transaction =>

          String(
            transaction.status ||
            ""
          )

          .toLowerCase()

          ===

          "completed"

      );



  const pending =

    allTransactions

      .filter(

        transaction =>

          String(
            transaction.status ||
            ""
          )

          .toLowerCase()

          ===

          "pending"

      );



  const completedAmount =

    completed

      .reduce(

        function(
          total,
          transaction
        ) {


          return (

            total +

            Number(
              transaction.amount || 0
            )

          );


        },

        0

      );



  const pendingAmount =

    pending

      .reduce(

        function(
          total,
          transaction
        ) {


          return (

            total +

            Number(
              transaction.amount || 0
            )

          );


        },

        0

      );



  document.getElementById(
    "statsGrid"
  ).innerHTML = `


    <div
      class="stat-card"
    >

      <small>

        Total Transactions

      </small>

      <strong>

        ${totalTransactions.toLocaleString()}

      </strong>

    </div>



    <div
      class="stat-card"
    >

      <small>

        Total Amount

      </small>

      <strong
        class="stat-money"
      >

        ${formatMoney(
          totalAmount
        )}

      </strong>

    </div>



    <div
      class="stat-card"
    >

      <small>

        Completed

      </small>

      <strong>

        ${completed.length.toLocaleString()}

      </strong>

    </div>



    <div
      class="stat-card"
    >

      <small>

        Completed Amount

      </small>

      <strong
        class="stat-money"
      >

        ${formatMoney(
          completedAmount
        )}

      </strong>

    </div>



    <div
      class="stat-card"
    >

      <small>

        Pending

      </small>

      <strong>

        ${pending.length.toLocaleString()}

      </strong>

    </div>



    <div
      class="stat-card"
    >

      <small>

        Pending Amount

      </small>

      <strong
        class="stat-money"
      >

        ${formatMoney(
          pendingAmount
        )}

      </strong>

    </div>


  `;


}


/* =========================================
   GET FILTERED TRANSACTIONS
========================================= */


function getFilteredTransactions() {


  const search =

    document

      .getElementById(
        "searchInput"
      )

      .value

      .trim()

      .toLowerCase();



  const selectedType =

    document

      .getElementById(
        "typeFilter"
      )

      .value;



  const selectedStatus =

    document

      .getElementById(
        "statusFilter"
      )

      .value;



  return allTransactions

    .filter(

      function(
        transaction
      ) {


        const transactionType =

          String(
            transaction.type ||
            ""
          );



        const transactionStatus =

          String(
            transaction.status ||
            ""
          );



        const searchableText =

          [

            transaction.description,

            transaction.reference,

            transaction.user_id,

            transaction.type,

            transaction.status,

            transaction.amount

          ]

          .join(
            " "
          )

          .toLowerCase();



        const matchesSearch =

          !search ||

          searchableText.includes(
            search
          );



        const matchesType =

          !selectedType ||

          transactionType ===
          selectedType;



        const matchesStatus =

          !selectedStatus ||

          transactionStatus ===
          selectedStatus;



        return (

          matchesSearch &&

          matchesType &&

          matchesStatus

        );


      }

    );


}


/* =========================================
   DISPLAY TRANSACTIONS
========================================= */


function displayTransactions() {


  const transactionList =

    document.getElementById(
      "transactionList"
    );


  const transactions =

    getFilteredTransactions();



  document.getElementById(
    "resultCount"
  ).textContent =

    `${transactions.length.toLocaleString()} transaction${
      transactions.length === 1
        ? ""
        : "s"
    } found`;



  /* EMPTY */


  if (

    transactions.length ===
    0

  ) {


    transactionList.innerHTML = `


      <div
        class="empty-state"
      >


        <div
          class="empty-icon"
        >

          📭

        </div>


        <h3>

          No transactions found

        </h3>


        <p>

          No transactions match your
          current search or filters.

        </p>


      </div>


    `;


    return;


  }



  /* CREATE CARDS */


  transactionList.innerHTML =

    transactions

      .map(

        function(
          transaction
        ) {


          return createTransactionCard(
            transaction
          );


        }

      )

      .join("");


}


/* =========================================
   CREATE TRANSACTION CARD
========================================= */


function createTransactionCard(
  transaction
) {


  const status =

    String(

      transaction.status ||

      "unknown"

    );


  const type =

    String(

      transaction.type ||

      "unknown"

    );


  return `


    <article
      class="transaction-card"
    >


      <div
        class="transaction-top"
      >


        <div
          class="transaction-main"
        >


          <span
            class="
              badge
              type-badge
            "
          >

            ${escapeHtml(
              formatText(type)
            )}

          </span>


          <h2
            class="transaction-amount"
          >

            ${formatMoney(
              transaction.amount
            )}

          </h2>


        </div>



        <span
          class="
            badge
            ${getStatusClass(status)}
          "
        >

          ${escapeHtml(
            formatText(status)
          )}

        </span>


      </div>



      <p
        class="transaction-description"
      >

        ${escapeHtml(
          transaction.description ||
          "No description provided."
        )}

      </p>



      <div
        class="details-grid"
      >


        <div
          class="detail"
        >

          <small>

            Reference

          </small>

          <strong>

            ${escapeHtml(
              transaction.reference
            )}

          </strong>

        </div>



        <div
          class="detail"
        >

          <small>

            User ID

          </small>

          <strong>

            ${escapeHtml(
              transaction.user_id
            )}

          </strong>

        </div>



        <div
          class="detail"
        >

          <small>

            Balance After

          </small>

          <strong>

            ${
              transaction.balance_after ===
              null

              ||

              transaction.balance_after ===
              undefined

                ?

                "—"

                :

                formatMoney(
                  transaction.balance_after
                )
            }

          </strong>

        </div>



        <div
          class="detail"
        >

          <small>

            Created

          </small>

          <strong>

            ${formatDate(
              transaction.created_at
            )}

          </strong>

        </div>



        <div
          class="detail"
        >

          <small>

            Processed

          </small>

          <strong>

            ${formatDate(
              transaction.processed_at
            )}

          </strong>

        </div>


      </div>


    </article>


  `;


}


/* =========================================
   EVENT LISTENERS
========================================= */


document

  .getElementById(
    "searchInput"
  )

  .addEventListener(

    "input",

    function() {


      displayTransactions();


    }

  );



document

  .getElementById(
    "typeFilter"
  )

  .addEventListener(

    "change",

    function() {


      displayTransactions();


    }

  );



document

  .getElementById(
    "statusFilter"
  )

  .addEventListener(

    "change",

    function() {


      displayTransactions();


    }

  );



document

  .getElementById(
    "refreshButton"
  )

  .addEventListener(

    "click",

    async function() {


      await loadTransactions();


    }

  );


/* =========================================
   START APPLICATION
========================================= */


(async function() {


  try {


    const admin =

      await checkAdmin();



    if (!admin) {

      return;

    }



    await loadTransactions();


  }


  catch (error) {


    console.error(

      "Application startup error:",

      error

    );


    showPageError(

      error.message ||

      "Unknown application error"

    );


  }


})();


</script>
