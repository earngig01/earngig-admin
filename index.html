<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EarnGig Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0d1038;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      padding: 35px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .logo span {
      color: #7c5cff;
    }

    .admin-label {
      text-align: center;
      color: #b8b9d9;
      margin-bottom: 30px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #44466d;
      background: #171a49;
      color: white;
      margin-bottom: 18px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #6d4aff;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      line-height: 1.5;
    }

    .security-note {
      margin-top: 25px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(255,255,255,.05);
      color: #b8b9d9;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">
      Earn<span>Gig</span>
    </div>

    <div class="admin-label">
      Administration Portal
    </div>

    <h1>Admin Login</h1>

    <form id="loginForm">

      <label for="email">
        Admin Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter admin email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div
      class="message"
      id="message"
    ></div>

    <div class="security-note">
      This portal is restricted to authorized EarnGig administrators.
    </div>

  </div>


<script>

const loginForm =
  document.getElementById("loginForm");

const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    message.textContent = "";

    loginButton.disabled = true;
    loginButton.textContent = "Signing in...";

    try {

      /*
       * Sign in through Supabase Auth.
       */
      const {
        data,
        error
      } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        throw error;
      }

      if (!data.user) {
        throw new Error("Login could not be completed.");
      }


      /*
       * Check the user's admin status.
       */
      const {
        data: profile,
        error: profileError
      } = await supabaseClient
        .from("profiles")
        .select("id, full_name, is_admin, account_status")
        .eq("id", data.user.id)
        .single();


      if (profileError) {
        throw profileError;
      }


      /*
       * SECURITY CHECK
       */
      if (!profile || profile.is_admin !== true) {

        await supabaseClient.auth.signOut();

        throw new Error(
          "Access denied. This account is not an administrator."
        );
      }


      /*
       * Account must be active.
       */
      if (
        profile.account_status &&
        profile.account_status !== "active"
      ) {

        await supabaseClient.auth.signOut();

        throw new Error(
          "This administrator account is not active."
        );
      }


      /*
       * Admin verified.
       */
      window.location.href =
        "admin-dashboard.html";

    } catch (error) {

      console.error(
        "Admin login error:",
        error
      );

      message.textContent =
        error.message ||
        "Unable to sign in.";

      message.style.color =
        "#ffb4b4";

      loginButton.disabled = false;
      loginButton.textContent = "Sign In";
    }

  }
);

</script>

</body>
</html>
