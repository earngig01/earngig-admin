<!DOCTYPE html>

<html lang="en">


<head>


    <meta charset="UTF-8">


    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>
        Admin Tasks | EarnGig
    </title>



    <!-- =====================================
         MAIN STYLES
    ====================================== -->

    <link
        rel="stylesheet"
        href="styles.css?v=2"
    >



    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script src="supabase.js"></script>



    <style>


        /* =====================================
           PAGE
        ====================================== */

        .admin-page {

            padding-top: 40px;

            padding-bottom: 60px;

            min-height: 70vh;

        }


        .admin-container {

            max-width: 1200px;

            margin: 0 auto;

        }



        /* =====================================
           HEADER
        ====================================== */

        .admin-header {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 30px;

        }


        .admin-header h1 {

            margin: 8px 0 10px;

        }


        .admin-header p {

            margin: 0;

            color: #6b7280;

            line-height: 1.6;

        }



        /* =====================================
           SUMMARY
        ====================================== */

        .task-summary {

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;

        }


        .summary-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 20px;

        }


        .summary-card span {

            display: block;

            font-size: 14px;

            color: #6b7280;

            margin-bottom: 8px;

        }


        .summary-card strong {

            font-size: 28px;

            color: #1f2937;

        }



        /* =====================================
           TASK LIST
        ====================================== */

        .tasks-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 18px;

            padding: 25px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,.04);

        }


        .tasks-card-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 25px;

        }


        .tasks-card-header h2 {

            margin: 0;

        }



        /* =====================================
           LOADING
        ====================================== */

        .loading-message {

            padding: 40px 20px;

            text-align: center;

            color: #6b7280;

        }



        /* =====================================
           EMPTY STATE
        ====================================== */

        .empty-state {

            padding: 50px 20px;

            text-align: center;

            color: #6b7280;

        }


        .empty-state h3 {

            margin: 0 0 10px;

            color: #1f2937;

        }



        /* =====================================
           TASK ITEM
        ====================================== */

        .task-item {

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 22px;

            margin-bottom: 18px;

            background: #ffffff;

        }


        .task-item:last-child {

            margin-bottom: 0;

        }



        /* =====================================
           TASK TOP
        ====================================== */

        .task-top {

            display: flex;

            align-items: flex-start;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 15px;

        }


        .task-title {

            margin: 0 0 8px;

            color: #1f2937;

            font-size: 20px;

        }


        .task-category {

            display: inline-block;

            padding: 5px 10px;

            border-radius: 20px;

            background: #f3f0ff;

            color: #6d4aff;

            font-size: 12px;

            font-weight: 700;

        }



        /* =====================================
           STATUS
        ====================================== */

        .task-status {

            padding: 7px 12px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;

            text-transform: capitalize;

            white-space: nowrap;

        }


        .task-status.pending {

            background: #fff7ed;

            color: #c2410c;

        }


        .task-status.approved {

            background: #ecfdf3;

            color: #15803d;

        }


        .task-status.rejected {

            background: #fff1f2;

            color: #be123c;

        }



        /* =====================================
           DESCRIPTION
        ====================================== */

        .task-description {

            color: #4b5563;

            line-height: 1.6;

            margin: 15px 0;

            white-space: pre-wrap;

        }



        /* =====================================
           TASK LINK
        ====================================== */

        .task-link {

            display: inline-block;

            margin-bottom: 18px;

            color: #6d4aff;

            text-decoration: none;

            font-weight: 600;

            word-break: break-all;

        }


        .task-link:hover {

            text-decoration: underline;

        }



        /* =====================================
           TASK DETAILS
        ====================================== */

        .task-details {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-top: 20px;

            padding-top: 20px;

            border-top:
                1px solid #e5e7eb;

        }


        .task-detail {

            background: #f9fafb;

            padding: 13px;

            border-radius: 10px;

        }


        .task-detail span {

            display: block;

            font-size: 12px;

            color: #6b7280;

            margin-bottom: 5px;

        }


        .task-detail strong {

            color: #1f2937;

            font-size: 15px;

        }



        /* =====================================
           ACTIONS
        ====================================== */

        .task-actions {

            display: flex;

            justify-content: flex-end;

            gap: 12px;

            margin-top: 22px;

        }


        .approve-button,

        .reject-button {

            border: none;

            padding: 12px 18px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform .2s,
                opacity .2s;

        }


        .approve-button {

            background: #16a34a;

            color: white;

        }


        .reject-button {

            background: #dc2626;

            color: white;

        }


        .approve-button:hover,

        .reject-button:hover {

            transform:
                translateY(-1px);

        }


        .approve-button:disabled,

        .reject-button:disabled {

            opacity: .6;

            cursor: not-allowed;

            transform: none;

        }



        /* =====================================
           MESSAGE
        ====================================== */

        .admin-message {

            display: none;

            margin-bottom: 20px;

            padding: 15px;

            border-radius: 10px;

            line-height: 1.5;

        }


        .admin-message.success {

            display: block;

            background: #ecfdf3;

            border: 1px solid #a7f3c5;

            color: #166534;

        }


        .admin-message.error {

            display: block;

            background: #fff5f5;

            border: 1px solid #fecaca;

            color: #991b1b;

        }



        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 800px) {


            .task-summary {

                grid-template-columns:
                    1fr;

            }


            .task-details {

                grid-template-columns:
                    repeat(2, 1fr);

            }


        }


        @media (max-width: 600px) {


            .admin-header {

                flex-direction: column;

            }


            .tasks-card {

                padding: 17px;

            }


            .task-top {

                flex-direction: column;

            }


            .task-details {

                grid-template-columns:
                    1fr;

            }


            .task-actions {

                flex-direction: column;

            }


            .approve-button,

            .reject-button {

                width: 100%;

            }


        }


    </style>


</head>



<body>


<!-- =====================================
     HEADER
===================================== -->

<header>


    <div class="container nav">


        <a
            href="index.html"
            class="logo"
        >


            <span class="logo-mark">
                E
            </span>


            Earn<span>Gig</span>


        </a>



        <div>


            <a
                href="dashboard.html"
                class="btn outline"
            >

                Dashboard

            </a>


        </div>


    </div>


</header>



<!-- =====================================
     MAIN
===================================== -->

<main class="dashboard-page admin-page">


    <div class="container admin-container">



        <!-- =====================================
             PAGE HEADER
        ====================================== -->

        <div class="admin-header">


            <div>


                <span class="eyebrow">

                    ADMINISTRATION

                </span>


                <h1>

                    Task Approval

                </h1>


                <p>

                    Review submitted tasks and approve
                    or reject them.

                    Rejected tasks are automatically
                    refunded to the task owner's wallet.

                </p>


            </div>


        </div>



        <!-- =====================================
             SUMMARY
        ====================================== -->

        <div class="task-summary">


            <div class="summary-card">


                <span>

                    Pending Tasks

                </span>


                <strong id="pendingCount">

                    0

                </strong>


            </div>



            <div class="summary-card">


                <span>

                    Approved Tasks

                </span>


                <strong id="approvedCount">

                    0

                </strong>


            </div>



            <div class="summary-card">


                <span>

                    Rejected Tasks

                </span>


                <strong id="rejectedCount">

                    0

                </strong>


            </div>


        </div>



        <!-- =====================================
             MESSAGE
        ====================================== -->

        <div
            id="adminMessage"
            class="admin-message"
        ></div>



        <!-- =====================================
             TASK LIST
        ====================================== -->

        <section class="tasks-card">


            <div class="tasks-card-header">


                <h2>

                    Pending Tasks

                    Refresh

</main>

===================================== -->

<footer>


    <div class="container copy">


        © 2026 EarnGig.
        All rights reserved.


    </div>


</footer>



<!-- =====================================
     JAVASCRIPT
===================================== -->

<script>


/* =========================================
   DOM ELEMENTS
========================================= */

const tasksContainer =

    document.getElementById(
        "tasksContainer"
    );


const pendingCount =

    document.getElementById(
        "pendingCount"
    );


const approvedCount =

    document.getElementById(
        "approvedCount"
    );


const rejectedCount =

    document.getElementById(
        "rejectedCount"
    );


const adminMessage =

    document.getElementById(
        "adminMessage"
    );



/* =========================================
   FORMAT NAIRA
========================================= */

function formatNaira(amount) {


    const value =

        Number(amount || 0);


    return (

        "₦" +

        value.toLocaleString(

            "en-NG",

            {

                minimumFractionDigits: 2,

                maximumFractionDigits: 2

            }

        )

    );


}



/* =========================================
   ESCAPE HTML

   Prevents task text from injecting HTML.
========================================= */

function escapeHtml(value) {


    if (

        value === null ||

        value === undefined

    ) {


        return "";

    }


    const div =

        document.createElement(
            "div"
        );


    div.textContent = value;


    return div.innerHTML;


}



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(

    message,

    type

) {


    adminMessage.textContent =

        message;


    adminMessage.className =

        "admin-message " +

        type;


}



/* =========================================
   CLEAR MESSAGE
========================================= */

function clearMessage() {


    adminMessage.textContent =

        "";


    adminMessage.className =

        "admin-message";


}



/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {


    try {


        const {

            data,

            error

        } =

            await supabaseClient
                .auth
                .getUser();



        if (

            error ||

            !data ||

            !data.user

        ) {


            window.location.href =

                "login.html";


            return null;

        }


        return data.user;


    }


    catch (error) {


        console.error(

            "Authentication error:",

            error

        );


        window.location.href =

            "login.html";


        return null;


    }


}



/* =========================================
   LOAD TASK STATISTICS
========================================= */

async function loadTaskStatistics() {


    try {


        /* =====================================
           PENDING
        ====================================== */

        const {

            count: pending,

            error: pendingError

        } =

            await supabaseClient

                .from("tasks")

                .select(

                    "*",

                    {

                        count: "exact",

                        head: true

                    }

                )

                .eq(

                    "status",

                    "pending"

                );


        if (pendingError) {


            throw pendingError;

        }



        /* =====================================
           APPROVED
        ====================================== */

        const {

            count: approved,

            error: approvedError

        } =

            await supabaseClient

                .from("tasks")

                .select(

                    "*",

                    {

                        count: "exact",

                        head: true

                    }

                )

                .eq(

                    "status",

                    "approved"

                );


        if (approvedError) {


            throw approvedError;

        }



        /* =====================================
           REJECTED
        ====================================== */

        const {

            count: rejected,

            error: rejectedError

        } =

            await supabaseClient

                .from("tasks")

                .select(

                    "*",

                    {

                        count: "exact",

                        head: true

                    }

                )

                .eq(

                    "status",

                    "rejected"

                );


        if (rejectedError) {


            throw rejectedError;

        }



        /* =====================================
           UPDATE DISPLAY
        ====================================== */

        pendingCount.textContent =

            pending || 0;


        approvedCount.textContent =

            approved || 0;


        rejectedCount.textContent =

            rejected || 0;


    }


    catch (error) {


        console.error(

            "Statistics error:",

            error

        );


    }


}



/* =========================================
   LOAD PENDING TASKS
========================================= */

async function loadTasks() {


    clearMessage();


    tasksContainer.innerHTML =

        `

        <div class="loading-message">

            Loading tasks...

        </div>

        `;


    try {


        /* =====================================
           GET CURRENT USER
        ====================================== */

        const user =

            await getCurrentUser();


        if (!user) {


            return;

        }



        /* =====================================
           LOAD TASKS
        ====================================== */

        const {

            data: tasks,

            error

        } =

            await supabaseClient

                .from("tasks")

                .select(`

                    id,

                    title,

                    description,

                    category,

                    task_link,

                    reward_amount,

                    max_participants,

                    participant_count,

                    platform_fee,

                    total_amount,

                    status,

                    user_id,

                    created_at

                `)

                .eq(

                    "status",

                    "pending"

                )

                .order(

                    "created_at",

                    {

                        ascending: true

                    }

                );


        if (error) {


            throw error;

        }



        /* =====================================
           EMPTY TASKS
        ====================================== */

        if (

            !tasks ||

            tasks.length === 0

        ) {


            tasksContainer.innerHTML =

                `

                <div class="empty-state">


                    <h3>

                        No Pending Tasks

                    </h3>


                    <p>

                        There are currently no tasks
                        waiting for approval.

                    </p>


                </div>

                `;


            await loadTaskStatistics();


            return;

        }



        /* =====================================
           BUILD TASK HTML
        ====================================== */

        tasksContainer.innerHTML =

            tasks.map(

                function(task) {


                    const taskDate =

                        task.created_at

                            ?

                        new Date(

                            task.created_at

                        ).toLocaleString(

                            "en-NG",

                            {

                                dateStyle: "medium",

                                timeStyle: "short"

                            }

                        )

                            :

                        "Unknown";


                    const taskLink =

                        task.task_link

                            ?

                        `

                        <a

                            href="${escapeHtml(task.task_link)}"

                            target="_blank"

                            rel="noopener noreferrer"

                            class="task-link"

                        >

                            Open Task Link →

                        </a>

                        `

                            :

                        "";



                    return `


                    <article class="task-item">


                        <!-- =========================
                             TASK HEADER
                        ========================== -->

                        <div class="task-top">


                            <div>


                                <h3 class="task-title">

                                    ${escapeHtml(task.title)}

                                </h3>


                                <span class="task-category">

                                    ${escapeHtml(task.category)}

                                </span>


                            </div>



                            <span
                                class="task-status pending"
                            >

                                Pending

                            </span>


                        </div>



                        <!-- =========================
                             DESCRIPTION
                        ========================== -->

                        <div class="task-description">

                            ${escapeHtml(task.description)}

                        </div>



                        <!-- =========================
                             TASK LINK
                        ========================== -->

                        ${taskLink}



                        <!-- =========================
                             TASK DETAILS
                        ========================== -->

                        <div class="task-details">


                            <div class="task-detail">


                                <span>

                                    Participants

                                </span>


                                <strong>

                                    ${Number(
                                        task.max_participants || 0
                                    ).toLocaleString("en-NG")}

                                </strong>


                            </div>



                            <div class="task-detail">


                                <span>

                                    Reward Each

                                </span>


                                <strong>

                                    ${formatNaira(
                                        task.reward_amount
                                    )}

                                </strong>


                            </div>



                            <div class="task-detail">


                                <span>

                                    Total Paid

                                </span>


                                <strong>

                                    ${formatNaira(
                                        task.total_amount
                                    )}

                                </strong>


                            </div>



                            <div class="task-detail">


                                <span>

                                    Submitted

                                </span>


                                <strong>

                                    ${escapeHtml(
                                        taskDate
                                    )}

                                </strong>


                            </div>


                        </div>



                        <!-- =========================
                             ACTIONS
                        ========================== -->

                        <div class="task-actions">


                            <button

                                type="button"

                                class="reject-button"

                                id="reject-${task.id}"

                                onclick="rejectTask('${task.id}')"

                            >

                                Reject & Refund

                            </button>



                            <button

                                type="button"

                                class="approve-button"

                                id="approve-${task.id}"

                                onclick="approveTask('${task.id}')"

                            >

                                Approve

                            </button>


                        </div>


                    </article>


                    `;


                }

            ).join("");



        /* =====================================
           UPDATE STATISTICS
        ====================================== */

        await loadTaskStatistics();


    }


    catch (error) {


        console.error(

            "Unable to load tasks:",

            error

        );


        tasksContainer.innerHTML =

            `

            <div class="empty-state">


                <h3>

                    Unable to Load Tasks

                </h3>


                <p>

                    ${escapeHtml(

                        error.message ||

                        "Please try again."

                    )}

                </p>


            </div>

            `;


        showMessage(

            error.message ||

            "Unable to load tasks.",

            "error"

        );


    }


}



/* =========================================
   APPROVE TASK
========================================= */

async function approveTask(taskId) {


    if (!taskId) {


        alert(

            "Invalid task ID."

        );


        return;

    }



    /* =====================================
       CONFIRM
    ====================================== */

    const confirmed =

        confirm(


            "APPROVE TASK?\n\n" +


            "This task will become available " +

            "to EarnGig users."


        );


    if (!confirmed) {


        return;

    }



    const approveButton =

        document.getElementById(

            `approve-${taskId}`

        );


    const rejectButton =

        document.getElementById(

            `reject-${taskId}`

        );



    try {


        /* =====================================
           DISABLE BUTTONS
        ====================================== */

        if (approveButton) {


            approveButton.disabled = true;


            approveButton.textContent =

                "Approving...";


        }


        if (rejectButton) {


            rejectButton.disabled = true;


        }



        /* =====================================
           APPROVE TASK

           NOTE:

           For maximum security, approval should
           also eventually use a PostgreSQL RPC
           with an admin authorization check.
        ====================================== */

        const {

            error

        } =

            await supabaseClient

                .from("tasks")

                .update({

                    status: "approved",

                    updated_at:

                        new Date()
                            .toISOString()

                })

                .eq(

                    "id",

                    taskId

                )

                .eq(

                    "status",

                    "pending"

                );



        if (error) {


            throw error;

        }



        /* =====================================
           SUCCESS
        ====================================== */

        showMessage(

            "Task approved successfully.",

            "success"

        );



        /* =====================================
           RELOAD
        ====================================== */

        await loadTasks();


    }


    catch (error) {


        console.error(

            "Task approval failed:",

            error

        );


        showMessage(

            error.message ||

            "Unable to approve task.",

            "error"

        );


    }


    finally {


        if (approveButton) {


            approveButton.disabled = false;


            approveButton.textContent =

                "Approve";


        }


        if (rejectButton) {


            rejectButton.disabled = false;


        }


    }


}



/* =========================================
   REJECT TASK WITH REFUND

   IMPORTANT:

   This function does NOT directly update
   the tasks table.

   Instead, it calls:

       reject_task_with_refund

   The PostgreSQL function handles:

   1. Locking the task
   2. Checking task status
   3. Preventing double refunds
   4. Locking the user's wallet
   5. Adding total_amount back
   6. Changing status to rejected
   7. Creating refund transaction

   total_earned is NOT updated.

   A refund is NOT an earning.
========================================= */

async function rejectTask(taskId) {


    /* =====================================
       VALIDATE TASK ID
    ====================================== */

    if (!taskId) {


        alert(

            "Invalid task ID."

        );


        return;

    }



    /* =====================================
       CONFIRM REJECTION
    ====================================== */

    const confirmed =

        confirm(


            "REJECT TASK?\n\n" +


            "The task will be rejected.\n\n" +


            "The FULL amount paid by the task owner " +

            "will be refunded to their wallet.\n\n" +


            "The refund will NOT be counted " +

            "as an earning.\n\n" +


            "Do you want to continue?"


        );


    if (!confirmed) {


        return;

    }



    /* =====================================
       BUTTONS
    ====================================== */

    const rejectButton =

        document.getElementById(

            `reject-${taskId}`

        );


    const approveButton =

        document.getElementById(

            `approve-${taskId}`

        );



    try {


        /* =====================================
           DISABLE BUTTONS
        ====================================== */

        if (rejectButton) {


            rejectButton.disabled = true;


            rejectButton.textContent =

                "Refunding...";


        }


        if (approveButton) {


            approveButton.disabled = true;


        }



        clearMessage();



        /* =====================================
           CALL SUPABASE RPC

           The database function performs ALL
           financial operations safely.

           Do NOT replace this with:

           supabaseClient
               .from("tasks")
               .update(...)

           because that would reject the task
           without refunding the wallet.
        ====================================== */

        const {

            data,

            error

        } =

            await supabaseClient.rpc(

                "reject_task_with_refund",

                {

                    p_task_id:

                        taskId

                }

            );



        /* =====================================
           CHECK ERROR
        ====================================== */

        if (error) {


            console.error(

                "Reject task RPC error:",

                error

            );


            throw error;

        }



        /* =====================================
           CHECK RESPONSE
        ====================================== */

        if (

            !data ||

            data.success !== true

        ) {


            throw new Error(

                data?.message ||

                "Task rejection failed."

            );


        }



        /* =====================================
           FORMAT REFUND
        ====================================== */

        const refundAmount =

            formatNaira(

                data.amount_refunded

            );



        /* =====================================
           FORMAT BALANCE
        ====================================== */

        const newBalance =

            formatNaira(

                data.new_wallet_balance

            );



        /* =====================================
           SUCCESS MESSAGE
        ====================================== */

        showMessage(


            "Task rejected successfully. " +


            refundAmount +


            " has been refunded to the task " +

            "owner's wallet. " +


            "New wallet balance: " +


            newBalance +


            ". The refund was not counted as earnings.",


            "success"

        );



        /* =====================================
           LOG
        ====================================== */

        console.log(

            "Task rejected successfully:",

            data

        );



        /* =====================================
           RELOAD TASKS

           Short delay allows the administrator
           to see the success message.
        ====================================== */

        setTimeout(

            async function() {


                await loadTasks();


            },

            1000

        );


    }


    catch (error) {


        console.error(

            "Task rejection failed:",

            error

        );


        let message =

            error?.message ||

            "Unable to reject task. Please try again.";



        const lowerMessage =

            String(

                message

            ).toLowerCase();



        /* =====================================
           FRIENDLY ERRORS
        ====================================== */

        if (

            lowerMessage.includes(

                "already been rejected"

            )

        ) {


            message =

                "This task has already been " +

                "rejected and refunded.";


        }


        else if (

            lowerMessage.includes(

                "task not found"

            )

        ) {


            message =

                "The task could not be found.";


        }


        else if (

            lowerMessage.includes(

                "wallet not found"

            )

        ) {


            message =

                "The task owner's wallet could " +

                "not be found. The rejection was " +

                "not completed.";


        }


        else if (

            lowerMessage.includes(

                "not authenticated"

            )

        ) {


            message =

                "Your session has expired. " +

                "Please log in again.";


        }


        else if (

            lowerMessage.includes(

                "only pending tasks"

            )

        ) {


            message =

                "Only pending tasks can be rejected.";


        }



        /* =====================================
           SHOW ERROR
        ====================================== */

        showMessage(

            message,

            "error"

        );


    }


    finally {


        /* =====================================
           RE-ENABLE BUTTONS

           loadTasks() may remove the buttons,
           but this is safe if they still exist.
        ====================================== */

        if (rejectButton) {


            rejectButton.disabled = false;


            rejectButton.textContent =

                "Reject & Refund";


        }


        if (approveButton) {


            approveButton.disabled = false;


        }


    }


}



/* =========================================
   INITIALIZE PAGE
========================================= */

async function initializeAdminTasks() {


    const user =

        await getCurrentUser();


    if (!user) {


        return;

    }



    await Promise.all([


        loadTaskStatistics(),


        loadTasks()


    ]);


}



/* =========================================
   START
========================================= */

initializeAdminTasks();


</script>
