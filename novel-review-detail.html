<script>
                          
 let currentNovel = null;
let currentUser = null;

let manualQuizQuestions = [];


/* =====================================================
   GET NOVEL ID
   ===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const novelId =
  params.get("id");


if (!novelId) {

  alert(
    "No novel was selected."
  );


  window.location.href =
    "novel-review.html";

}


/* =====================================================
   SECURITY
   ===================================================== */

async function checkAdmin() {

  const {
    data: { user },
    error
  } =
    await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href =
      "index.html";

    return null;

  }


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "full_name, is_admin, account_status"
      )
      .eq(
        "id",
        user.id
      )
      .single();


  if (
    profileError ||
    !profile ||
    profile.is_admin !== true
  ) {

    await supabaseClient.auth.signOut();


    alert(
      "Access denied. Administrator privileges are required."
    );


    window.location.href =
      "index.html";


    return null;

  }


  if (
    profile.account_status &&
    profile.account_status !== "active"
  ) {

    await supabaseClient.auth.signOut();


    alert(
      "This administrator account is not active."
    );


    window.location.href =
      "index.html";


    return null;

  }


  currentUser =
    user;


  return user;

}

quality_assessment,
assessment_notes

/* =====================================================
   VIEW MANUSCRIPT
   ===================================================== */

async function viewManuscript() {

  if (
    !currentNovel?.manuscript_url
  ) {

    alert(
      "No manuscript was uploaded."
    );


    return;

  }


  const {
    data,
    error
  } =
    await supabaseClient.storage
      .from("novel-manuscripts")
      .createSignedUrl(
        currentNovel.manuscript_url,
        3600
      );


  if (error) {

    console.error(
      "Signed URL error:",
      error
    );


    alert(
      "Could not open the manuscript:\n\n" +
      error.message
    );


    return;

  }


  window.open(
    data.signedUrl,
    "_blank"
  );

}


/* =====================================================
   PROCESS MANUSCRIPT
   ===================================================== */

async function processNovelManuscript() {

  if (
    !currentNovel ||
    !currentNovel.manuscript_url
  ) {

    alert(
      "No manuscript was found for this novel."
    );


    return false;

  }


  const statusBox =
    document.getElementById(
      "processorStatus"
    );


  if (statusBox) {

    statusBox.className =
      "processor-status show";


    statusBox.textContent =
      "Downloading and processing manuscript. Please wait...";

  }


  try {

    /* =========================
       CREATE SIGNED URL
       ========================= */

    const {
      data: signedData,
      error: signedError
    } =
      await supabaseClient.storage
        .from("novel-manuscripts")
        .createSignedUrl(
          currentNovel.manuscript_url,
          3600
        );


    if (signedError) {

      throw signedError;

    }


    /* =========================
       DOWNLOAD FILE
       ========================= */

    const response =
      await fetch(
        signedData.signedUrl
      );


    if (!response.ok) {

      throw new Error(
        "The manuscript could not be downloaded."
      );

    }


    const arrayBuffer =
      await response.arrayBuffer();
    const fileName =
      currentNovel.manuscript_url
        .toLowerCase();


    let processedPages = 0;


    /* =========================
       PROCESS PDF
       ========================= */

    if (
      fileName.endsWith(".pdf")
    ) {

      if (
        typeof pdfjsLib ===
        "undefined"
      ) {

        throw new Error(
          "PDF processor could not be loaded."
        );

      }


      if (statusBox) {

        statusBox.textContent =
          "Processing PDF manuscript...";

      }


      const pdf =
        await pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;


      processedPages =
        pdf.numPages;

    }


    /* =========================
       PROCESS DOCX
       ========================= */

    else if (
      fileName.endsWith(".docx")
    ) {

      if (
        typeof mammoth ===
        "undefined"
      ) {

        throw new Error(
          "DOCX processor could not be loaded."
        );

      }


      if (statusBox) {

        statusBox.textContent =
          "Processing DOCX manuscript...";

      }


      const result =
        await mammoth.extractRawText({
          arrayBuffer:
            arrayBuffer
        });


      const text =
        result.value || "";


      /*
       * DOCX files do not contain
       * a reliable browser-readable
       * page count.
       *
       * We estimate pages using
       * approximately 500 words
       * per manuscript page.
       */

      const words =
        text
          .trim()
          .split(/\s+/)
          .filter(
            word =>
              word.length > 0
          );


      const wordCount =
        words.length;


      processedPages =
        Math.max(
          1,
          Math.ceil(
            wordCount / 500
          )
        );

    }


    /* =========================
       UNSUPPORTED FILE
       ========================= */

    else {

      throw new Error(
        "Unsupported manuscript format. Please upload a PDF or DOCX file."
      );

    }


    /* =========================
       VALIDATE RESULT
       ========================= */

    if (
      !Number.isFinite(
        processedPages
      ) ||
      processedPages <= 0
    ) {

      throw new Error(
        "A valid page count could not be determined."
      );

    }


    /* =========================
       UPDATE PAGE FIELD
       ========================= */

    const pagesInput =
      document.getElementById(
        "pages"
      );


    if (pagesInput) {

      pagesInput.value =
        processedPages;

    }


    /* =========================
       SAVE PAGE COUNT
       ========================= */

    const {
      error: updateError
    } =
      await supabaseClient
        .from("novels")
        .update({

          page_count:
            processedPages

        })
        .eq(
          "id",
          currentNovel.id
        );


    if (updateError) {

      throw updateError;

    }


    currentNovel.page_count =
      processedPages;


    if (statusBox) {

      statusBox.textContent =
        `Manuscript processed successfully. ${processedPages} page(s) detected.`;

    }


    showMessage(
      `Manuscript processed successfully. ${processedPages} page(s) detected.`,
      "success"
    );


    return processedPages;

  }


  catch (error) {

    console.error(
      "Manuscript processing error:",
      error
    );


    if (statusBox) {

      statusBox.textContent =
        "Processing failed: " +
        (
          error.message ||
          "Unknown error"
        );

    }


    showMessage(
      "Could not process the manuscript: " +
      (
        error.message ||
        "Unknown error"
      ),
      "error"
    );


    return false;

  }

}


/* =====================================================
   VALIDATE QUALITY
   ===================================================== */

function validateQuality() {

  const quality =
    document.getElementById(
      "quality"
    )?.value;


  if (!quality) {

    alert(
      "Please select a quality assessment."

/* =====================================================
   VALIDATE PAGES
   ===================================================== */

function validatePages() {

  const pages =

      pages
    ) ||
    pages <= 0

/* =====================================================

/* =====================================================
   SAVE NOVEL ASSESSMENT
   ===================================================== */

async function saveNovelAssessment() {

  if (!currentNovel) {

    alert(
      "No novel is currently loaded."
    );


    return false;

  }


  if (!validateQuality()) {

    return false;

  }


  if (!validatePages()) {

    return false;

  }


  if (!validateReward()) {

    return false;

  }


  if (!validateReaders()) {

    return false;

  }


  if (!validateFee()) {

    return false;

  }


  if (!validateReadingPercent()) {

    return false;

  }


  const quality =
    document.getElementById(
      "quality"

  const pages =
    Number(
      document.getElementById(
        "pages"
      ).value
    );

    Number(
      document.getElementById(
        "reward"
      ).value
    );


  const readers =
    Number(
      document.getElementById(
        "readers"
      ).value
    );


  const fee =
    Number(
      document.getElementById(
        "fee"
      ).value
    );


  const readingPercent =
    Number(
      document.getElementById(
        "readingPercent"
      ).value
    );

    document.getElementById(

  const {
    error
  } =

          quality,

        assessment_notes:
          notes,

        page_count:
          pages,

        approved_reader_reward:
          reward,

        approved_reader_count:
          readers,

        writer_listing_fee:
          fee,

        required_reading_percent:
          readingPercent

      })
      .eq(
        "id",
        currentNovel.id
      );


  if (error) {

    console.error(
      "Assessment saving error:",
      error
    );


    showMessage(
      "Could not save the assessment: " +

      "error"
    );

  currentNovel.quality_assessment =

  currentNovel.assessment_notes =
    notes;


  currentNovel.page_count =
    pages;


  currentNovel.approved_reader_reward =
    reward;


  currentNovel.approved_reader_count =
    readers;


  currentNovel.writer_listing_fee =
    fee;


  currentNovel.required_reading_percent =
    readingPercent;


  return true;

}

/* =====================================================
   REMOVE QUIZ QUESTION
   ===================================================== */

function removeQuizQuestion(
  button
) {

  const card =
    button.closest(
      ".quiz-question-card"
    );


  if (card) {

    card.remove();

  }


  const container =
    document.getElementById(
      "quizQuestionsContainer"
    );


  if (!container) {

    return;

  }


  Array.from(
    container.children
  ).forEach(
    (
      questionCard,
      index
    ) => {

      const heading =
        questionCard.querySelector(
          "h3"
        );


      if (heading) {

        heading.textContent =
          `Question ${index + 1}`;

      }

    }
  );

}


/* =====================================================
   LOAD QUIZ QUESTIONS
   ===================================================== */
async function loadQuizQuestions() {

  const container =
    document.getElementById(
      "quizQuestionsContainer"
    );


  if (!container) {

    return;

  }


  container.innerHTML = "";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("novel_quiz_questions")
      .select(`
        id,
        question_text,
        option_a,
        option_b,
        option_c,
        option_d,
        correct_option,
        question_order
      `)
      .eq(
        "novel_id",
        novelId
      )
      .order(
        "question_order",
        {
          ascending: true
        }
      );


  if (error) {

    console.error(
      "Quiz loading error:",
      error
    );


    showMessage(
      "Could not load quiz questions: " +
      error.message,
      "error"
    );


    return;

  }


  if (
    data &&
    data.length > 0
  ) {

    data.forEach(
      question => {

        addQuizQuestion(
          question
        );

      }
    );

  }

  else {

    addQuizQuestion();

  }

}


/* =====================================================
   SAVE QUIZ QUESTIONS
   ===================================================== */
async function saveQuizQuestions() {

  if (!currentNovel) {

    alert(
      "No novel is currently loaded."
    );

    return;

  }


  const container =
    document.getElementById(
      "quizQuestionsContainer"
    );


  if (!container) {

    return;

  }


  const cards =
    Array.from(
      container.querySelectorAll(
        ".quiz-question-card"
      )
    );


  if (cards.length === 0) {

    alert(
      "Please add at least one quiz question."
    );

    return;

  }


  const questions = [];


  for (
    let index = 0;
    index < cards.length;
    index++
  ) {

    const card =
      cards[index];


    const questionText =
      card.querySelector(
        ".quiz-question-text"
      ).value.trim();


    const optionA =
      card.querySelector(
        ".quiz-option-a"
      ).value.trim();


    const optionB =
      card.querySelector(
        ".quiz-option-b"
      ).value.trim();


    const optionC =
      card.querySelector(
        ".quiz-option-c"
      ).value.trim();


    const optionD =
      card.querySelector(
        ".quiz-option-d"
      ).value.trim();


    const correctOption =
      card.querySelector(
        ".quiz-correct-answer"
      ).value;


    if (
      !questionText ||
      !optionA ||
      !optionB ||
      !optionC ||
      !optionD ||
      !correctOption
    ) {

      alert(
        "Please complete every field for each quiz question."
      );

      return;

    }


    questions.push({

      novel_id:
        currentNovel.id,


      question_text:
        questionText,


      option_a:
        optionA,


      option_b:
        optionB,


      option_c:
        optionC,


      option_d:
        optionD,


      correct_option:
        correctOption,


      question_order:
        index + 1

    });

  }


  const {
    error: deleteError
  } =
    await supabaseClient
      .from(
        "novel_quiz_questions"
      )
      .delete()
      .eq(
        "novel_id",
        currentNovel.id
      );


  if (deleteError) {

    console.error(
      "Quiz deletion error:",
      deleteError
    );


    showMessage(
      "Could not update the quiz: " +
      deleteError.message,
      "error"
    );


    return;

  }


  const {
    error: insertError
  } =
    await supabaseClient
      .from(
        "novel_quiz_questions"
      )
      .insert(
        questions
      );


  if (insertError) {

    console.error(
      "Quiz saving error:",
      insertError
    );


    showMessage(
      "Could not save the quiz: " +
      insertError.message,
      "error"
    );


    return;

  }


  showMessage(
    "Quiz saved successfully.",
    "success"
  );

}




  /* =========================
     INSERT NEW QUESTIONS
     ========================= */

  const {
    error: insertError
  } =
    await supabaseClient
      .from(
        "novel_quiz_questions"
      )
      .insert(
        questions
      );


  if (insertError) {

    console.error(
      "Quiz saving error:",
      insertError
    );


    showMessage(
      "Could not save the quiz: " +
      insertError.message,
      "error"
    );


    return;

  }


  showMessage(
    "Quiz saved successfully.",
    "success"
  );

}

/* =====================================================
   APPROVE NOVEL
   ===================================================== */

async function approveNovel() {

  if (!currentNovel) {

    return;

  }
const quizValid =
  await validateQuizBeforeApproval();


if (!quizValid) {

  return;

}

  const confirmed =
    confirm(
      "Are you sure you want to approve this novel?"
    );


  if (!confirmed) {

    return;

  }


const saved =
  await saveNovelAssessment();

if (!saved) {
  return;
}

const reward =
  Number(currentNovel.approved_reader_reward);

if (
  !Number.isFinite(reward) ||
  reward <= 0
) {

  showMessage(
    "Invalid reader reward amount.",

  );

  return;
}

  const {

      .from("novels")

          "pending"

  if (error) {

    );


    showMessage(

    );

  }


  currentNovel.status =

  currentNovel.submission_status =
    "approved";


  showMessage(
    "Novel approved successfully.",
    "success"
  );


  await loadNovel();

}

/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  if (!message) {

    return;

  }


  message.textContent =
    text;


  message.className =
    `message show ${type}`;


  window.scrollTo({

    top: 0,

    behavior:
      "smooth"

  });


  setTimeout(
    () => {

      message.className =
        "message";

    },
    6000
  );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(
  value
) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const div =
    document.createElement(
      "div"
    );

  div.textContent =
    String(value);


  return div.innerHTML;

}
