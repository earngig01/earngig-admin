<!-- ========================================
     JAVASCRIPT
======================================== -->

<script>


/* ========================================
   GLOBAL VARIABLES
======================================== */

let allTasks = [];



/* ========================================
   GET CURRENT ADMIN
======================================== */

async function checkAdmin() {


  const {

    data: {
      user
    },

    error

  } =
  await supabaseClient
    .auth
    .getUser();



  if (
    error ||
    !user
  ) {


    window.location.href =
      "index.html";


    return null;

  }



  const {

    data: profile,

    error: profileError

  } =
  await supabaseClient


    .from("profiles")


    .select(
      "is_admin, account_status"
    )


    .eq(
      "id",
      user.id
    )


    .single();



  if (


    profileError ||


    !profile ||


    profile.is_admin !== true


  ) {


    await supabaseClient
      .auth
      .signOut();



    alert(
      "Access denied. Administrator privileges are required."
    );



    window.location.href =
      "index.html";


    return null;

  }



  if (


    profile.account_status &&


    profile.account_status !==
    "active"


  ) {


    await supabaseClient
      .auth
      .signOut();



    alert(
      "Administrator account is not active."
    );



    window.location.href =
      "index.html";


    return null;

  }



  return user;


}



/* ========================================
   ESCAPE HTML
======================================== */

function escapeHtml(value) {


  return String(
    value ?? ""
  )


    .replaceAll(
      "&",
      "&amp;"
    )


    .replaceAll(
      "<",
      "&lt;"
    )


    .replaceAll(
      ">",
      "&gt;"
    )


    .replaceAll(
      '"',
      "&quot;"
    )


    .replaceAll(
      "'",
      "&#039;"
    );


}



/* ========================================
   FORMAT MONEY
======================================== */

function formatMoney(amount) {


  return (

    "₦" +

    Number(
      amount || 0
    ).toLocaleString(
      "en-NG"
    )

  );


}



/* ========================================
   FORMAT DATE
======================================== */

function formatDate(date) {


  if (!date) {

    return "Unknown";

  }


  return new Date(
    date
  ).toLocaleDateString(
    "en-NG",
    {

      year:
        "numeric",

      month:
        "short",

      day:
        "numeric"

    }
  );


}



/* ========================================
   STATUS CLASS
======================================== */

function getStatusClass(status) {


  const value =
    String(
      status || "pending"
    )
    .toLowerCase();



  if (
    value === "active" ||
    value === "approved"
  ) {

    return "status-active";

  }


  if (
    value === "paused"
  ) {

    return "status-paused";

  }


  if (
    value === "rejected"
  ) {

    return "status-rejected";

  }


  if (
    value === "completed"
  ) {

    return "status-completed";

  }


  return "status-pending";


}



/* ========================================
   FORMAT STATUS
======================================== */

function formatStatus(status) {


  const value =
    String(
      status || "pending"
    )
    .toLowerCase();



  if (
    value === "pending"
  ) {

    return "Pending Approval";

  }


  if (
    value === "active"
  ) {

    return "Active";

  }


  if (
    value === "approved"
  ) {

    return "Approved";

  }


  if (
    value === "paused"
  ) {

    return "Paused";

  }


  if (
    value === "completed"
  ) {

    return "Completed";

  }


  if (
    value === "rejected"
  ) {

    return "Rejected";

  }


  return escapeHtml(
    status
  );


}



/* ========================================
   LOAD TASKS
======================================== */

async function loadTasks() {


  const taskList =
    document.getElementById(
      "taskList"
    );



  taskList.innerHTML = `


    <div class="empty-state">


      <div class="empty-icon">

        ⏳

      </div>


      <h3>

        Loading tasks...

      </h3>


      <p>

        Please wait while tasks are loaded.

      </p>


    </div>


  `;



  /*
    Load tasks together with the
    task creator's username.
  */

  const {

    data: tasks,

    error

  } =
  await supabaseClient


    .from("tasks")


    .select(`
      *,
      profiles (
        username
      )
    `)


    .order(
      "created_at",
      {

        ascending:
          false

      }
    );



  if (error) {


    console.error(
      "Task loading error:",
      error
    );



    taskList.innerHTML = `


      <div class="error-box">


        <strong>

          Unable to load tasks.

        </strong>


        <p>

          ${
            escapeHtml(
              error.message
            )
          }

        </p>


      </div>


    `;


    return;

  }



  allTasks =
    tasks || [];



  updateStatistics(
    allTasks
  );



  applyFilter();


}



/* ========================================
   UPDATE STATISTICS
======================================== */

function updateStatistics(tasks) {


  const total =
    tasks.length;



  const pending =
    tasks.filter(
      function(task) {


        return String(
          task.status || ""
        )
        .toLowerCase() ===
        "pending";


      }
    ).length;



  const active =
    tasks.filter(
      function(task) {


        const status =
          String(
            task.status || ""
          )
          .toLowerCase();



        return (


          status === "active" ||


          status === "approved"


        );


      }
    ).length;



  const paused =
    tasks.filter(
      function(task) {


        return String(
          task.status || ""
        )
        .toLowerCase() ===
        "paused";


      }
    ).length;



  const rejected =
    tasks.filter(
      function(task) {


        return String(
          task.status || ""
        )
        .toLowerCase() ===
        "rejected";


      }
    ).length;



  document.getElementById(
    "totalTasks"
  ).textContent =
    total;



  document.getElementById(
    "pendingTasks"
  ).textContent =
    pending;



  document.getElementById(
    "activeTasks"
  ).textContent =
    active;



  document.getElementById(
    "pausedTasks"
  ).textContent =
    paused;



  document.getElementById(
    "rejectedTasks"
  ).textContent =
    rejected;


}



/* ========================================
   APPLY FILTER
======================================== */

function applyFilter() {


  const filter =
    document.getElementById(
      "statusFilter"
    ).value;



  if (
    filter === "all"
  ) {


    renderTasks(
      allTasks
    );


    return;

  }



  const filteredTasks =
    allTasks.filter(
      function(task) {


        return String(
          task.status || ""
        )
        .toLowerCase() ===
        filter;


      }
    );



  renderTasks(
    filteredTasks
  );


}



/* ========================================
   RENDER TASKS
======================================== */

function renderTasks(tasks) {


  const taskList =
    document.getElementById(
      "taskList"
    );



  if (
    !tasks ||
    tasks.length === 0
  ) {


    taskList.innerHTML = `


      <div class="empty-state">


        <div class="empty-icon">

          📋

        </div>


        <h3>

          No tasks found

        </h3>


        <p>

          There are no tasks matching
          the selected filter.

        </p>


      </div>


    `;


    return;

  }



  taskList.innerHTML =
    tasks.map(
      function(task) {


        /* ================================
           PARTICIPANTS
        ================================= */

        const participants =
          Number(

            task.max_participants ||

            task.participant_count ||

            0

          );



        /* ================================
           REWARD
        ================================= */

        const reward =
          Number(
            task.reward_amount || 0
          );



        /* ================================
           TASK BUDGET
        ================================= */

        const taskBudget =
          participants *
          reward;



        /* ================================
           PLATFORM FEE
        ================================= */

        const platformFee =

          task.platform_fee !==
          undefined

            ?

            Number(
              task.platform_fee || 0
            )

            :

            taskBudget *
            0.20;



        /* ================================
           TOTAL AMOUNT
        ================================= */

        const totalAmount =

          task.total_amount !==
          undefined

            ?

            Number(
              task.total_amount || 0
            )

            :

            taskBudget +
            platformFee;



        /* ================================
           TASK CREATOR USERNAME
        ================================= */

        const username =

          task.profiles &&
          task.profiles.username

            ?

            task.profiles.username

            :

            "Unknown User";



        /* ================================
           STATUS
        ================================= */

        const status =
          String(
            task.status || "pending"
          )
          .toLowerCase();



        return `


          <article class="task-card">


            <!-- ============================
                 TASK TOP
            ============================= -->

            <div class="task-top">


              <div>


                <span class="eyebrow">

                  ${
                    escapeHtml(
                      task.category ||
                      "TASK"
                    )
                  }

                </span>


                <h3 class="task-title">

                  ${
                    escapeHtml(
                      task.title ||
                      "Untitled Task"
                    )
                  }

                </h3>


                <p class="task-description">

                  ${
                    escapeHtml(
                      task.description ||
                      "No description provided."
                    )
                  }

                </p>


              </div>



              <span
                class="
                  status
                  ${getStatusClass(status)}
                "
              >

                ${formatStatus(status)}

              </span>


            </div>



            <!-- ============================
                 TASK DETAILS
            ============================= -->

            <div class="task-meta">


              <!-- ==========================
                   USERNAME
              =========================== -->

              <div class="meta-item">


                <span>
                  Posted By
                </span>


                <strong>

                  👤 ${escapeHtml(username)}

                </strong>


              </div>



              <div class="meta-item">


                <span>
                  Participants
                </span>


                <strong>

                  ${participants}

                </strong>


              </div>



              <div class="meta-item">


                <span>
                  Reward / Person
                </span>


                <strong>

                  ${formatMoney(reward)}

                </strong>


              </div>



              <div class="meta-item">


                <span>
                  Task Budget
                </span>


                <strong>

                  ${formatMoney(taskBudget)}

                </strong>


              </div>



              <div class="meta-item">


                <span>
                  Platform Fee
                </span>


                <strong>

                  ${formatMoney(platformFee)}

                </strong>


              </div>



              <div class="meta-item">


                <span>
                  Total Payment
                </span>


                <strong>

                  ${formatMoney(totalAmount)}

                </strong>


              </div>



              <div class="meta-item">


                <span>
                  Submitted
                </span>


                <strong>

                  ${formatDate(
                    task.created_at
                  )}

                </strong>


              </div>


            </div>



            <!-- ============================
                 ACTIONS
            ============================= -->

            <div class="task-actions">


              <!-- ==========================
                   OPEN LINK
              =========================== -->

              ${
                task.task_link

                  ?

                  `

                    <a

                      href="${escapeHtml(task.task_link)}"

                      target="_blank"

                      rel="noopener noreferrer"

                      class="
                        action-btn
                        link-btn
                      "

                    >

                      🔗 Open Link

                    </a>

                  `

                  :

                  ""

              }



              <!-- ==========================
                   PENDING ACTIONS
              =========================== -->

              ${
                status === "pending"

                  ?

                  `

                    <button

                      type="button"

                      class="
                        action-btn
                        approve-btn
                      "

                      onclick="
                        updateTaskStatus(
                          '${task.id}',
                          'active'
                        )
                      "

                    >

                      ✓ Approve

                    </button>



                    <button

                      type="button"

                      class="
                        action-btn
                        reject-btn
                      "

                      onclick="
                        rejectTask(
                          '${task.id}'
                        )
                      "

                    >

                      ✕ Reject

                    </button>

                  `

                  :

                  ""

              }



              <!-- ==========================
                   ACTIVE ACTIONS
              =========================== -->

              ${
                status === "active" ||
                status === "approved"

                  ?

                  `

                    <button

                      type="button"

                      class="
                        action-btn
                        pause-btn
                      "

                      onclick="
                        updateTaskStatus(
                          '${task.id}',
                          'paused'
                        )
                      "

                    >

                      ⏸ Pause

                    </button>

                  `

                  :

                  ""

              }



              <!-- ==========================
                   PAUSED ACTIONS
              =========================== -->

              ${
                status === "paused"

                  ?

                  `

                    <button

                      type="button"

                      class="
                        action-btn
                        approve-btn
                      "

                      onclick="
                        updateTaskStatus(
                          '${task.id}',
                          'active'
                        )
                      "

                    >

                      ▶ Activate

                    </button>

                  `

                  :

                  ""

              }



              <!-- ==========================
                   DELETE BUTTON
              =========================== -->

              <button

                type="button"

                class="
                  action-btn
                  delete-btn
                "

                onclick="
                  deleteTask(
                    '${task.id}'
                  )
                "

              >

                🗑 Delete

              </button>


            </div>


          </article>


        `;


      }
    )
    .join("");


}



/* ========================================
   UPDATE TASK STATUS
======================================== */

async function updateTaskStatus(


  taskId,


  newStatus


) {


  let actionText =
    newStatus;



  if (
    newStatus === "active"
  ) {

    actionText =
      "activate";

  }



  if (
    newStatus === "paused"
  ) {

    actionText =
      "pause";

  }



  const confirmed =
    confirm(

      `Are you sure you want to ${actionText} this task?`

    );



  if (!confirmed) {

    return;

  }



  const {

    error

  } =
  await supabaseClient


    .from("tasks")


    .update({

      status:
        newStatus

    })


    .eq(
      "id",
      taskId
    );



  if (error) {


    console.error(
      "Task update error:",
      error
    );


    alert(

      "Unable to update task: " +

      error.message

    );


    return;

  }



  alert(

    "Task updated successfully."

  );



  await loadTasks();


}



/* ========================================
   REJECT TASK
======================================== */

async function rejectTask(taskId) {


  const confirmed =
    confirm(

      "Are you sure you want to reject this task?"

    );



  if (!confirmed) {

    return;

  }



  const {

    error

  } =
  await supabaseClient


    .from("tasks")


    .update({

      status:
        "rejected"

    })


    .eq(
      "id",
      taskId
    );



  if (error) {


    console.error(
      "Task rejection error:",
      error
    );


    alert(

      "Unable to reject task: " +

      error.message

    );


    return;

  }



  alert(

    "Task rejected."

  );



  await loadTasks();


}



/* ========================================
   DELETE TASK
======================================== */

async function deleteTask(taskId) {


  const confirmed =
    confirm(

      "WARNING!\n\n" +

      "Are you sure you want to permanently delete this task?\n\n" +

      "This action cannot be undone."

    );



  if (!confirmed) {

    return;

  }



  const secondConfirmation =
    confirm(

      "Final confirmation:\n\n" +

      "Delete this task permanently?"

    );



  if (!secondConfirmation) {

    return;

  }



  try {


    const {

      error

    } =
    await supabaseClient


      .from("tasks")


      .delete()


      .eq(
        "id",
        taskId
      );



    if (error) {


      console.error(
        "Task deletion error:",
        error
      );


      alert(

        "Unable to delete task: " +

        error.message

      );


      return;

    }



    alert(

      "Task deleted successfully."

    );



    await loadTasks();


  }

  catch (error) {


    console.error(
      "Unexpected deletion error:",
      error
    );


    alert(

      "An unexpected error occurred while deleting the task."

    );


  }


}

   FILTER EVENT
======================================== */

document

  .getElementById(
    "statusFilter"
  )


  .addEventListener(


    "change",


    function() {


      applyFilter();


    }


  );

   START PAGE
======================================== */

(async function() {


  const admin =
    await checkAdmin();



  if (!admin) {

    return;

  }



  await loadTasks();


})();
