<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Task Management - EarnGig Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b1a;
      --bg-soft: #0d1226;
      --card: #11172d;
      --card-hover: #151d38;
      --border: rgba(255, 255, 255, 0.08);

      --purple: #7c3aed;
      --purple-light: #a78bfa;
      --purple-dark: #5b21b6;

      --text: #f8fafc;
      --muted: #94a3b8;

      --green: #22c55e;
      --green-soft: rgba(34, 197, 94, 0.12);

      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.12);

      --orange: #f59e0b;
      --orange-soft: rgba(245, 158, 11, 0.12);

      --blue: #3b82f6;
      --blue-soft: rgba(59, 130, 246, 0.12);
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top right,
          rgba(124, 58, 237, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at top left,
          rgba(59, 130, 246, 0.08),
          transparent 28%
        ),
        var(--bg);

      color: var(--text);
      line-height: 1.5;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =========================
       HEADER
    ========================= */

    .eg-header {
      width: 100%;
      border-bottom: 1px solid var(--border);

      background: rgba(7, 11, 26, 0.88);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .eg-nav {
      width: min(1180px, calc(100% - 32px));
      min-height: 76px;
      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .eg-logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;

      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .eg-logo-mark {
      width: 40px;
      height: 40px;

      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #ffffff;
      font-size: 20px;
      font-weight: 900;

      background:
        linear-gradient(
          135deg,
          var(--purple-light),
          var(--purple)
        );

      box-shadow:
        0 8px 24px rgba(124, 58, 237, 0.35);
    }

    .eg-logo-word {
      font-size: 22px;
      color: #ffffff;
    }

    .eg-logo-word span {
      color: var(--purple-light);
    }

    .eg-dashboard-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 42px;
      padding: 0 18px;

      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 11px;

      background: rgba(124, 58, 237, 0.12);
      color: #ddd6fe;

      font-size: 14px;
      font-weight: 700;

      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .eg-dashboard-button:hover {
      background: rgba(124, 58, 237, 0.22);
      border-color: rgba(167, 139, 250, 0.5);
      transform: translateY(-1px);
    }

    /* =========================
       MAIN
    ========================= */

    .page {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 42px 0 60px;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    .page-heading h1 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
      letter-spacing: -1px;
      margin-bottom: 9px;
    }

    .page-heading p {
      color: var(--muted);
      font-size: 15px;
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      display: none;
      margin-bottom: 24px;
      padding: 14px 16px;

      border-radius: 12px;
      border: 1px solid var(--border);

      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: var(--green-soft);
      border-color: rgba(34, 197, 94, 0.25);
      color: #86efac;
    }

    .message.error {
      background: var(--red-soft);
      border-color: rgba(239, 68, 68, 0.25);
      color: #fca5a5;
    }

    .message.info {
      background: var(--blue-soft);
      border-color: rgba(59, 130, 246, 0.25);
      color: #93c5fd;
    }

    /* =========================
       SUMMARY CARDS
    ========================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 34px;
    }

    .summary-card {
      position: relative;
      overflow: hidden;

      width: 100%;
      padding: 21px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.015)
        ),
        var(--card);

      border: 1px solid var(--border);
      border-radius: 17px;

      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.18);

      cursor: pointer;

      text-align: left;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .summary-card::after {
      content: "";

      position: absolute;

      width: 90px;
      height: 90px;

      right: -30px;
      top: -35px;

      border-radius: 50%;

      background: rgba(124, 58, 237, 0.08);

      pointer-events: none;
    }

    .summary-card:hover {
      transform: translateY(-2px);
      border-color: rgba(167, 139, 250, 0.3);
    }

    .summary-card.active {
      transform: translateY(-2px);

      border-color: rgba(167, 139, 250, 0.65);

      background:
        linear-gradient(
          145deg,
          rgba(124, 58, 237, 0.15),
          rgba(255, 255, 255, 0.02)
        ),
        var(--card);

      box-shadow:
        0 0 0 2px rgba(124, 58, 237, 0.16),
        0 16px 38px rgba(0, 0, 0, 0.25);
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .summary-card.total .summary-value {
      color: #c4b5fd;
    }

    .summary-card.pending .summary-value {
      color: #fbbf24;
    }

    .summary-card.approved .summary-value {
      color: #4ade80;
    }

    .summary-card.rejected .summary-value {
      color: #f87171;
    }

    /* =========================
       SECTION
    ========================= */

    .section {
      margin-top: 10px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin-bottom: 18px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 800;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .refresh-button {
      border: 1px solid var(--border);

      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;

      padding: 10px 14px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 13px;
      font-weight: 700;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .refresh-button:hover {
      background: rgba(124, 58, 237, 0.12);
      border-color: rgba(167, 139, 250, 0.25);
    }

    .refresh-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* =========================
       TASKS
    ========================= */

    .tasks-list {
      display: grid;
      gap: 16px;
    }

    .task-card {
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.01)
        ),
        var(--card);

      border: 1px solid var(--border);
      border-radius: 17px;

      padding: 22px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .task-card:hover {
      transform: translateY(-2px);

      border-color: rgba(167, 139, 250, 0.18);

      background: var(--card-hover);
    }

    .task-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      gap: 18px;

      margin-bottom: 14px;
    }

    .task-title {
      font-size: 19px;
      font-weight: 800;

      line-height: 1.3;

      margin-bottom: 7px;
    }

    .task-category {
      display: inline-flex;
      align-items: center;

      padding: 5px 9px;

      border-radius: 7px;

      background: rgba(124, 58, 237, 0.12);
      color: #c4b5fd;

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .status-badge {
      flex-shrink: 0;

      padding: 6px 10px;

      border-radius: 8px;

      font-size: 11px;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .status-badge.pending {
      background: var(--orange-soft);
      color: #fbbf24;
    }

    .status-badge.approved {
      background: var(--green-soft);
      color: #4ade80;
    }

    .status-badge.rejected {
      background: var(--red-soft);
      color: #f87171;
    }

    .status-badge.unknown {
      background: rgba(148, 163, 184, 0.12);
      color: #cbd5e1;
    }

    .task-description {
      color: #cbd5e1;

      font-size: 14px;
      line-height: 1.65;

      margin-bottom: 17px;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .task-meta {
      display: grid;

      grid-template-columns: repeat(4, minmax(0, 1fr));

      gap: 10px;

      margin-bottom: 18px;
    }

    .meta-item {
      padding: 12px;

      border-radius: 10px;

      background: rgba(255, 255, 255, 0.025);

      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-label {
      color: var(--muted);

      font-size: 11px;

      margin-bottom: 4px;
    }

    .meta-value {
      color: #f8fafc;

      font-size: 14px;
      font-weight: 700;

      word-break: break-word;
    }

    .task-link {
      margin-bottom: 18px;
    }

    .task-link a {
      display: inline-block;

      max-width: 100%;

      color: #a78bfa;

      font-size: 13px;
      font-weight: 600;

      overflow-wrap: anywhere;
    }

    .task-link a:hover {
      text-decoration: underline;
    }

    .task-actions {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      padding-top: 17px;

      border-top: 1px solid var(--border);
    }

    .action-button {
      min-height: 42px;

      padding: 0 16px;

      border-radius: 10px;

      border: 1px solid transparent;

      cursor: pointer;

      font-size: 13px;
      font-weight: 800;

      transition:
        transform 0.2s ease,
        opacity 0.2s ease,
        background 0.2s ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
    }

    .action-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .approve-button {
      background: rgba(34, 197, 94, 0.14);

      border-color: rgba(34, 197, 94, 0.25);

      color: #86efac;
    }

    .approve-button:hover {
      background: rgba(34, 197, 94, 0.22);
    }

    .reject-button {
      background: rgba(239, 68, 68, 0.12);

      border-color: rgba(239, 68, 68, 0.24);

      color: #fca5a5;
    }

    .reject-button:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    .delete-button {
      background: rgba(127, 29, 29, 0.16);

      border-color: rgba(248, 113, 113, 0.28);

      color: #fda4af;
    }

    .delete-button:hover {
      background: rgba(239, 68, 68, 0.25);

      border-color: rgba(248, 113, 113, 0.45);
    }

    /* =========================
       COMPLETED INFORMATION
    ========================= */

    .status-note {
      padding-top: 17px;

      border-top: 1px solid var(--border);

      color: var(--muted);

      font-size: 13px;
    }

    .status-note.approved-note {
      color: #86efac;
    }

    .status-note.rejected-note {
      color: #fca5a5;
    }

    /* =========================
       EMPTY / LOADING
    ========================= */

    .empty-state {
      padding: 50px 20px;

      text-align: center;

      background: rgba(255, 255, 255, 0.02);

      border: 1px dashed rgba(255, 255, 255, 0.09);

      border-radius: 17px;
    }

    .empty-icon {
      width: 54px;
      height: 54px;

      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: rgba(124, 58, 237, 0.12);

      color: #c4b5fd;

      font-size: 23px;
    }

    .empty-state h3 {
      font-size: 17px;

      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--muted);

      font-size: 13px;
    }

    .loading {
      padding: 45px 20px;

      text-align: center;

      color: var(--muted);

      font-size: 14px;
    }

    .spinner {
      width: 26px;
      height: 26px;

      margin: 0 auto 12px;

      border-radius: 50%;

      border: 3px solid rgba(255, 255, 255, 0.1);

      border-top-color: var(--purple-light);

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       FOOTER
    ========================= */

    .footer {
      width: min(1180px, calc(100% - 32px));

      margin: 0 auto;

      padding: 22px 0 35px;

      border-top: 1px solid var(--border);

      color: #64748b;

      text-align: center;

      font-size: 12px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {
      .summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .task-meta {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .eg-nav {
        min-height: 68px;

        width: min(100% - 22px, 1180px);
      }

      .eg-logo-mark {
        width: 36px;
        height: 36px;

        border-radius: 10px;

        font-size: 18px;
      }

      .eg-logo-word {
        font-size: 20px;
      }

      .eg-dashboard-button {
        min-height: 38px;

        padding: 0 12px;

        font-size: 12px;
      }

      .page {
        width: min(100% - 22px, 1180px);

        padding-top: 30px;
      }

      .page-heading {
        margin-bottom: 22px;
      }

      .summary-grid {
        gap: 10px;

        margin-bottom: 27px;
      }

      .summary-card {
        padding: 16px;

        border-radius: 14px;
      }

      .summary-value {
        font-size: 23px;
      }

      .section-header {
        align-items: flex-start;
      }

      .section-title {
        font-size: 19px;
      }

      .refresh-button {
        padding: 9px 11px;

        font-size: 12px;
      }

      .task-card {
        padding: 17px;

        border-radius: 14px;
      }

      .task-top {
        flex-direction: column;

        gap: 10px;
      }

      .status-badge {
        align-self: flex-start;
      }

      .task-title {
        font-size: 17px;
      }

      .task-meta {
        grid-template-columns: 1fr 1fr;
      }

      .task-actions {
        flex-direction: column;
      }

      .action-button {
        width: 100%;
      }
    }

    @media (max-width: 380px) {
      .eg-logo-word {
        font-size: 18px;
      }

      .eg-dashboard-button {
        padding: 0 10px;
      }

      .summary-grid {
        grid-template-columns: 1fr 1fr;
      }

      .task-meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="eg-header">

    <div class="eg-nav">

      <a
        href="admin-dashboard.html"
        class="eg-logo"
        aria-label="EarnGig Admin Dashboard"
      >
        <span class="eg-logo-mark">E</span>

        <span class="eg-logo-word">
          Earn<span>Gig</span>
        </span>
      </a>

      <a
        href="admin-dashboard.html"
        class="eg-dashboard-button"
      >
        Dashboard
      </a>

    </div>

  </header>


  <!-- =========================
       MAIN
  ========================== -->

  <main class="page">

    <div class="page-heading">

      <h1>Task Management</h1>

      <p>
        View all tasks, review pending submissions,
        and manage approved or rejected tasks.
      </p>

    </div>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- =========================
         SUMMARY FILTERS
    ========================== -->

    <section class="summary-grid">

      <button
        type="button"
        class="summary-card total active"
        id="totalCard"
        onclick="setTaskFilter('all')"
      >

        <div class="summary-label">
          Total Tasks
        </div>

        <div
          class="summary-value"
          id="totalTasks"
        >
          0
        </div>

      </button>


      <button
        type="button"
        class="summary-card pending"
        id="pendingCard"
        onclick="setTaskFilter('pending')"
      >

        <div class="summary-label">
          Pending
        </div>

        <div
          class="summary-value"
          id="pendingTasks"
        >
          0
        </div>

      </button>


      <button
        type="button"
        class="summary-card approved"
        id="approvedCard"
        onclick="setTaskFilter('approved')"
      >

        <div class="summary-label">
          Approved
        </div>

        <div
          class="summary-value"
          id="approvedTasks"
        >
          0
        </div>

      </button>


      <button
        type="button"
        class="summary-card rejected"
        id="rejectedCard"
        onclick="setTaskFilter('rejected')"
      >

        <div class="summary-label">
          Rejected
        </div>

        <div
          class="summary-value"
          id="rejectedTasks"
        >
          0
        </div>

      </button>

    </section>


    <!-- =========================
         TASK LIST
    ========================== -->

    <section class="section">

      <div class="section-header">

        <div>

          <div
            class="section-title"
            id="sectionTitle"
          >
            All Tasks
          </div>

          <div
            class="section-subtitle"
            id="sectionSubtitle"
          >
            Showing every task in the system
          </div>

        </div>


        <button
          type="button"
          class="refresh-button"
          id="refreshButton"
        >
          Refresh
        </button>

      </div>


      <div
        id="tasksContainer"
        class="tasks-list"
      >

        <div class="loading">

          <div class="spinner"></div>

          Loading tasks...

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    © 2026 EarnGig. Admin Task Management.

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    let allTasks = [];

    let currentFilter = "all";


    /* =====================================================
       HELPERS
    ===================================================== */

    function formatNaira(amount) {

      const value = Number(amount || 0);

      return new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 2
      }).format(value);
    }


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatDate(dateString) {

      if (!dateString) {
        return "Unknown date";
      }

      const date = new Date(dateString);

      if (Number.isNaN(date.getTime())) {
        return "Unknown date";
      }

      return date.toLocaleString("en-NG", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }


    function showMessage(
      text,
      type = "info"
    ) {

      const message =
        document.getElementById("message");

      message.textContent = text;

      message.className =
        `message show ${type}`;
    }


    function clearMessage() {

      const message =
        document.getElementById("message");

      message.textContent = "";

      message.className = "message";
    }


    /* =====================================================
       CURRENT USER
    ===================================================== */

    async function getCurrentUser() {

      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();

      if (error) {
        throw error;
      }

      if (
        !data ||
        !data.user
      ) {
        throw new Error(
          "You must be logged in."
        );
      }

      return data.user;
    }


    /* =====================================================
       LOAD ALL TASKS
    ===================================================== */

    async function loadAllTasks() {

      const container =
        document.getElementById(
          "tasksContainer"
        );

      container.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Loading tasks...
        </div>
      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("tasks")
          .select(`
            id,
            title,
            description,
            category,
            task_link,
            reward_amount,
            max_participants,
            participant_count,
            platform_fee,
            total_amount,
            status,
            user_id,
            created_at,
            updated_at
          `)
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Task loading error:",
          error
        );

        container.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              !
            </div>

            <h3>
              Unable to load tasks
            </h3>

            <p>
              ${escapeHtml(error.message)}
            </p>

          </div>
        `;

        throw error;
      }


      allTasks =
        Array.isArray(data)
          ? data
          : [];


      updateStatistics();

      renderCurrentFilter();
    }


    /* =====================================================
       UPDATE STATISTICS
    ===================================================== */

    function updateStatistics() {

      const total =
        allTasks.length;

      const pending =
        allTasks.filter(
          task =>
            String(task.status || "")
              .toLowerCase() === "pending"
        ).length;

      const approved =
        allTasks.filter(
          task =>
            String(task.status || "")
              .toLowerCase() === "approved"
        ).length;

      const rejected =
        allTasks.filter(
          task =>
            String(task.status || "")
              .toLowerCase() === "rejected"
        ).length;


      document.getElementById(
        "totalTasks"
      ).textContent = total;


      document.getElementById(
        "pendingTasks"
      ).textContent = pending;


      document.getElementById(
        "approvedTasks"
      ).textContent = approved;


      document.getElementById(
        "rejectedTasks"
      ).textContent = rejected;
    }


    /* =====================================================
       CHANGE FILTER
    ===================================================== */

    function setTaskFilter(filter) {

      currentFilter = filter;

      updateActiveSummaryCard();

      updateSectionHeading();

      renderCurrentFilter();
    }


    /* =====================================================
       ACTIVE SUMMARY CARD
    ===================================================== */

    function updateActiveSummaryCard() {

      document
        .getElementById("totalCard")
        .classList.toggle(
          "active",
          currentFilter === "all"
        );


      document
        .getElementById("pendingCard")
        .classList.toggle(
          "active",
          currentFilter === "pending"
        );


      document
        .getElementById("approvedCard")
        .classList.toggle(
          "active",
          currentFilter === "approved"
        );


      document
        .getElementById("rejectedCard")
        .classList.toggle(
          "active",
          currentFilter === "rejected"
        );
    }


    /* =====================================================
       SECTION HEADING
    ===================================================== */

    function updateSectionHeading() {

      const title =
        document.getElementById(
          "sectionTitle"
        );

      const subtitle =
        document.getElementById(
          "sectionSubtitle"
        );


      if (currentFilter === "all") {

        title.textContent =
          "All Tasks";

        subtitle.textContent =
          "Showing every task in the system";

        return;
      }


      if (currentFilter === "pending") {

        title.textContent =
          "Pending Tasks";

        subtitle.textContent =
          "Tasks waiting for administrator review";

        return;
      }


      if (currentFilter === "approved") {

        title.textContent =
          "Approved Tasks";

        subtitle.textContent =
          "Tasks that have been approved";

        return;
      }


      if (currentFilter === "rejected") {

        title.textContent =
          "Rejected Tasks";

        subtitle.textContent =
          "Tasks that have been rejected";

        return;
      }
    }


    /* =====================================================
       FILTER TASKS
    ===================================================== */

    function getFilteredTasks() {

      if (currentFilter === "all") {
        return allTasks;
      }

      return allTasks.filter(
        task =>
          String(task.status || "")
            .toLowerCase() === currentFilter
      );
    }


    /* =====================================================
       RENDER TASKS
    ===================================================== */

    function renderCurrentFilter() {

      const container =
        document.getElementById(
          "tasksContainer"
        );

      const filteredTasks =
        getFilteredTasks();


      if (
        !filteredTasks ||
        filteredTasks.length === 0
      ) {

        let emptyTitle =
          "No tasks found";

        let emptyText =
          "There are currently no tasks in this section.";


        if (
          currentFilter === "pending"
        ) {

          emptyTitle =
            "No pending tasks";

          emptyText =
            "There are currently no tasks waiting for review.";
        }


        if (
          currentFilter === "approved"
        ) {

          emptyTitle =
            "No approved tasks";

          emptyText =
            "There are currently no approved tasks.";
        }


        if (
          currentFilter === "rejected"
        ) {

          emptyTitle =
            "No rejected tasks";

          emptyText =
            "There are currently no rejected tasks.";
        }


        container.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              ✓
            </div>

            <h3>
              ${emptyTitle}
            </h3>

            <p>
              ${emptyText}
            </p>

          </div>
        `;

        return;
      }


      container.innerHTML =
        filteredTasks
          .map(
            task =>
              createTaskCard(task)
          )
          .join("");
    }


    /* =====================================================
       CREATE TASK CARD
    ===================================================== */

    function createTaskCard(task) {

      const taskId =
        escapeHtml(task.id);


      const title =
        escapeHtml(
          task.title ||
          "Untitled Task"
        );


      const description =
        escapeHtml(
          task.description ||
          "No description provided."
        );


      const category =
        escapeHtml(
          task.category ||
          "General"
        );


      const status =
        String(
          task.status ||
          "unknown"
        ).toLowerCase();


      const statusLabel =
        status.charAt(0).toUpperCase() +
        status.slice(1);


      const taskLink =
        task.task_link
          ? `
            <div class="task-link">

              <a
                href="${escapeHtml(task.task_link)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Open Task Link →
              </a>

            </div>
          `
          : "";


      let actions = "";


      if (status === "pending") {

        actions = `
          <div class="task-actions">

            <button
              type="button"
              class="action-button approve-button"
              onclick="approveTask('${taskId}')"
            >
              ✓ Approve Task
            </button>


            <button
              type="button"
              class="action-button reject-button"
              onclick="rejectTask('${taskId}')"
            >
              ✕ Reject & Refund
            </button>


            <button
              type="button"
              class="action-button delete-button"
              onclick="deleteTask('${taskId}')"
            >
              🗑 Delete Task
            </button>

          </div>
        `;

      } else if (status === "approved") {

        actions = `
          <div class="task-actions">

            <div class="status-note approved-note">
              ✓ This task has been approved.
            </div>

            <button
              type="button"
              class="action-button delete-button"
              onclick="deleteTask('${taskId}')"
            >
              🗑 Delete Task
            </button>

          </div>
        `;

      } else if (status === "rejected") {

        actions = `
          <div class="task-actions">

            <div class="status-note rejected-note">
              ✕ This task has been rejected and processed.
            </div>

            <button
              type="button"
              class="action-button delete-button"
              onclick="deleteTask('${taskId}')"
            >
              🗑 Delete Task
            </button>

          </div>
        `;

      } else {

        actions = `
          <div class="task-actions">

            <button
              type="button"
              class="action-button delete-button"
              onclick="deleteTask('${taskId}')"
            >
              🗑 Delete Task
            </button>

          </div>
        `;
      }


      return `
        <article
          class="task-card"
          id="task-${taskId}"
        >

          <div class="task-top">

            <div>

              <div class="task-title">
                ${title}
              </div>

              <span class="task-category">
                ${category}
              </span>

            </div>


            <span
              class="status-badge ${escapeHtml(status)}"
            >
              ${escapeHtml(statusLabel)}
            </span>

          </div>


          <div class="task-description">
            ${description}
          </div>


          <div class="task-meta">

            <div class="meta-item">

              <div class="meta-label">
                Reward
              </div>

              <div class="meta-value">
                ${formatNaira(
                  task.reward_amount
                )}
              </div>

            </div>


            <div class="meta-item">

              <div class="meta-label">
                Participants
              </div>

              <div class="meta-value">

                ${escapeHtml(
                  task.participant_count || 0
                )}

                /

                ${escapeHtml(
                  task.max_participants || 0
                )}

              </div>

            </div>


            <div class="meta-item">

              <div class="meta-label">
                Total Amount
              </div>

              <div class="meta-value">
                ${formatNaira(
                  task.total_amount
                )}
              </div>

            </div>


            <div class="meta-item">

              <div class="meta-label">
                Submitted
              </div>

              <div class="meta-value">
                ${formatDate(
                  task.created_at
                )}
              </div>

            </div>

          </div>


          ${taskLink}


          ${actions}

        </article>
      `;
    }


    /* =====================================================
       APPROVE TASK
    ===================================================== */

    async function approveTask(taskId) {

      if (!taskId) {
        return;
      }


      const confirmed =
        confirm(
          "Approve this task?\n\n" +
          "The task will be marked as approved."
        );


      if (!confirmed) {
        return;
      }


      clearMessage();


      const buttons =
        document.querySelectorAll(
          `#task-${CSS.escape(taskId)} .action-button`
        );


      buttons.forEach(
        button => {
          button.disabled = true;
        }
      );


      try {

        const {
          error
        } =
          await supabaseClient
            .from("tasks")
            .update({
              status: "approved",
              updated_at:
                new Date().toISOString()
            })
            .eq("id", taskId)
            .eq("status", "pending");


        if (error) {
          throw error;
        }


        showMessage(
          "Task approved successfully.",
          "success"
        );


        await loadAllTasks();


      } catch (error) {

        console.error(
          "Approve task error:",
          error
        );


        buttons.forEach(
          button => {
            button.disabled = false;
          }
        );


        showMessage(
          error.message ||
          "Unable to approve task.",
          "error"
        );
      }
    }


    /* =====================================================
       REJECT TASK + REFUND
    ===================================================== */

    async function rejectTask(taskId) {

      if (!taskId) {
        return;
      }


      const confirmed =
        confirm(
          "Reject this task?\n\n" +
          "The full task payment will be refunded to the task owner's wallet.\n\n" +
          "The refund will NOT be counted as earnings."
        );


      if (!confirmed) {
        return;
      }


      clearMessage();


      const buttons =
        document.querySelectorAll(
          `#task-${CSS.escape(taskId)} .action-button`
        );


      buttons.forEach(
        button => {
          button.disabled = true;
        }
      );


      try {

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "reject_task_with_refund",
            {
              p_task_id: taskId
            }
          );


        if (error) {
          throw error;
        }


        console.log(
          "Reject/refund response:",
          data
        );


        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            data && data.message
              ? data.message
              : "Task rejection and refund failed."
          );
        }


        const refundedAmount =
          Number(
            data.amount_refunded || 0
          );


        const newBalance =
          Number(
            data.new_wallet_balance || 0
          );


        showMessage(
          `Task rejected successfully. ${formatNaira(refundedAmount)} refunded to the task owner's wallet. New wallet balance: ${formatNaira(newBalance)}. The refund was not counted as earnings.`,
          "success"
        );


        await loadAllTasks();


      } catch (error) {

        console.error(
          "Reject/refund error:",
          error
        );


        buttons.forEach(
          button => {
            button.disabled = false;
          }
        );


        showMessage(
          error.message ||
          "Unable to reject task and process refund.",
          "error"
        );
      }
    }


    /* =====================================================
       DELETE TASK
    ===================================================== */

    async function deleteTask(taskId) {

      if (!taskId) {
        return;
      }


      const task =
        allTasks.find(
          item =>
            String(item.id) ===
            String(taskId)
        );


      const taskTitle =
        task && task.title
          ? task.title
          : "this task";


      const confirmed =
        confirm(
          `Delete "${taskTitle}"?\n\n` +
          "This will permanently remove the task.\n\n" +
          "This action cannot be undone."
        );


      if (!confirmed) {
        return;
      }


      clearMessage();


      const card =
        document.getElementById(
          `task-${CSS.escape(taskId)}`
        );


      const buttons =
        card
          ? card.querySelectorAll(
              ".action-button"
            )
          : [];


      buttons.forEach(
        button => {
          button.disabled = true;
        }
      );


      try {

        const {
          error
        } =
          await supabaseClient
            .from("tasks")
            .delete()
            .eq("id", taskId);


        if (error) {

          console.error(
            "Delete task error:",
            error
          );

          throw error;
        }


        allTasks =
          allTasks.filter(
            item =>
              String(item.id) !==
              String(taskId)
          );


        updateStatistics();

        updateActiveSummaryCard();

        updateSectionHeading();

        renderCurrentFilter();


        showMessage(
          "Task deleted successfully.",
          "success"
        );


      } catch (error) {

        console.error(
          "Delete task error:",
          error
        );


        buttons.forEach(
          button => {
            button.disabled = false;
          }
        );


        showMessage(
          error.message ||
          "Unable to delete this task. It may have related records that must be handled first.",
          "error"
        );
      }
    }


    /* =====================================================
       REFRESH
    ===================================================== */

    async function refreshTasks() {

      const refreshButton =
        document.getElementById(
          "refreshButton"
        );


      refreshButton.disabled = true;

      refreshButton.textContent =
        "Refreshing...";


      clearMessage();


      try {

        await loadAllTasks();


      } catch (error) {

        console.error(
          "Refresh error:",
          error
        );


        showMessage(
          error.message ||
          "Unable to refresh task data.",
          "error"
        );


      } finally {

        refreshButton.disabled = false;

        refreshButton.textContent =
          "Refresh";
      }
    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    async function initializePage() {

      try {

        await getCurrentUser();

        await loadAllTasks();

        updateActiveSummaryCard();

        updateSectionHeading();


      } catch (error) {

        console.error(
          "Initialization error:",
          error
        );


        document.getElementById(
          "tasksContainer"
        ).innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              !
            </div>

            <h3>
              Unable to load task management
            </h3>

            <p>
              ${escapeHtml(
                error.message ||
                "Please log in and try again."
              )}
            </p>

          </div>

        `;


        showMessage(
          error.message ||
          "Unable to load task management.",
          "error"
        );
      }
    }


    /* =====================================================
       EVENTS
    ===================================================== */

    document
      .getElementById("refreshButton")
      .addEventListener(
        "click",
        refreshTasks
      );


    /* =====================================================
       START
    ===================================================== */

    initializePage();

  </script>

</body>
</html>
