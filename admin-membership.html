<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Membership | EarnGig Admin
  </title>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <style>


    /* =========================================
       GLOBAL
    ========================================= */

    * {

      box-sizing: border-box;

    }


    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background:
        #f5f6fa;

      color:
        #17182f;

    }


    button {

      font-family:
        inherit;

    }


    /* =========================================
       HEADER
    ========================================= */

    header {

      background:
        #0d1038;

      color:
        white;

    }


    .nav {

      max-width:
        1250px;

      margin:
        auto;

      padding:
        18px 20px;

      display:
        flex;

      align-items:
        center;

      gap:
        20px;

    }


    .logo {

      color:
        white;

      text-decoration:
        none;

      font-size:
        25px;

      font-weight:
        700;

    }


    .logo span {

      color:
        #7c5cff;

    }


    .admin-badge {

      margin-left:
        auto;

      color:
        #c9caff;

      font-size:
        13px;

      letter-spacing:
        .5px;

    }


    .dashboard-btn {

      text-decoration:
        none;

      color:
        white;

      border:
        1px solid
        rgba(255,255,255,.35);

      padding:
        9px 15px;

      border-radius:
        8px;

      font-size:
        14px;

    }


    .dashboard-btn:hover {

      background:
        rgba(255,255,255,.08);

    }


    /* =========================================
       MAIN
    ========================================= */

    main {

      max-width:
        1250px;

      margin:
        auto;

      padding:
        35px 20px 60px;

    }


    /* =========================================
       PAGE HEADER
    ========================================= */

    .page-heading {

      margin-bottom:
        30px;

    }


    .eyebrow {

      display:
        inline-block;

      color:
        #6d4aff;

      font-size:
        12px;

      font-weight:
        700;

      letter-spacing:
        1px;

      margin-bottom:
        8px;

    }


    .page-heading h1 {

      margin:
        0 0 10px;

      font-size:
        32px;

    }


    .page-heading p {

      margin: 0;

      color:
        #686a7d;

      line-height:
        1.5;

    }


    /* =========================================
       SECTION TITLE
    ========================================= */

    .section-title {

      margin:
        30px 0 15px;

      font-size:
        21px;

    }


    /* =========================================
       STATISTICS
    ========================================= */

    .stats-grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(190px, 1fr)
        );

      gap:
        14px;

    }


    .stat-card {

      background:
        white;

      border:
        1px solid
        #e6e7ee;

      border-radius:
        12px;

      padding:
        17px;

      box-shadow:
        0 4px 12px
        rgba(0,0,0,.03);

    }


    .stat-card small {

      display:
        block;

      color:
        #77798b;

      font-size:
        13px;

      margin-bottom:
        7px;

    }


    .stat-card strong {

      font-size:
        24px;

    }


    /* =========================================
       MEMBERSHIP TABLE
    ========================================= */

    .membership-container {

      background:
        white;

      border:
        1px solid
        #e6e7ee;

      border-radius:
        13px;

      overflow:
        hidden;

      box-shadow:
        0 4px 15px
        rgba(0,0,0,.03);

    }


    .membership-list {

      display:
        grid;

    }


    .member-card {

      padding:
        18px;

      border-bottom:
        1px solid
        #eeeeee;

      display:
        grid;

      grid-template-columns:
        1.5fr
        1fr
        1fr
        1fr;

      gap:
        18px;

      align-items:
        center;

    }


    .member-card:last-child {

      border-bottom:
        none;

    }


    .member-name {

      margin: 0 0 5px;

      font-size:
        16px;

    }


    .member-email {

      margin: 0;

      color:
        #77798b;

      font-size:
        13px;

      word-break:
        break-word;

    }


    .member-detail small {

      display:
        block;

      color:
        #77798b;

      font-size:
        12px;

      margin-bottom:
        5px;

    }


    .member-detail strong {

      font-size:
        14px;

      word-break:
        break-word;

    }


    /* =========================================
       STATUS BADGE
    ========================================= */

    .status-badge {

      display:
        inline-block;

      padding:
        6px 10px;

      border-radius:
        20px;

      font-size:
        11px;

      font-weight:
        700;

      text-transform:
        uppercase;

    }


    .status-active {

      background:
        #dcfce7;

      color:
        #15803d;

    }


    .status-inactive {

      background:
        #fee2e2;

      color:
        #b91c1c;

    }


    .status-unknown {

      background:
        #f1f1f1;

      color:
        #666;

    }


    /* =========================================
       LOADING
    ========================================= */

    .loading {

      text-align:
        center;

      padding:
        35px 20px;

      color:
        #686a7d;

    }


    /* =========================================
       EMPTY STATE
    ========================================= */

    .empty-state {

      text-align:
        center;

      padding:
        45px 20px;

      color:
        #686a7d;

    }


    .empty-state h3 {

      margin:
        0 0 8px;

      color:
        #17182f;

    }


    .empty-state p {

      margin: 0;

    }


    /* =========================================
       ERROR
    ========================================= */

    .error-box {

      padding:
        20px;

      background:
        #fff5f5;

      border:
        1px solid
        #f0b5b5;

      border-radius:
        12px;

      color:
        #721c24;

    }


    /* =========================================
       REFRESH BUTTON
    ========================================= */

    .top-actions {

      display:
        flex;

      justify-content:
        flex-end;

      margin-bottom:
        15px;

    }


    .refresh-btn {

      border: 0;

      background:
        #6d4aff;

      color:
        white;

      padding:
        10px 16px;

      border-radius:
        8px;

      font-weight:
        700;

      cursor:
        pointer;

    }


    .refresh-btn:hover {

      opacity:
        .9;

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (
      max-width: 800px
    ) {

      .member-card {

        grid-template-columns:
          1fr 1fr;

      }

    }


    @media (
      max-width: 600px
    ) {

      .nav {

        flex-wrap:
          wrap;

      }


      .admin-badge {

        margin-left: 0;

      }


      main {

        padding:
          25px 15px 45px;

      }


      .page-heading h1 {

        font-size:
          27px;

      }


      .member-card {

        grid-template-columns:
          1fr;

        gap:
          14px;

      }

    }


  </style>

</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>

  <div class="nav">


    <a
      href="admin-dashboard.html"
      class="logo"
    >

      Earn<span>Gig</span>

    </a>


    <div class="admin-badge">

      ADMIN PORTAL

    </div>


    <a
      href="admin-dashboard.html"
      class="dashboard-btn"
    >

      ← Admin Dashboard

    </a>


  </div>

</header>



<!-- =========================================
     MAIN
========================================= -->

<main>


  <!-- PAGE HEADER -->

  <section
    class="page-heading"
  >


    <span
      class="eyebrow"
    >

      ADMINISTRATION

    </span>


    <h1>

      Membership

    </h1>


    <p>

      Monitor member accounts and membership activity.

    </p>


  </section>



  <!-- STATISTICS -->

  <h2
    class="section-title"
  >

    Membership Statistics

  </h2>


  <div
    class="stats-grid"
    id="statsGrid"
  >


    <div
      class="loading"
    >

      Loading membership statistics...

    </div>


  </div>



  <!-- MEMBERS -->

  <h2
    class="section-title"
  >

    Member Overview

  </h2>


  <div
    class="top-actions"
  >


    <button
      type="button"
      class="refresh-btn"
      onclick="loadMembership()"
    >

      ↻ Refresh

    </button>


  </div>


  <div
    class="membership-container"
  >


    <div
      class="membership-list"
      id="membershipList"
    >


      <div
        class="loading"
      >

        Loading members...

      </div>


    </div>


  </div>


</main>



<script>


/* =========================================
   FORMAT DATE
========================================= */


function formatDate(date) {


  if (!date) {

    return "—";

  }


  try {

    return new Date(date)

      .toLocaleDateString(

        "en-NG",

        {

          year:
            "numeric",

          month:
            "short",

          day:
            "numeric"

        }

      );

  }


  catch (error) {

    return "—";

  }

}


/* =========================================
   ESCAPE HTML
========================================= */


function escapeHtml(value) {


  if (

    value === null ||

    value === undefined ||

    value === ""

  ) {

    return "—";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   GET STATUS CLASS
========================================= */


function getStatusClass(status) {


  const value =

    String(
      status || ""
    )

    .toLowerCase();


  if (value === "active") {

    return "status-active";

  }


  if (value === "inactive") {

    return "status-inactive";

  }


  return "status-unknown";

}


/* =========================================
   LOAD MEMBERSHIP
========================================= */


async function loadMembership() {


  const statsGrid =

    document.getElementById(
      "statsGrid"
    );


  const membershipList =

    document.getElementById(
      "membershipList"
    );


  statsGrid.innerHTML = `

    <div class="loading">

      Loading membership statistics...

    </div>

  `;


  membershipList.innerHTML = `

    <div class="loading">

      Loading members...

    </div>

  `;


  try {


    /* =====================================
       LOAD PROFILES
    ===================================== */


    const {

      data:
      profiles,

      error

    }

    =

    await supabaseClient

      .from(
        "profiles"
      )

      .select(
        "*"
      )

      .order(
        "created_at",
        {

          ascending:
            false

        }

      );


    if (error) {

      throw error;

    }


    const members =

      profiles || [];



    /* =====================================
       FILTER ADMIN / MEMBERS
    ===================================== */


    const regularMembers =

      members.filter(

        member =>

          member.is_admin !== true

      );


    const activeMembers =

      regularMembers.filter(

        member =>

          String(
            member.account_status ||
            "active"
          )

          .toLowerCase()

          ===

          "active"

      );


    const inactiveMembers =

      regularMembers.filter(

        member =>

          String(
            member.account_status ||
            ""
          )

          .toLowerCase()

          ===

          "inactive"

      );


    /* =====================================
       STATISTICS
    ===================================== */


    statsGrid.innerHTML = `


      <div class="stat-card">

        <small>

          Total Members

        </small>

        <strong>

          ${regularMembers.length}

        </strong>

      </div>



      <div class="stat-card">

        <small>

          Active Members

        </small>

        <strong>

          ${activeMembers.length}

        </strong>

      </div>



      <div class="stat-card">

        <small>

          Inactive Members

        </small>

        <strong>

          ${inactiveMembers.length}

        </strong>

      </div>


    `;



    /* =====================================
       EMPTY STATE
    ===================================== */


    if (

      regularMembers.length === 0

    ) {


      membershipList.innerHTML = `


        <div class="empty-state">


          <h3>

            No members found

          </h3>


          <p>

            Member accounts will appear here.

          </p>


        </div>


      `;


      return;

    }



    /* =====================================
       DISPLAY MEMBERS
    ===================================== */


    membershipList.innerHTML =

      regularMembers.map(

        member => {


          const status =

            member.account_status ||

            "active";


          const fullName =

            member.full_name ||

            "Unnamed Member";


          const email =

            member.email ||

            "Email unavailable";


          return `


            <article
              class="member-card"
            >


              <div>


                <h3
                  class="member-name"
                >

                  ${escapeHtml(
                    fullName
                  )}

                </h3>


                <p
                  class="member-email"
                >

                  ${escapeHtml(
                    email
                  )}

                </p>


              </div>



              <div
                class="member-detail"
              >


                <small>

                  Account Status

                </small>


                <span
                  class="
                    status-badge
                    ${getStatusClass(
                      status
                    )}
                  "
                >

                  ${escapeHtml(
                    status
                  )}

                </span>


              </div>



              <div
                class="member-detail"
              >


                <small>

                  Member ID

                </small>


                <strong>

                  ${escapeHtml(
                    member.id
                  )}

                </strong>


              </div>



              <div
                class="member-detail"
              >


                <small>

                  Joined

                </small>


                <strong>

                  ${formatDate(
                    member.created_at
                  )}

                </strong>


              </div>


            </article>


          `;

        }

      )

      .join("");


  }


  catch (error) {


    console.error(

      "Membership loading error:",

      error

    );


    const message =

      error.message ||

      "Unknown error";



    statsGrid.innerHTML = `


      <div
        class="error-box"
      >


        <strong>

          Membership statistics could not be loaded.

        </strong>


        <p>

          ${escapeHtml(
            message
          )}

        </p>


      </div>


    `;



    membershipList.innerHTML = `


      <div
        class="error-box"
      >


        <strong>

          Members could not be loaded.

        </strong>


        <p>

          ${escapeHtml(
            message
          )}

        </p>


      </div>


    `;


  }


}


/* =========================================
   START
========================================= */


document.addEventListener(

  "DOMContentLoaded",

  function() {


    loadMembership();


  }

);


</script>


</body>

</html>
