  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  </script>

  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #17182f;
    }

    header {
      background: #0d1038;
      color: white;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: white;
      text-decoration: none;
      font-size: 25px;
      font-weight: 700;
    }

    .logo span {
      color: #7c5cff;
    }

    .nav-spacer {
      flex: 1;
    }

    .nav-btn {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.3);
      padding: 9px 14px;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .page-header {
      margin-bottom: 25px;
    }

    .page-header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .page-header p {
      margin: 0;

    }

    .card {
      background: white;

<body>

<header>

  <div class="nav">

    <a
      class="logo"
      href="admin-dashboard.html"
    >
      Earn<span>Gig</span>
    </a>

    <div class="nav-spacer"></div>

      class="nav-btn"
      href="novel-review.html"
    >

    </a>

      class="nav-btn"

    >
      Logout
    </button>

  </div>

</header>


<main>

    <h1>
      Novel Review
    </h1>

    <p>
      Review the manuscript and configure the novel before approval.
    </p>

  </section>


  <div
    id="message"
    class="message"
  ></div>


  <div
    id="pageContent"
  >

    <div class="loading">
      Loading novel...
    </div>

</main>


<script>

let currentNovel = null;
let currentUser = null;


/* =====================================================
   GET NOVEL ID
   ===================================================== */

const params =
  new URLSearchParams(window.location.search);

const novelId =
  params.get("id");


if (!novelId) {

  alert("No novel was selected.");

  window.location.href =
    "novel-review.html";
}


/* =====================================================
   SECURITY
   ===================================================== */

async function checkAdmin() {

  const {
    data: { user },
    error
  } = await supabaseClient.auth.getUser();


  if (error || !user) {

    window.location.href =
      "index.html";

    return null;
  }


  const {
    data: profile,
    error: profileError
  } = await supabaseClient
    .from("profiles")
    .select("full_name, is_admin, account_status")
    .eq("id", user.id)
    .single();


  if (
    profileError ||
    !profile ||
    profile.is_admin !== true
  ) {

    await supabaseClient.auth.signOut();

    alert(
      "Access denied. Administrator privileges are required."
    );

    window.location.href =
      "index.html";

    return null;
  }


  if (
    profile.account_status &&
    profile.account_status !== "active"
  ) {

    await supabaseClient.auth.signOut();

    alert(
      "This administrator account is not active."
    );

    window.location.href =
      "index.html";

    return null;
  }


  currentUser = user;

alert(
  "Logged-in user ID:\n\n" +
  user.id +
  "\n\nAdmin profile ID:\n\n" +
  "5070b9c0-f842-4bd9-ba52-783120c135d9"
);

return user;
}


/* =====================================================
   LOAD NOVEL
   ===================================================== */

async function loadNovel() {

  const pageContent =
    document.getElementById("pageContent");


  const {
    data: novel,
    error
  } = await supabaseClient
    .from("novels")
    .select(`
      id,
      title,
      author_name,
      description,
      cover_url,
      genre,
      page_count,
      requested_reader_count,
      approved_reader_count,
      approved_reader_reward,
      writer_listing_fee,
      writer_payment_status,
      submission_status,
      status,
      manuscript_url,
      created_at,
      required_reading_percent
    `)
    .eq("id", novelId)
    .single();


  if (error || !novel) {

    console.error(
      "Novel loading error:",
      error
    );

    pageContent.innerHTML = `
      <div class="card">
        <h2>Novel could not be loaded</h2>
        <p>${escapeHtml(
          error?.message || "Novel not found."
        )}</p>
      </div>
    `;

    return false;
  }


  currentNovel = novel;


  const statusClass =
    novel.status === "published"
      ? "published"
      : novel.status === "approved"
      ? "approved"
      : novel.status === "rejected"
      ? "rejected"
      : "";


  pageContent.innerHTML = `

    <section class="card">

      <div class="novel-header">

        <div>

          <img
            class="cover"
            id="novelCover"
            src="${
              novel.cover_url ||
              "https://via.placeholder.com/300x420?text=No+Cover"
            }"
            alt="${escapeHtml(
              novel.title || "Novel"
            )} cover"
          >

        </div>


        <div>

          <h2 class="novel-title">
            ${escapeHtml(
              novel.title || "Untitled Novel"
            )}
          </h2>

          <div class="meta">

            <strong>Writer:</strong>
            ${escapeHtml(
              novel.author_name || "Unknown"
            )}
            <br>

            <strong>Genre:</strong>
            ${escapeHtml(
              novel.genre || "Not specified"
            )}
            <br>

            <strong>Submitted:</strong>
            ${novel.created_at
              ? new Date(novel.created_at).toLocaleString()
              : "Unknown"}
            <br>

            <strong>Requested readers:</strong>
            ${Number(
              novel.requested_reader_count || 0
            ).toLocaleString()}

          </div>


          <span class="status ${statusClass}">
            ${escapeHtml(
              novel.submission_status ||
              novel.status ||
              "Unknown"
            )}
          </span>

        </div>

      </div>


      <div class="description">

        <strong>Description</strong>

        <p>
          ${escapeHtml(
            novel.description ||
            "No description provided."
          )}
        </p>

      </div>

    </section>


    <section class="card">

      <h2 class="section-title">
        Manuscript
      </h2>

      <div class="manuscript-box">

        ${
          novel.manuscript_url
          ?
          `
          <p>
            The writer uploaded a manuscript.
          </p>

          <button
            type="button"
            class="btn secondary"
            onclick="viewManuscript()"
          >
            📄 View Manuscript
          </button>
          `
          :
          `
          <p>
            No manuscript has been uploaded.
          </p>
          `
        }

      </div>


      <div
        id="processorStatus"
        class="processor-status"
      ></div>

    </section>


    <section class="card">

      <h2 class="section-title">
        Approval & Pricing
      </h2>


      <div class="form-grid">


        <div class="form-group">

          <label for="quality">
            Quality Assessment
          </label>

          <select id="quality">

            <option value="">
              Select assessment
            </option>

            <option value="excellent">
              Excellent
            </option>

            <option value="good">
              Good
            </option>

            <option value="acceptable">
              Acceptable
            </option>

            <option value="needs_revision">
              Needs Revision
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="pages">
            Approved Pages
          </label>

          <input
            type="number"
            id="pages"
            min="1"
            value="${Number(
              novel.page_count ||
              0
            )}"
          >

          <div class="help">
            Actual processed manuscript pages will be synchronized after processing.
          </div>

        </div>


        <div class="form-group">

          <label for="reward">
            Reader Reward (₦)
          </label>

          <input
            type="number"
            id="reward"
            min="1"
            value="${Number(
              novel.approved_reader_reward ||
              0
            )}"
          >

        </div>


        <div class="form-group">

          <label for="readers">
            Approved Reader Target
          </label>

          <input
            type="number"
            id="readers"
            min="1"
            value="${Number(
              novel.approved_reader_count ||
              novel.requested_reader_count ||
              0
            )}"
          >

        </div>


        <div class="form-group">

          <label for="fee">
            Writer Listing Fee (₦)
          </label>

          <input
            type="number"
            id="fee"
            min="0"
            value="${Number(
              novel.writer_listing_fee ||
              0
            )}"
          >

        </div>


        <div class="form-group">

          <label for="readingPercent">
            Required Reading (%)
          </label>

          <input
            type="number"
            id="readingPercent"
            min="1"
            max="100"
            value="${Number(
              novel.required_reading_percent ||
              100
            )}"
          >

        </div>


        <div class="form-group full">

          <label for="notes">
            Assessment Notes
          </label>

          <textarea
            id="notes"
            placeholder="Enter assessment notes for the writer..."
          ></textarea>

        </div>

      </div>

    </section>


    <section class="card">

      <h2 class="section-title">
        Decision
      </h2>


      <div class="decision-actions">

        <button
          type="button"
          class="btn danger"
          onclick="rejectNovel()"
        >
          Reject
        </button>


        <button
          type="button"
          class="btn warning"
          onclick="requestRevision()"
        >
          Request Revision
        </button>


        <button
          type="button"
          class="btn secondary"
          onclick="processNovelManuscript()"
        >
          ⚙️ Process Manuscript
        </button>


        <button
          type="button"
          class="btn primary"
          onclick="approveNovel()"
        >
          ✓ Approve & Set Pricing
        </button>

      </div>

    </section>

  `;


  return true;
}


/* =====================================================
   VIEW PRIVATE MANUSCRIPT
   ===================================================== */

async function viewManuscript() {

  if (!currentNovel?.manuscript_url) {

    alert("No manuscript was uploaded.");

    return;
  }


  const {
    data,
    error
  } = await supabaseClient.storage
    .from("novel-manuscripts")
    .createSignedUrl(
      currentNovel.manuscript_url,
      3600
    );


  if (error) {

    console.error(
      "Signed URL error:",
      error
    );

    alert(
      "Could not open the manuscript:\n\n" +
      error.message
    );

    return;
  }


  window.open(
    data.signedUrl,
    "_blank"
  );
}


/* =====================================================
   PROCESS MANUSCRIPT
   ===================================================== */

async function processNovelManuscript() {

  if (
    !currentNovel ||
    !currentNovel.manuscript_url
  ) {

    alert(
      "No manuscript was found for this novel."
    );

    return false;
  }


  const statusBox =
    document.getElementById(
      "processorStatus"
    );


  if (statusBox) {

    statusBox.className =
      "processor-status show";

    statusBox.textContent =
      "Downloading and processing manuscript. Please wait...";
  }


  try {

    const {
      data: signedData,
      error: signedError
    } = await supabaseClient.storage
      .from("novel-manuscripts")
      .createSignedUrl(
        currentNovel.manuscript_url,
        3600
      );


    if (signedError) {
      throw signedError;
    }


    const response =
      await fetch(
        signedData.signedUrl
      );


    if (!response.ok) {

      throw new Error(
        "The manuscript could not be downloaded."
      );
    }


    const arrayBuffer =
      await response.arrayBuffer();


    const fileName =
      currentNovel.manuscript_url
        .toLowerCase();


    let pages = [];


    /* =========================
       PDF
       ========================= */

    if (fileName.endsWith(".pdf")) {

      if (statusBox) {
        statusBox.textContent =
          "Reading PDF pages...";
      }


      const pdf =
        await pdfjsLib.getDocument({
          data: arrayBuffer
        }).promise;


      for (
        let i = 1;
        i <= pdf.numPages;
        i++
      ) {

        if (statusBox) {
          statusBox.textContent =
            `Processing PDF page ${i} of ${pdf.numPages}...`;
        }


        const page =
          await pdf.getPage(i);


        const textContent =
          await page.getTextContent();


        const text =
          textContent.items
            .map(
              item => item.str || ""
            )
            .join(" ")
            .replace(/\s+/g, " ")
            .trim();


        if (!text) {

          throw new Error(
            `Page ${i} contains no readable text. This PDF may be scanned/image-only.`
          );
        }


        const safeText =
          escapeHtml(text);


        pages.push({

          id:
            crypto.randomUUID(),

          novel_id:
            currentNovel.id,

          page_number:
            i,

          chapter:
            "",

          title:
            `Page ${i}`,

          content:
            `<p>${safeText}</p>`

        });

      }

    }


    /* =========================
       DOCX
       ========================= */

    else if (
      fileName.endsWith(".docx")
    ) {

      if (statusBox) {
        statusBox.textContent =
          "Reading DOCX manuscript...";
      }


      const result =
        await mammoth.convertToHtml({
          arrayBuffer:
            arrayBuffer
        });


      const html =
        result.value;


      const temp =
        document.createElement("div");


      temp.innerHTML =
        html;


      const paragraphs =
        Array.from(
          temp.querySelectorAll("p")
        )
        .map(
          p => p.innerText.trim()
        )
        .filter(Boolean);


      if (!paragraphs.length) {

        throw new Error(
          "The DOCX manuscript contains no readable text."
        );
      }


      /*
       * DOCX does not provide reliable
       * physical pagination through Mammoth.
       *
       * We therefore create logical
       * reading pages.
       */

      const chunkSize =
        12;


      for (
        let i = 0;
        i < paragraphs.length;
        i += chunkSize
      ) {

        const chunk =
          paragraphs.slice(
            i,
            i + chunkSize
              );


          const content =
            chunk
              .map(
                text =>
                  `<p>${escapeHtml(text)}</p>`
              )
              .join("");


          pages.push({

            id:
              crypto.randomUUID(),

            novel_id:
              currentNovel.id,

            page_number:
              pages.length + 1,

            chapter:
              "",

            title:
              `Page ${pages.length + 1}`,

            content:
              content,

            created_at:
              new Date().toISOString()

          });

        }

      }


      /* =========================
         UNSUPPORTED FILE
         ========================= */

      else {

        throw new Error(
          "Unsupported manuscript format. Please upload PDF or DOCX."
        );

      }


      /* =========================
         CHECK PAGES
         ========================= */

      if (!pages.length) {

        throw new Error(
          "No readable pages were created."
        );

      }


      if (statusBox) {

        statusBox.textContent =
          `Successfully extracted ${pages.length} pages. Saving to database...`;

      }


/* =========================
   REPLACE NOVEL PAGES
   ========================= */

const {
  data: replacedCount,
  error: replaceError
} =
  await supabaseClient
    .rpc(
      "admin_replace_novel_pages",
      {
        p_novel_id:
          currentNovel.id,

        p_pages:
          pages
      }
    );


if (replaceError) {

  throw replaceError;

}


console.log(
  `Saved ${replacedCount} novel pages.`
);
    

      /* =========================
         UPDATE NOVEL PAGE COUNT
         ========================= */

      const {
        error: updateError
      } = await supabaseClient
        .from("novels")
        .update({
          page_count:
            pages.length
        })
        .eq(
          "id",
          currentNovel.id
        );


      if (updateError) {

        throw updateError;

      }


      currentNovel.page_count =
        pages.length;


      const pagesInput =
        document.getElementById(
          "pages"
        );


      if (pagesInput) {

        pagesInput.value =
          pages.length;

      }


      if (statusBox) {

        statusBox.className =
          "processor-status show";

        statusBox.textContent =
          `✓ Manuscript processed successfully. ${pages.length} reading pages are now stored in EarnGig.`;

      }


      alert(
        `Manuscript processed successfully.\n\n${pages.length} reading pages created.`
      );


      return true;


    } catch (error) {

      console.error(
        "Manuscript processing error:",
        error
      );


      if (statusBox) {

        statusBox.className =
          "processor-status show";

        statusBox.textContent =
          "Processing failed: " +
          (
            error.message ||
            "Unknown error"
          );

      }


      alert(
        "Manuscript processing failed:\n\n" +
        (
          error.message ||
          "Unknown error"
        )
      );


      return false;

    }

}


/* =====================================================
   APPROVE NOVEL
   ===================================================== */

async function approveNovel() {

  if (!currentNovel) {

    alert(
      "Novel has not loaded."
    );

    return;

  }


  const quality =
    document.getElementById(
      "quality"
    ).value;


  const pages =
    Number(
      document.getElementById(
        "pages"
      ).value
    );


  const reward =
    Number(
      document.getElementById(
        "reward"
      ).value
    );


  const readers =
    Number(
      document.getElementById(
        "readers"
      ).value
    );


  const fee =
    Number(
      document.getElementById(
        "fee"
      ).value
    );


  const readingPercent =
    Number(
      document.getElementById(
        "readingPercent"
      ).value
    );


  const notes =
    document.getElementById(
      "notes"
    ).value.trim();


  if (!pages || pages <= 0) {

    alert(
      "Please enter a valid page count."
    );

    return;

  }


  if (!reward || reward <= 0) {

    alert(
      "Please enter a valid reader reward."
    );

    return;

  }


  if (!readers || readers <= 0) {

    alert(
      "Please enter a valid reader target."
    );

    return;

  }


  if (
    Number.isNaN(fee) ||
    fee < 0
  ) {

    alert(
      "Please enter a valid listing fee."
    );

    return;

  }


  if (
    !readingPercent ||
    readingPercent < 1 ||
    readingPercent > 100
  ) {

    alert(
      "Required reading must be between 1% and 100%."
    );

    return;

  }


  if (!currentNovel.manuscript_url) {

    alert(
      "This novel has no manuscript."
    );

    return;

  }


  if (
    !confirm(
      "Approve this novel?\n\n" +
      "The manuscript will be processed first."
    )
  ) {

    return;

  }


  const processed =
    await processNovelManuscript();


  if (!processed) {

    return;

  }


  try {

    const {
      error
    } = await supabaseClient
      .from("novels")
      .update({

        submission_status:
          "approved",

        status:
          "approved",

        page_count:
          pages,

        approved_reader_count:
          readers,

        approved_reader_reward:
          reward,

        writer_listing_fee:
          fee,

        writer_payment_status:
          "unpaid",

        assessment_notes:
          notes,

        required_reading_percent:
          readingPercent,

        approved_at:
          new Date().toISOString(),

        approved_by:
          currentUser.id

      })
      .eq(
        "id",
        currentNovel.id
      );


    if (error) {

      throw error;

    }


    showMessage(
      "Novel approved successfully.",
      "success"
    );


    setTimeout(
      function() {

        window.location.href =
          "novel-review.html";

      },
      1000
    );


  } catch (error) {

    console.error(
      "Approval error:",
      error
    );


    showMessage(
      "Approval failed: " +
      (
        error.message ||
        "Unknown error"
      ),
      "error"
    );

  }

}


/* =====================================================
   REJECT NOVEL
   ===================================================== */

async function rejectNovel() {

  if (!currentNovel) {

    return;

  }


  if (
    !confirm(
      "Reject this novel submission?"
    )
  ) {

    return;

  }


  const notes =
    document.getElementById(
      "notes"
    ).value.trim();


  const {
    error
  } = await supabaseClient
    .from("novels")
    .update({

      submission_status:
        "rejected",

      status:
        "rejected",

      assessment_notes:
        notes,

      approved_by:
        currentUser.id

    })
    .eq(
      "id",
      currentNovel.id
    );


  if (error) {

    showMessage(
      error.message,
      "error"
    );

    return;

  }


  alert(
    "Novel rejected."
  );


  window.location.href =
    "novel-review.html";

}

/* =====================================================
   SHOW MESSAGE
   ===================================================== */

function showMessage(
  message,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.className =
    `message ${type} show`;


  box.textContent =
    message;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}
