<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Tasks | EarnGig</title>


  <!-- MAIN STYLES -->

  <link
    rel="stylesheet"
    href="styles.css?v=3"
  >


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <style>

    /* =========================================
       ADMIN PAGE
    ========================================= */

    .admin-page {

      min-height: 100vh;

      padding-top: 50px;

      padding-bottom: 70px;

      background:
        radial-gradient(
          circle at top left,
          rgba(109, 74, 255, 0.12),
          transparent 35%
        ),
        #080d26;

    }


    .admin-container {

      max-width: 1200px;

      margin: 0 auto;

    }



    /* =========================================
       ADMIN HEADER
    ========================================= */

    .admin-header {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 35px;

    }


    .admin-header h1 {

      margin: 10px 0 12px;

      color: #ffffff;

      font-size: 42px;

    }


    .admin-header p {

      margin: 0;

      max-width: 700px;

      color: #a9b0c7;

      line-height: 1.7;

      font-size: 16px;

    }



    /* =========================================
       EYEBROW
    ========================================= */

    .admin-page .eyebrow {

      color: #8f7cff;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 1.5px;

    }



    /* =========================================
       SUMMARY GRID
    ========================================= */

    .task-summary {

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 20px;

      margin-bottom: 35px;

    }


    .summary-card {

      position: relative;

      overflow: hidden;

      padding: 25px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(35, 45, 91, 0.95),
          rgba(17, 24, 59, 0.98)
        );

      border:
        1px solid rgba(123, 139, 255, 0.22);

      box-shadow:
        0 15px 35px
        rgba(0, 0, 0, 0.2);

    }


    .summary-card::before {

      content: "";

      position: absolute;

      width: 120px;

      height: 120px;

      border-radius: 50%;

      top: -60px;

      right: -40px;

      background:

        radial-gradient(
          circle,
          rgba(109, 74, 255, 0.18),
          transparent 70%
        );

    }


    .summary-card span {

      position: relative;

      display: block;

      margin-bottom: 12px;

      color: #aeb5cb;

      font-size: 15px;

    }


    .summary-card strong {

      position: relative;

      display: block;

      color: #ffffff;

      font-size: 38px;

      font-weight: 800;

    }



    /* =========================================
       ADMIN MESSAGE
    ========================================= */

    .admin-message {

      display: none;

      margin-bottom: 25px;

      padding: 16px 20px;

      border-radius: 14px;

      line-height: 1.6;

    }


    .admin-message.success {

      display: block;

      color: #9cf7bd;

      background:
        rgba(22, 163, 74, 0.12);

      border:
        1px solid rgba(74, 222, 128, 0.3);

    }


    .admin-message.error {

      display: block;

      color: #ffaaaa;

      background:
        rgba(220, 38, 38, 0.12);

      border:
        1px solid rgba(248, 113, 113, 0.3);

    }



    /* =========================================
       TASKS CARD
    ========================================= */

    .tasks-card {

      padding: 30px;

      border-radius: 24px;

      background:

        linear-gradient(
          145deg,
          rgba(29, 38, 80, 0.98),
          rgba(13, 19, 48, 0.98)
        );

      border:
        1px solid rgba(123, 139, 255, 0.2);

      box-shadow:
        0 20px 50px
        rgba(0, 0, 0, 0.28);

    }



    /* =========================================
       TASK CARD HEADER
    ========================================= */

    .tasks-card-header {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 28px;

      padding-bottom: 20px;

      border-bottom:
        1px solid rgba(255, 255, 255, 0.08);

    }


    .tasks-card-header h2 {

      margin: 0;

      color: #ffffff;

      font-size: 25px;

    }



    /* =========================================
       REFRESH BUTTON
    ========================================= */

    .admin-refresh-button {

      border:
        1px solid rgba(132, 145, 255, 0.45);

      background:
        rgba(255, 255, 255, 0.04);

      color: #ffffff;

      padding: 11px 18px;

      border-radius: 10px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.2s,
        background 0.2s;

    }


    .admin-refresh-button:hover {

      transform:
        translateY(-2px);

      background:
        rgba(109, 74, 255, 0.18);

    }



    /* =========================================
       LOADING
    ========================================= */

    .loading-message {

      padding: 60px 20px;

      text-align: center;

      color: #aeb5cb;

      font-size: 16px;

    }



    /* =========================================
       EMPTY STATE
    ========================================= */

    .empty-state {

      padding: 60px 20px;

      text-align: center;

      color: #9da6c1;

    }


    .empty-state h3 {

      margin: 0 0 12px;

      color: #ffffff;

      font-size: 22px;

    }


    .empty-state p {

      margin: 0;

      line-height: 1.6;

    }



    /* =========================================
       TASK ITEM
    ========================================= */

    .task-item {

      margin-bottom: 20px;

      padding: 25px;

      border-radius: 18px;

      background:

        linear-gradient(
          145deg,
          rgba(35, 45, 91, 0.75),
          rgba(21, 28, 64, 0.9)
        );

      border:
        1px solid rgba(124, 139, 255, 0.2);

      transition:
        transform 0.2s,
        border 0.2s;

    }


    .task-item:hover {

      transform:
        translateY(-2px);

      border-color:
        rgba(132, 111, 255, 0.45);

    }


    .task-item:last-child {

      margin-bottom: 0;

    }



    /* =========================================
       TASK TOP
    ========================================= */

    .task-top {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 18px;

    }


    .task-title {

      margin: 0 0 12px;

      color: #ffffff;

      font-size: 22px;

      line-height: 1.4;

    }



    /* =========================================
       CATEGORY
    ========================================= */

    .task-category {

      display: inline-block;

      padding: 6px 12px;

      border-radius: 20px;

      background:
        rgba(109, 74, 255, 0.18);

      border:
        1px solid rgba(132, 111, 255, 0.28);

      color: #a99cff;

      font-size: 12px;

      font-weight: 700;

      text-transform: capitalize;

    }



    /* =========================================
       STATUS
    ========================================= */

    .task-status {

      padding: 7px 13px;

      border-radius: 20px;

      font-size: 12px;

      font-weight: 800;

      text-transform: uppercase;

      white-space: nowrap;

    }


    .task-status.pending {

      color: #ffd37a;

      background:
        rgba(245, 158, 11, 0.13);

      border:
        1px solid rgba(245, 158, 11, 0.25);

    }



    /* =========================================
       DESCRIPTION
    ========================================= */

    .task-description {

      margin: 18px 0;

      color: #b7bfd5;

      line-height: 1.7;

      white-space: pre-wrap;

    }



    /* =========================================
       TASK LINK
    ========================================= */

    .task-link {

      display: inline-block;

      margin-top: 5px;

      margin-bottom: 20px;

      color: #9d8cff;

      text-decoration: none;

      font-weight: 700;

      word-break: break-word;

    }


    .task-link:hover {

      color: #c0b5ff;

      text-decoration: underline;

    }



    /* =========================================
       TASK DETAILS
    ========================================= */

    .task-details {

      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 15px;

      margin-top: 20px;

      padding-top: 22px;

      border-top:
        1px solid rgba(255, 255, 255, 0.08);

    }


    .task-detail {

      padding: 15px;

      border-radius: 13px;

      background:
        rgba(255, 255, 255, 0.035);

      border:
        1px solid rgba(255, 255, 255, 0.05);

    }


    .task-detail span {

      display: block;

      margin-bottom: 7px;

      color: #8f98b2;

      font-size: 12px;

    }


    .task-detail strong {

      color: #ffffff;

      font-size: 16px;

      word-break: break-word;

    }



    /* =========================================
       ACTIONS
    ========================================= */

    .task-actions {

      display: flex;

      justify-content: flex-end;

      gap: 12px;

      margin-top: 25px;

    }


    .approve-button,

    .reject-button {

      border: none;

      padding: 12px 20px;

      border-radius: 10px;

      font-size: 14px;

      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.2s,
        opacity 0.2s,
        box-shadow 0.2s;

    }


    .approve-button {

      color: white;

      background:

        linear-gradient(
          135deg,
          #5b4bff,
          #7b4dff
        );

      box-shadow:
        0 8px 20px
        rgba(91, 75, 255, 0.25);

    }


    .approve-button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 12px 25px
        rgba(91, 75, 255, 0.4);

    }


    .reject-button {

      color: #ffb1b1;

      background:
        rgba(220, 38, 38, 0.13);

      border:
        1px solid rgba(248, 113, 113, 0.3);

    }


    .reject-button:hover {

      transform:
        translateY(-2px);

      background:
        rgba(220, 38, 38, 0.22);

    }


    .approve-button:disabled,

    .reject-button:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;

    }



    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 850px) {


      .task-summary {

        grid-template-columns:
          1fr;

      }


      .task-details {

        grid-template-columns:
          repeat(2, 1fr);

      }


    }


    @media (max-width: 600px) {


      .admin-page {

        padding-top: 30px;

      }


      .admin-header {

        flex-direction: column;

      }


      .admin-header h1 {

        font-size: 32px;

      }


      .tasks-card {

        padding: 18px;

        border-radius: 18px;

      }


      .task-item {

        padding: 18px;

      }


      .task-top {

        flex-direction: column;

      }


      .task-details {

        grid-template-columns:
          1fr;

      }


      .task-actions {

        flex-direction: column-reverse;

      }


      .approve-button,

      .reject-button {

        width: 100%;

      }


      .tasks-card-header {

        align-items: flex-start;

        flex-direction: column;

      }


    }


  </style>


</head>


<body>


<!-- =========================================
     HEADER
========================================= -->

<header>


  <div class="container nav">


    <a
      href="index.html"
      class="logo"
    >


      <span class="logo-mark">
        E
      </span>


      Earn<span>Gig</span>


    </a>



    <a
      href="dashboard.html"
      class="btn outline"
    >

      Dashboard

    </a>


  </div>


</header>



<!-- =========================================
     MAIN
========================================= -->

<main class="dashboard-page admin-page">


  <div class="container admin-container">



    <!-- =====================================
         PAGE HEADER
    ====================================== -->

    <div class="admin-header">


      <div>


        <span class="eyebrow">

          ADMINISTRATION

        </span>


        <h1>

          Task Approval

        </h1>


        <p>

          Review submitted tasks and approve or reject them.
          Rejected tasks are automatically refunded to the
          task owner's wallet.

        </p>


      </div>


    </div>



    <!-- =====================================
         SUMMARY
    ====================================== -->

    <div class="task-summary">


      <div class="summary-card">


        <span>

          Pending Tasks

        </span>


        <strong id="pendingCount">

          0

        </strong>


      </div>



      <div class="summary-card">


        <span>

          Approved Tasks

        </span>


        <strong id="approvedCount">

          0

        </strong>


      </div>



      <div class="summary-card">


        <span>

          Rejected Tasks

        </span>


        <strong id="rejectedCount">

          0

        </strong>


      </div>


    </div>



    <!-- =====================================
         MESSAGE
    ====================================== -->

    <div
      id="adminMessage"
      class="admin-message"
    ></div>



    <!-- =====================================
         TASK LIST
    ====================================== -->

    <section class="tasks-card">


      <div class="tasks-card-header">


        <h2>

          Pending Tasks

        </h2>



        <button
          type="button"
          class="admin-refresh-button"
          onclick="loadTasks()"
        >

          Refresh

        </button>


      </div>



      <div id="tasksContainer">


        <div class="loading-message">

          Loading tasks...

        </div>


      </div>


    </section>


  </div>


</main>



<!-- =========================================
     FOOTER
========================================= -->

<footer>


  <div class="container copy">


    © 2026 EarnGig.
    All rights reserved.


  </div>


</footer>



<!-- =========================================
     JAVASCRIPT
========================================= -->

<script>


/* =========================================
   DOM ELEMENTS
========================================= */

const tasksContainer =
  document.getElementById(
    "tasksContainer"
  );


const pendingCount =
  document.getElementById(
    "pendingCount"
  );


const approvedCount =
  document.getElementById(
    "approvedCount"
  );


const rejectedCount =
  document.getElementById(
    "rejectedCount"
  );


const adminMessage =
  document.getElementById(
    "adminMessage"
  );



/* =========================================
   FORMAT NAIRA
========================================= */

function formatNaira(amount) {


  const value =
    Number(amount || 0);


  return (
    "₦" +
    value.toLocaleString(
      "en-NG",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    )
  );


}



/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {


  if (
    value === null ||
    value === undefined
  ) {

    return "";

  }


  const div =
    document.createElement("div");


  div.textContent =
    String(value);


  return div.innerHTML;


}



/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
  message,
  type
) {


  adminMessage.textContent =
    message;


  adminMessage.className =
    "admin-message " + type;


}



/* =========================================
   CLEAR MESSAGE
========================================= */

function clearMessage() {


  adminMessage.textContent =
    "";


  adminMessage.className =
    "admin-message";


}



/* =========================================
   GET CURRENT USER
========================================= */

async function getCurrentUser() {


  try {


    const {
      data,
      error
    } =
      await supabaseClient
        .auth
        .getUser();


    if (
      error ||
      !data ||
      !data.user
    ) {


      window.location.href =
        "login.html";


      return null;

    }


    return data.user;


  }


  catch (error) {


    console.error(
      "Authentication error:",
      error
    );


    window.location.href =
      "login.html";


    return null;


  }


}



/* =========================================
   LOAD TASK STATISTICS
========================================= */

async function loadTaskStatistics() {


  try {


    const [
      pendingResult,
      approvedResult,
      rejectedResult
    ] =
      await Promise.all([


        supabaseClient
          .from("tasks")
          .select(
            "*",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "status",
            "pending"
          ),


        supabaseClient
          .from("tasks")
          .select(
            "*",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "status",
            "approved"
          ),


        supabaseClient
          .from("tasks")
          .select(
            "*",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "status",
            "rejected"
          )


      ]);


    if (pendingResult.error) {

      throw pendingResult.error;

    }


    if (approvedResult.error) {

      throw approvedResult.error;

    }


    if (rejectedResult.error) {

      throw rejectedResult.error;

    }


    pendingCount.textContent =
      pendingResult.count || 0;


    approvedCount.textContent =
      approvedResult.count || 0;


    rejectedCount.textContent =
      rejectedResult.count || 0;


  }


  catch (error) {


    console.error(
      "Statistics error:",
      error
    );


  }


}



/* =========================================
   LOAD PENDING TASKS
========================================= */

async function loadTasks() {


  clearMessage();


  tasksContainer.innerHTML =
    `
      <div class="loading-message">
        Loading tasks...
      </div>
    `;


  try {


    const user =
      await getCurrentUser();


    if (!user) {

      return;

    }



    /* =====================================
       LOAD PENDING TASKS
    ====================================== */

    const {
      data: tasks,
      error
    } =
      await supabaseClient

        .from("tasks")

        .select(
          `
            id,
            title,
            description,
            category,
            task_link,
            reward_amount,
            max_participants,
            participant_count,
            platform_fee,
            total_amount,
            status,
            user_id,
            created_at
          `
        )

        .eq(
          "status",
          "pending"
        )

        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (error) {

      throw error;

    }



    /* =====================================
       EMPTY STATE
    ====================================== */

    if (
      !tasks ||
      tasks.length === 0
    ) {


      tasksContainer.innerHTML =
        `
          <div class="empty-state">

            <h3>
              No Pending Tasks
            </h3>

            <p>
              There are currently no tasks
              waiting for approval.
            </p>

          </div>
        `;


      await loadTaskStatistics();


      return;

    }



    /* =====================================
       BUILD TASKS
    ====================================== */

    tasksContainer.innerHTML =
      tasks.map(
        function(task) {


          const taskDate =
            task.created_at
              ?
            new Date(
              task.created_at
            ).toLocaleString(
              "en-NG",
              {
                dateStyle: "medium",
                timeStyle: "short"
              }
            )
              :
            "Unknown";


          const taskLink =
            task.task_link
              ?
            `
              <a
                href="${escapeHtml(task.task_link)}"
                target="_blank"
                rel="noopener noreferrer"
                class="task-link"
              >
                Open Task Link →
              </a>
            `
              :
            "";



          return `


            <article class="task-item">


              <!-- TASK HEADER -->

              <div class="task-top">


                <div>


                  <h3 class="task-title">

                    ${escapeHtml(
                      task.title ||
                      "Untitled Task"
                    )}

                  </h3>


                  <span class="task-category">

                    ${escapeHtml(
                      task.category ||
                      "General"
                    )}

                  </span>


                </div>



                <span class="task-status pending">

                  Pending

                </span>


              </div>



              <!-- DESCRIPTION -->

              <div class="task-description">

                ${escapeHtml(
                  task.description ||
                  "No description provided."
                )}

              </div>



              <!-- TASK LINK -->

              ${taskLink}



              <!-- TASK DETAILS -->

              <div class="task-details">


                <div class="task-detail">


                  <span>
                    Participants
                  </span>


                  <strong>

                    ${Number(
                      task.max_participants || 0
                    ).toLocaleString(
                      "en-NG"
                    )}

                  </strong>


                </div>



                <div class="task-detail">


                  <span>
                    Reward Each
                  </span>


                  <strong>

                    ${formatNaira(
                      task.reward_amount
                    )}

                  </strong>


                </div>



                <div class="task-detail">


                  <span>
                    Total Paid
                  </span>


                  <strong>

                    ${formatNaira(
                      task.total_amount
                    )}

                  </strong>


                </div>



                <div class="task-detail">


                  <span>
                    Submitted
                  </span>


                  <strong>

                    ${escapeHtml(
                      taskDate
                    )}

                  </strong>


                </div>


              </div>



              <!-- ACTIONS -->

              <div class="task-actions">


                <button
                  type="button"
                  class="reject-button"
                  id="reject-${task.id}"
                  onclick="rejectTask('${task.id}')"
                >

                  Reject & Refund

                </button>



                <button
                  type="button"
                  class="approve-button"
                  id="approve-${task.id}"
                  onclick="approveTask('${task.id}')"
                >

                  Approve

                </button>


              </div>


            </article>


          `;


        }
      ).join("");



    await loadTaskStatistics();


  }


  catch (error) {


    console.error(
      "Unable to load tasks:",
      error
    );


    tasksContainer.innerHTML =
      `
        <div class="empty-state">

          <h3>
            Unable to Load Tasks
          </h3>

          <p>
            ${escapeHtml(
              error.message ||
              "Please try again."
            )}
          </p>

        </div>
      `;


    showMessage(
      error.message ||
      "Unable to load tasks.",
      "error"
    );


  }


}



/* =========================================
   APPROVE TASK
========================================= */

async function approveTask(taskId) {


  if (!taskId) {


    alert(
      "Invalid task ID."
    );


    return;

  }



  const confirmed =
    confirm(
      "APPROVE TASK?\n\n" +
      "This task will become available " +
      "to EarnGig users."
    );


  if (!confirmed) {

    return;

  }



  const approveButton =
    document.getElementById(
      `approve-${taskId}`
    );


  const rejectButton =
    document.getElementById(
      `reject-${taskId}`
    );



  try {


    if (approveButton) {


      approveButton.disabled =
        true;


      approveButton.textContent =
        "Approving...";


    }


    if (rejectButton) {

      rejectButton.disabled =
        true;

    }



    clearMessage();



    const {
      error
    } =
      await supabaseClient

        .from("tasks")

        .update({

          status: "approved",

          updated_at:
            new Date().toISOString()

        })

        .eq(
          "id",
          taskId
        )

        .eq(
          "status",
          "pending"
        );


    if (error) {

      throw error;

    }



    showMessage(
      "Task approved successfully.",
      "success"
    );



    await loadTasks();


    await loadTaskStatistics();


  }


  catch (error) {


    console.error(
      "Task approval failed:",
      error
    );


    showMessage(
      error.message ||
      "Unable to approve task.",
      "error"
    );


  }


}



/* =========================================
   REJECT TASK WITH REFUND
========================================= */

async function rejectTask(taskId) {


  if (!taskId) {


    alert(
      "Invalid task ID."
    );


    return;

  }



  const confirmed =
    confirm(

      "REJECT TASK?\n\n" +

      "The task will be rejected.\n\n" +

      "The FULL amount paid by the task owner " +
      "will be refunded to their wallet.\n\n" +

      "The refund will NOT be counted " +
      "as an earning.\n\n" +

      "Do you want to continue?"

    );


  if (!confirmed) {

    return;

  }



  const rejectButton =
    document.getElementById(
      `reject-${taskId}`
    );


  const approveButton =
    document.getElementById(
      `approve-${taskId}`
    );



  try {


    if (rejectButton) {


      rejectButton.disabled =
        true;


      rejectButton.textContent =
        "Refunding...";


    }


    if (approveButton) {

      approveButton.disabled =
        true;

    }



    clearMessage();



    /* =====================================
       CALL REFUND RPC

       The database function handles:

       - Task locking
       - Double refund prevention
       - Wallet update
       - Task rejection
       - Transaction creation

       Refunds must NOT update total_earned.
    ====================================== */

    const {
      data,
      error
    } =
      await supabaseClient.rpc(

        "reject_task_with_refund",

        {
          p_task_id: taskId
        }

      );


    if (error) {


      console.error(
        "Reject task RPC error:",
        error
      );


      throw error;

    }



    if (
      !data ||
      data.success !== true
    ) {


      throw new Error(

        data?.message ||
        "Task rejection failed."

      );


    }



    const refundAmount =
      formatNaira(
        data.amount_refunded
      );


    const newBalance =
      formatNaira(
        data.new_wallet_balance
      );



    showMessage(

      "Task rejected successfully. " +

      refundAmount +

      " has been refunded to the task owner's wallet. " +

      "New wallet balance: " +

      newBalance +

      ". The refund was not counted as earnings.",

      "success"

    );



    console.log(
      "Task rejected successfully:",
      data
    );



    setTimeout(

      async function() {


        await loadTasks();


        await loadTaskStatistics();


      },

      1000

    );


  }


  catch (error) {


    console.error(
      "Task rejection failed:",
      error
    );


    let message =
      error?.message ||
      "Unable to reject task. Please try again.";


    const lowerMessage =
      String(
        message
      ).toLowerCase();



    if (
      lowerMessage.includes(
        "already been rejected"
      )
    ) {


      message =
        "This task has already been rejected and refunded.";


    }


    else if (
      lowerMessage.includes(
        "task not found"
      )
    ) {


      message =
        "The task could not be found.";


    }


    else if (
      lowerMessage.includes(
        "wallet not found"
      )
    ) {


      message =
        "The task owner's wallet could not be found. " +
        "The rejection was not completed.";


    }


    else if (
      lowerMessage.includes(
        "not authenticated"
      )
    ) {


      message =
        "Your session has expired. " +
        "Please log in again.";


    }


    else if (
      lowerMessage.includes(
        "only pending tasks"
      )
    ) {


      message =
        "Only pending tasks can be rejected.";


    }



    showMessage(
      message,
      "error"
    );


  }


  finally {


    if (rejectButton) {


      rejectButton.disabled =
        false;


      rejectButton.textContent =
        "Reject & Refund";


    }


    if (approveButton) {

      approveButton.disabled =
        false;

    }


  }


}



/* =========================================
   INITIALIZE ADMIN PAGE
========================================= */

async function initializeAdminTasks() {


  const user =
    await getCurrentUser();


  if (!user) {

    return;

  }



  await Promise.all([

    loadTaskStatistics(),

    loadTasks()

  ]);


}



/* =========================================
   START PAGE
========================================= */

initializeAdminTasks();
