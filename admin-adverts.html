<!DOCTYPE html>

<head>

  <style>

    ======================================== */

    .toolbar {

<script>


/* ========================================
   GLOBAL STATE
======================================== */

let currentAdminUser = null;

let allCampaigns = [];

let currentFilter = "all";



/* ========================================
   ADMIN SECURITY
======================================== */

async function checkAdmin() {

  const {

    data: {
      user
    },

    error

  } =
  await supabaseClient
    .auth
    .getUser();



  if (
    error ||
    !user
  ) {

    window.location.href =
      "index.html";

    return null;

  }



  const {

    data: profile,

    error: profileError

  } =
  await supabaseClient

    .from("profiles")

    .select(`
      full_name,
      is_admin,
      account_status
    `)

    .eq(
      "id",
      user.id
    )

    .single();



  if (

    profileError ||

    !profile ||

    profile.is_admin !== true

  ) {

    await supabaseClient
      .auth
      .signOut();


    alert(
      "Access denied. Administrator privileges are required."
    );


    window.location.href =
      "index.html";


    return null;

  }



  if (

    profile.account_status &&

    profile.account_status !==
    "active"

  ) {

    await supabaseClient
      .auth
      .signOut();


    alert(
      "This administrator account is not active."
    );


    window.location.href =
      "index.html";


    return null;

  }



  currentAdminUser =
    user;


  return user;

}



/* ========================================
   LOAD CAMPAIGNS
======================================== */

async function loadCampaigns() {

  const list =
    document.getElementById(
      "campaignList"
    );


  list.innerHTML = `

    <div class="state-box loading">

      Loading advertising campaigns...

    </div>

  `;


  try {

    const {

      data,

      error

    } =
    await supabaseClient

      .from("brand_ad_campaigns")

      .select("*")

      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


    if (error) {

      throw error;

    }


    allCampaigns =
      Array.isArray(data)
        ? data
        : [];


    updateSummary();

    renderCampaigns();


  }

  catch (error) {

    console.error(
      "Advert loading error:",
      error
    );


    list.innerHTML = `

      <div class="error-box">

        <strong>
          Advertising campaigns could not be loaded.
        </strong>

        <p>
          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}
        </p>

      </div>

    `;

  }

}



/* ========================================
   UPDATE SUMMARY
======================================== */

function updateSummary() {

  const total =
    allCampaigns.length;


  const pending =
    allCampaigns.filter(
      campaign =>
        normalizeStatus(
          campaign
        ) ===
        "pending_review"
    ).length;


  const revision =
    allCampaigns.filter(
      campaign =>
        normalizeStatus(
          campaign
        ) ===
        "revision_required"
    ).length;


  const payment =
    allCampaigns.filter(
      campaign =>
        normalizeStatus(
          campaign
        ) ===
        "approved_payment_required"
    ).length;


  const active =
    allCampaigns.filter(
      campaign =>
        normalizeStatus(
          campaign
        ) ===
        "active"
    ).length;


  document.getElementById(
    "totalCount"
  ).textContent =
    total.toLocaleString();


  document.getElementById(
    "pendingCount"
  ).textContent =
    pending.toLocaleString();


  document.getElementById(
    "revisionCount"
  ).textContent =
    revision.toLocaleString();


  document.getElementById(
    "paymentCount"
  ).textContent =
    payment.toLocaleString();


  document.getElementById(
    "activeCount"
  ).textContent =
    active.toLocaleString();

}



/* ========================================
   NORMALIZE STATUS
======================================== */

function normalizeStatus(
  campaign
) {

  const status =
    String(

      campaign.status ||

      ""

    )
      .trim()
      .toLowerCase();


  if (status) {

    return status;

  }


  const approval =
    String(

      campaign.approval_status ||

      ""

    )
      .trim()
      .toLowerCase();


  if (
    approval ===
    "pending"
  ) {

    return "pending_review";

  }


  if (
    approval ===
    "approved"
  ) {

    return "approved_payment_required";

  }


  if (
    approval ===
    "rejected"
  ) {

    return "rejected";

  }


  return "pending_review";

}



/* ========================================
   RENDER CAMPAIGNS
======================================== */

function renderCampaigns() {

  const list =
    document.getElementById(
      "campaignList"
    );


  let campaigns =
    allCampaigns;


  if (
    currentFilter !==
    "all"
  ) {

    campaigns =
      campaigns.filter(
        campaign =>
          normalizeStatus(
            campaign
          ) ===
          currentFilter
      );

  }



  if (
    campaigns.length ===
    0
  ) {

    list.innerHTML = `

      <div class="state-box">

        No advertising campaigns found
        for this filter.

      </div>

    `;

    return;

  }



  list.innerHTML =
    campaigns
      .map(
        campaign =>
          renderCampaign(
            campaign
          )
      )
      .join("");


  loadReviewHistories(
    campaigns
  );

}



/* ========================================
   RENDER CAMPAIGN
======================================== */

function renderCampaign(
  campaign
) {

  const status =
    normalizeStatus(
      campaign
    );


  const title =
    campaign.campaign_name ||
    campaign.ad_title ||
    "Untitled Advertising Campaign";


  const description =
    campaign.description ||
    "No description provided.";


  const amount =
    getCampaignAmount(
      campaign
    );


  const placement =
    campaign.placement ||
    "Not specified";


  const paymentStatus =
    campaign.payment_status ||
    "Not specified";


  const destination =
    getDestination(

    );

    formatDate(
      campaign.created_at
    );

    formatDate(

      campaign.submitted_at
    );

      <!-- HEADER -->

      <!-- BODY -->

      <div class="campaign-body">

        <div class="campaign-grid">



          <!-- VIDEOS -->

            </h3>

                : `

                  <div class="video-missing">

                    No EarnGig advert video
                    was supplied.

                  </div>

                `
            }



            ${
              campaign.tiktok_video_1_url

                ? `

                  <h3>
                    TikTok Video 1
                  </h3>

                  ${renderVideo(
                    campaign.tiktok_video_1_url,
                    "TikTok Video 1"
                  )}

                `

                : ""

            ${
              campaign.tiktok_video_2_url

                ? `

                  <h3>
                    TikTok Video 2
                  </h3>

                  ${renderVideo(
                    campaign.tiktok_video_2_url,
                    "TikTok Video 2"
                  )}

                `

            }



            ${

                ? `

                  <h3>
                    TikTok Video 3
                  </h3>

                  ${renderVideo(
                    campaign.tiktok_video_3_url,
                    "TikTok Video 3"
                  )}

            }

          </section>



          <!-- DETAILS -->

          <section class="details-section">

            <h3>
              Campaign Details
            </h3>


            <div class="detail-box">


              ${detailRow(
                "Brand / Advertiser",
                campaign.brand_name ||
                campaign.business_name ||
                campaign.brand_id ||
                "Not provided"
              )}


              ${detailRow(
                "Campaign",
                title
              )}


              ${detailRow(
                "Placement",
                placement
              )}


              ${detailRow(
                "Campaign Amount",
                formatMoney(
                  amount
                )
              )}


              ${detailRow(
                "Campaign Budget",
                formatMoney(
                  campaign.campaign_budget
                )
              )}


              ${detailRow(
                "Posting Fee",
                formatMoney(
                  campaign.posting_fee
                )
              )}


              ${detailRow(
                "Viewer Reward",
                formatMoney(
                  campaign.viewer_reward
                )
              )}


              ${detailRow(
                "Target Views",
                formatNumber(
                  campaign.target_views
                )
              )}


              ${detailRow(
                "Verified Views",
                formatNumber(
                  campaign.verified_views
                )
              )}


              ${detailRow(
                "Payment Status",
                paymentStatus
              )}


              ${detailRow(
                "Submitted",
                submitted
              )}


              ${detailRow(
                "Last Reviewed",
                reviewed
              )}


              ${detailRow(
                "Created",
                created

            </div>



            ${
              destination

                ? `

                  <div class="detail-box">

                    <div class="detail-label">

                      Destination Link

                      <a

                        )}"
                        target="_blank"

                      >

                        )}

            <div class="detail-box">

                Advert Description

              </div>

              <div class="description">

            </div>



            ${

                  <div class="existing-note">

                    </strong>

        <!-- REVIEW ACTIONS -->

        ${
          canReview

            ? `

              <div class="actions">

                <h3>
                  Admin Review

                <p class="action-help">

                  A note is required for

                  Approval does not require a note.

                </p>


                <textarea
                  id="review-note-${escapeAttribute(
                    campaignId
                  )}"
                  placeholder="Write your review note here..."
                ></textarea>


                <div class="action-buttons">

                      campaignId

                    class="action-btn changes-btn"
                    onclick="requestChanges('${escapeAttribute(
                      campaignId
                    )}')"

                    ✎ Request Changes

                  <button
                    type="button"
                    class="action-btn reject-btn"

                      campaignId

        <!-- REVIEW HISTORY -->

        <section class="history-section">

            Review History

              campaignId

            <div class="no-history">

            </div>

}



/* ========================================
   VIDEO RENDERING
======================================== */

function renderVideo(
  source,
  label
) {

  const url =
    resolveVideoUrl(
      source
    );


  if (!url) {

    return `

      <div class="video-missing">

        ${escapeHtml(
          label
        )}
        video could not be loaded.

      </div>

    `;

  }


  return `

    <div class="video-box">

      <video
        controls
        preload="metadata"
        playsinline
      >

        <source
          src="${escapeAttribute(
            url
          )}"
        >

        Your browser does not support
        video playback.

      </video>


      <div class="video-label">

        ${escapeHtml(
          label
        )}

      </div>

    </div>

  `;

}



/* ========================================
   RESOLVE VIDEO URL
======================================== */

function resolveVideoUrl(
  source
) {

  if (!source) {

    return "";

  }


  const value =
    String(
      source
    ).trim();


  if (
    value.startsWith(
      "http://"
    ) ||
    value.startsWith(
      "https://"
    ) ||
    value.startsWith(
      "blob:"
    ) ||
    value.startsWith(
      "data:"
    )
  ) {

    return value;

  }


  const {
    data
  } =
  supabaseClient
    .storage
    .from(
      "advert-videos"
    )
    .getPublicUrl(
      value
    );


  return data?.publicUrl || "";

}



/* ========================================
   LOAD REVIEW HISTORY
======================================== */

async function loadReviewHistories(
  campaigns
) {

  for (
    const campaign of campaigns
  ) {

    if (!campaign.id) {

      continue;

    }


    const {

      data,

      error

    } =
    await supabaseClient

      .from(
        "brand_ad_campaign_reviews"
      )

      .select(`
        id,
        campaign_id,
        admin_id,
        action,
        review_note,
        created_at
      `)

      .eq(
        "campaign_id",
        campaign.id
      )

      .order(
        "created_at",
        {
          ascending:
            false
        }
      );


    const historyElement =
      document.getElementById(
        `history-${campaign.id}`
      );


    if (!historyElement) {

      continue;

    }


    if (error) {

      console.error(
        "Review history error:",
        error
      );


      historyElement.innerHTML = `

        <div class="no-history">

          Review history could not be loaded.

        </div>

      `;


      continue;

    }


    if (
      !data ||
      data.length === 0
    ) {

      historyElement.innerHTML = `

        <div class="no-history">

          No previous reviews.

        </div>

      `;

      continue;

    }


    historyElement.innerHTML =
      data
        .map(
          item => `

            <div class="history-item">

              <div class="history-top">

                <span class="history-action">

                  ${escapeHtml(
                    formatReviewAction(
                      item.action
                    )
                  )}

                </span>


                <span class="history-date">

                  ${escapeHtml(
                    formatDate(
                      item.created_at
                    )
                  )}

                </span>

              </div>


              <div class="history-note">

                ${
                  item.review_note

                    ? escapeHtml(
                        item.review_note
                      )

                    : "No written note."
                }

              </div>

            </div>

          `
        )
        .join("");

  }

}



/* ========================================
   APPROVE
======================================== */

async function approveCampaign(
  campaignId
) {

  const campaign =
    findCampaign(
      campaignId
    );


  if (!campaign) {

    alert(
      "Campaign could not be found."
    );

    return;

  }


  const confirmed =
    confirm(

      "Approve this advertising campaign?\n\n" +

      "The advertiser will then be able to complete payment.\n\n" +

      "No money will be deducted by this approval action."

    );


  if (!confirmed) {

    return;

  }


  await performReview(
    campaignId,
    "approved",
    ""
  );

}



/* ========================================
   REQUEST CHANGES
======================================== */

async function requestChanges(
  campaignId
) {

  const note =
    getReviewNote(
      campaignId
    );


  if (!note) {

    alert(
      "Please write the changes the advertiser needs to make."
    );

    return;

  }


  const confirmed =
    confirm(

      "Send this campaign back to the advertiser for changes?"

    );


  if (!confirmed) {

    return;

  }


  await performReview(
    campaignId,
    "changes_requested",
    note
  );

}



/* ========================================
   REJECT
======================================== */

async function rejectCampaign(
  campaignId
) {

  const note =
    getReviewNote(
      campaignId
    );


  if (!note) {

    alert(
      "Please write the reason for rejecting this campaign."
    );

    return;

  }


  const confirmed =
    confirm(

      "Reject this advertising campaign?\n\n" +

      "The rejection reason will be saved for the advertiser."

    );


  if (!confirmed) {

    return;

  }


  await performReview(
    campaignId,
    "rejected",
    note
  );

}



/* ========================================
   PERFORM REVIEW
======================================== */

async function performReview(
  campaignId,
  action,
  note
) {

  if (!currentAdminUser) {

    alert(
      "Your administrator session has expired."
    );

    return;

  }


  const campaign =
    findCampaign(
      campaignId
    );


  if (!campaign) {

    alert(
      "Campaign could not be found."
    );

    return;

  }


  const card =
    document.querySelector(
      `[data-campaign-id="${cssEscape(
        campaignId
      )}"]`
    );


  const buttons =
    card
      ? card.querySelectorAll(
          ".action-btn"
        )
      : [];


  buttons.forEach(
    button => {
      button.disabled =
        true;
    }
  );


  try {


    const now =
      new Date().toISOString();


    let newStatus =
      "";


    let approvalStatus =
      "";


    if (
      action ===
      "approved"
    ) {

      newStatus =
        "approved_payment_required";

      approvalStatus =
        "approved";

    }


    if (
      action ===
      "changes_requested"
    ) {

      newStatus =
        "revision_required";

      approvalStatus =
        "revision_required";

    }


    if (
      action ===
      "rejected"
    ) {

      newStatus =
        "rejected";

      approvalStatus =
        "rejected";

    }



    /* --------------------------------------
       UPDATE CAMPAIGN
    --------------------------------------- */

    const updateData = {

      status:
        newStatus,

      approval_status:
        approvalStatus,

      admin_review_note:
        note || null,

      reviewed_by:
        currentAdminUser.id,

      reviewed_at:
        now

    };


    if (
      action ===
      "approved"
    ) {

      updateData.approved_at =
        now;

      updateData.approved_by =
        currentAdminUser.id;

    }


    if (
      action ===
      "changes_requested"
    ) {

      updateData.revision_count =
        Number(
          campaign.revision_count || 0
        ) + 1;

      updateData.last_submitted_at =
        campaign.last_submitted_at ||
        campaign.submitted_at ||
        campaign.created_at ||
        now;

    }


    const {
      error: updateError
    } =
    await supabaseClient

      .from(
        "brand_ad_campaigns"
      )

      .update(
        updateData
      )

      .eq(
        "id",
        campaignId
      );


    if (updateError) {

      throw updateError;

    }



    /* --------------------------------------
       SAVE REVIEW HISTORY
    --------------------------------------- */

    const {
      error: historyError
    } =
    await supabaseClient

      .from(
        "brand_ad_campaign_reviews"
      )

      .insert({

        campaign_id:
          campaignId,

        admin_id:
          currentAdminUser.id,

        action:
          action,

        review_note:
          note || null

      });


    if (historyError) {

      throw historyError;

    }



    /* --------------------------------------
       SUCCESS
    --------------------------------------- */

    if (
      action ===
      "approved"
    ) {

      alert(

        "Advert approved successfully.\n\n" +

        "The campaign is now awaiting payment."

      );

    }


    if (
      action ===
      "changes_requested"
    ) {

      alert(

        "Changes requested successfully.\n\n" +

        "The advertiser can now review your note, update the campaign and resubmit it."

      );

    }


    if (
      action ===
      "rejected"
    ) {

      alert(
        "Advert rejected successfully."
      );

    }


    await loadCampaigns();

  }

  catch (error) {

    console.error(
      "Advert review error:",
      error
    );


    alert(

      "The advert review could not be completed.\n\n" +

      (
        error.message ||
        "Unknown error"
      )

    );


    buttons.forEach(
      button => {
        button.disabled =
          false;
      }
    );

  }

}



/* ========================================
   FIND CAMPAIGN
======================================== */

function findCampaign(
  campaignId
) {

  return allCampaigns.find(
    campaign =>
      String(
        campaign.id
      ) ===
      String(
        campaignId
      )
  );

}



/* ========================================
   GET REVIEW NOTE
======================================== */

function getReviewNote(
  campaignId
) {

  const textarea =
    document.getElementById(
      `review-note-${campaignId}`
    );


  return textarea
    ? textarea.value.trim()
    : "";

}



/* ========================================
   GET DESTINATION
======================================== */

function getDestination(
  campaign
) {

  return (

    campaign.destination_url ||

    campaign.website_url ||

    campaign.target_url ||

    campaign.destination_link ||

    ""

  );

}



/* ========================================
   GET CAMPAIGN AMOUNT
======================================== */

function getCampaignAmount(
  campaign
) {

  const directAmount =
    Number(
      campaign.total_amount
    );


  if (
    Number.isFinite(
      directAmount
    ) &&
    directAmount > 0
  ) {

    return directAmount;

  }


  const budget =
    Number(
      campaign.campaign_budget
    );


  const postingFee =
    Number(
      campaign.posting_fee
    );


  const calculated =
    budget +
    postingFee;


  if (
    calculated > 0
  ) {

    return calculated;

  }


  return 0;

}



/* ========================================
   DETAIL ROW
======================================== */

function detailRow(
  label,
  value
) {

  return `

    <div class="detail-row">

      <span class="detail-label">

        ${escapeHtml(
          label
        )}

      </span>


      <span class="detail-value">

        ${escapeHtml(
          String(
            value ??
            "Not provided"
          )
        )}

      </span>

    </div>

  `;

}



/* ========================================
   FORMAT MONEY
======================================== */

function formatMoney(
  value
) {

  const amount =
    Number(
      value || 0
    );


  if (
    !Number.isFinite(
      amount
    ) ||
    amount === 0
  ) {

    return "₦0";

  }


  return (

    "₦" +

    amount.toLocaleString(
      "en-NG",
      {
        maximumFractionDigits:
          2
      }
    )

  );

}



/* ========================================
   FORMAT NUMBER
======================================== */

function formatNumber(
  value
) {

  const number =
    Number(
      value || 0
    );


  if (
    !Number.isFinite(
      number
    )
  ) {

    return "0";

  }


  return number.toLocaleString(
    "en-NG"
  );

}



/* ========================================
   FORMAT DATE
======================================== */

function formatDate(
  value
) {

  if (!value) {

    return "Not available";

  }


  const date =
    new Date(
      value
    );


  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "Not available";

  }


  return date.toLocaleString(
    "en-NG",
    {
      dateStyle:
        "medium",
      timeStyle:
        "short"
    }
  );

}



/* ========================================
   FORMAT STATUS
======================================== */

function formatStatus(
  status
) {

  const labels = {

    pending_review:
      "Pending Review",

    revision_required:
      "Changes Requested",

    approved_payment_required:
      "Awaiting Payment",

    paid:
      "Paid",

    active:
      "Active",

    completed:
      "Completed",

    rejected:
      "Rejected",

    approved:
      "Approved"

  };


  return (

    labels[
      status
    ] ||

    String(
      status ||
      "Unknown"
    )

      .replaceAll(
        "_",
        " "
      )

      .replace(
        /\b\w/g,
        character =>
          character.toUpperCase()
      )

  );

}



/* ========================================
   FORMAT REVIEW ACTION
======================================== */

function formatReviewAction(
  action
) {

  const labels = {

    approved:
      "Approved",

    changes_requested:
      "Changes Requested",

    rejected:
      "Rejected"

  };


  return (

    labels[
      action
    ] ||

    String(
      action ||
      "Review"
    )

      .replaceAll(
        "_",
        " "
      )

  );

}



/* ========================================
   HTML ESCAPE
======================================== */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* ========================================
   ATTRIBUTE ESCAPE
======================================== */

function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}



/* ========================================
   CSS ESCAPE
======================================== */

function cssEscape(
  value
) {

  if (
    window.CSS &&
    typeof window.CSS.escape ===
      "function"
  ) {

    return window.CSS.escape(
      String(
        value
      )
    );

  }


  return String(
    value
  )
    .replace(
      /["\\]/g,
      "\\$&"
    );

}



/* ========================================
   FILTER BUTTONS
======================================== */

document
  .querySelectorAll(
    ".filter-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",

          document
            .querySelectorAll(

                item.classList.remove(

            );


          this.classList.add(

          );


          currentFilter =
            this.dataset.filter ||
            "all";


          renderCampaigns();

      );

  );

   REFRESH
======================================== */

document
  .getElementById(

  )
  .addEventListener(

    async function() {

      this.disabled =

        "Refreshing...";

      this.disabled =

    "logoutButton"
  )

      await supabaseClient

        .signOut();


      window.location.href =

   START APPLICATION
======================================== */

(async function() {

    await checkAdmin();


  if (!user) {

    return;

  }


  await loadCampaigns();

})();
