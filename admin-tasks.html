<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnGig - Task Management</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #070b1c;
      color: #f5f7ff;
    }

    .topbar {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid #252a45;
      background: #0b1024;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      font-weight: 800;
      font-size: 20px;
    }

    .back-btn {
      border: 1px solid #343a5d;
      background: #171d38;
      color: #dfe4ff;
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .back-btn:hover {
      background: #20284a;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    .heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 18px;
    }

    .heading h1 {
      margin: 0;
      font-size: 25px;
    }

    .heading p {
      margin: 6px 0 0;
      color: #8f97b7;
      font-size: 14px;
    }

    .create-btn {
      border: 0;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      color: white;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: #11172d;
      border: 1px solid #252c49;
      border-radius: 12px;
      padding: 13px 15px;
    }

    .summary-label {
      color: #858eaf;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .summary-value {
      font-size: 20px;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .filter-btn {
      border: 1px solid #303754;
      background: #11172d;
      color: #b9c0dc;
      padding: 8px 12px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
    }

    .filter-btn.active {
      background: #21184b;
      color: #c7b4ff;
      border-color: #7c5ce6;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .task-row {
      width: 100%;
      border: 1px solid #252c49;
      background: #11172d;
      border-radius: 11px;
      padding: 11px 13px;
      display: grid;
      grid-template-columns: minmax(180px, 2.2fr)
                           105px
                           105px
                           90px
                           100px
                           105px;
      align-items: center;
      gap: 10px;
      text-align: left;
      color: inherit;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .task-row:hover {
      background: #161d38;
      border-color: #51459a;
      transform: translateY(-1px);
    }

    .task-header {
      cursor: default;
      background: #0c1227;
      border-color: #202640;
      color: #7f88a7;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .task-header:hover {
      transform: none;
      background: #0c1227;
      border-color: #202640;
    }

    .title-cell {
      min-width: 0;
    }

    .task-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-category {
      margin-top: 3px;
      color: #7f89aa;
      font-size: 11px;
    }

    .cell {
      color: #c1c7df;
      font-size: 12px;
    }

    .money {
      color: #d8caff;
      font-weight: 700;
    }

    .participants {
      color: #b7c0dc;
      font-weight: 600;
    }

    .status {
      display: inline-flex;
      width: fit-content;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status.approved {
      background: rgba(34, 197, 94, .13);
      color: #62e391;
    }

    .status.pending {
      background: rgba(245, 158, 11, .13);
      color: #f7c35d;
    }

    .status.rejected {
      background: rgba(239, 68, 68, .13);
      color: #ff7d7d;
    }

    .status.other {
      background: rgba(139, 92, 246, .13);
      color: #b99cff;
    }

    .open-cell {
      color: #a98aff;
      font-weight: 700;
      font-size: 12px;
      text-align: right;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      border: 1px dashed #303754;
      border-radius: 12px;
      color: #7f88a7;
      background: #0d1328;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #8d96b4;
    }

    .error {
      padding: 15px;
      border-radius: 10px;
      background: rgba(239, 68, 68, .1);
      border: 1px solid rgba(239, 68, 68, .25);
      color: #ff8f8f;
      margin-bottom: 15px;
      display: none;
    }

    @media (max-width: 900px) {
      .task-row {
        grid-template-columns: minmax(170px, 2fr)
                             85px
                             85px
                             80px;
      }

      .task-row > :nth-child(5),
      .task-row > :nth-child(6) {
        display: none;
      }

      .task-header > :nth-child(5),
      .task-header > :nth-child(6) {
        display: none;
      }
    }

    @media (max-width: 650px) {
      .topbar {
        padding: 0 14px;
      }

      .page {
        padding: 15px;
      }

      .heading {
        align-items: flex-start;
        flex-direction: column;
      }

      .summary {
        grid-template-columns: repeat(2, 1fr);
      }

      .task-row {
        grid-template-columns: minmax(145px, 2fr)
                             75px
                             75px;
        gap: 7px;
        padding: 10px;
      }

      .task-row > :nth-child(4),
      .task-row > :nth-child(5),
      .task-row > :nth-child(6) {
        display: none;
      }

      .task-header > :nth-child(4),
      .task-header > :nth-child(5),
      .task-header > :nth-child(6) {
        display: none;
      }

      .open-cell {
        display: none;
      }

      .heading h1 {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div class="brand">
      <div class="logo">E</div>
      <span>EarnGig Admin</span>
    </div>

    <button class="back-btn" onclick="goBack()">
      ← Dashboard
    </button>
  </header>

  <main class="page">

    <div class="heading">
      <div>
        <h1>Task Management</h1>
        <p>Click a task to review its participants and submissions.</p>
      </div>

      <button class="create-btn" onclick="createTask()">
        + Create Task
      </button>
    </div>

    <div class="summary">
      <div class="summary-card">
        <div class="summary-label">Total Tasks</div>
        <div class="summary-value" id="totalTasks">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Pending</div>
        <div class="summary-value" id="pendingTasks">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Approved</div>
        <div class="summary-value" id="approvedTasks">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-label">Rejected</div>
        <div class="summary-value" id="rejectedTasks">0</div>
      </div>
    </div>

    <div id="errorBox" class="error"></div>

    <div class="toolbar">
      <button class="filter-btn active" data-filter="all">
        All
      </button>

      <button class="filter-btn" data-filter="pending">
        Pending
      </button>

      <button class="filter-btn" data-filter="approved">
        Approved
      </button>

      <button class="filter-btn" data-filter="rejected">
        Rejected
      </button>
    </div>

    <div id="taskList">
      <div class="loading">Loading tasks...</div>
    </div>

  </main>

  <script>
    let allTasks = [];
    let currentFilter = "all";

    document.addEventListener("DOMContentLoaded", init);

    async function init() {
      try {
        await verifyAdmin();
        await loadTasks();
      } catch (error) {
        console.error(error);
        showError(error.message || "Unable to load task management.");
      }
    }

    async function verifyAdmin() {
      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();

      if (error) {
        throw new Error(error.message);
      }

      if (!user) {
        window.location.href = "index.html";
        return;
      }

      const { data: profile, error: profileError } =
        await supabaseClient
          .from("profiles")
          .select("id,is_admin,account_status")
          .eq("id", user.id)
          .maybeSingle();

      if (profileError) {
        throw new Error(profileError.message);
      }

      if (
        !profile ||
        profile.is_admin !== true ||
        profile.account_status !== "active"
      ) {
        throw new Error("Administrator access is required.");
      }
    }

    async function loadTasks() {
      const { data, error } = await supabaseClient
        .from("tasks")
        .select(`
          id,
          title,
          description,
          category,
          reward_amount,
          status,
          max_participants,
          participant_count,
          require_proof,
          task_type,
          action_type,
          platform,
          verification_type,
          created_at,
          updated_at
        `)
        .order("created_at", { ascending: false });

      if (error) {
        throw new Error(error.message);
      }

      allTasks = data || [];

      updateSummary();
      renderTasks();
    }

    function updateSummary() {
      document.getElementById("totalTasks").textContent =
        allTasks.length;

      document.getElementById("pendingTasks").textContent =
        allTasks.filter(t =>
          String(t.status || "").toLowerCase() === "pending"
        ).length;

      document.getElementById("approvedTasks").textContent =
        allTasks.filter(t =>
          String(t.status || "").toLowerCase() === "approved"
        ).length;

      document.getElementById("rejectedTasks").textContent =
        allTasks.filter(t =>
          String(t.status || "").toLowerCase() === "rejected"
        ).length;
    }

    function renderTasks() {
      const container = document.getElementById("taskList");

      let tasks = allTasks;

      if (currentFilter !== "all") {
        tasks = allTasks.filter(task =>
          String(task.status || "").toLowerCase() === currentFilter
        );
      }

      if (!tasks.length) {
        container.innerHTML = `
          <div class="empty">
            No tasks found for this filter.
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="task-row task-header">
          <div>Task</div>
          <div>Category</div>
          <div>Reward</div>
          <div>Participants</div>
          <div>Status</div>
          <div>Open</div>
        </div>

        ${tasks.map(task => renderTaskRow(task)).join("")}
      `;

      container.querySelectorAll("[data-task-id]").forEach(row => {
        row.addEventListener("click", () => {
          const taskId = row.dataset.taskId;

          window.location.href =
            "admin-task-detail.html?id=" +
            encodeURIComponent(taskId);
        });
      });
    }

    function renderTaskRow(task) {
      const status = String(task.status || "unknown").toLowerCase();

      const statusClass =
        status === "approved"
          ? "approved"
          : status === "pending"
            ? "pending"
            : status === "rejected"
              ? "rejected"
              : "other";

      const reward = Number(task.reward_amount || 0);

      const participantCount =
        Number(task.participant_count || 0);

      const maxParticipants =
        task.max_participants == null
          ? "∞"
          : Number(task.max_participants);

      const category =
        task.category ||
        task.platform ||
        task.task_type ||
        "General";

      return `
        <div
          class="task-row"
          data-task-id="${escapeHtml(task.id)}"
          title="Open task"
        >

          <div class="title-cell">
            <div class="task-title">
              ${escapeHtml(task.title || "Untitled Task")}
            </div>

            <div class="task-category">
              ${escapeHtml(
                task.action_type ||
                task.verification_type ||
                "Task"
              )}
            </div>
          </div>

          <div class="cell">
            ${escapeHtml(category)}
          </div>

          <div class="cell money">
            ₦${formatMoney(reward)}
          </div>

          <div class="cell participants">
            ${participantCount} / ${maxParticipants}
          </div>

          <div>
            <span class="status ${statusClass}">
              ${escapeHtml(status)}
            </span>
          </div>

          <div class="open-cell">
            View →
          </div>

        </div>
      `;
    }

    document.querySelectorAll(".filter-btn").forEach(button => {
      button.addEventListener("click", () => {

        document
          .querySelectorAll(".filter-btn")
          .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");

        currentFilter = button.dataset.filter;

        renderTasks();
      });
    });

    function createTask() {
      window.location.href = "admin-create-task.html";
    }

    function goBack() {
      window.location.href = "admin-dashboard.html";
    }

    function formatMoney(value) {
      return Number(value || 0).toLocaleString("en-NG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showError(message) {
      const box = document.getElementById("errorBox");
      box.textContent = message;
      box.style.display = "block";
    }
  </script>

</body>
</html>
