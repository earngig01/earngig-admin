<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Task Management - EarnGig Admin</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #070b1a;
      --card: #11172d;
      --card-hover: #151d38;
      --border: rgba(255, 255, 255, 0.08);

      --purple: #7c3aed;
      --purple-light: #a78bfa;

      --text: #f8fafc;
      --muted: #94a3b8;

      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      color: var(--text);
      line-height: 1.5;

      background:
        radial-gradient(
          circle at top right,
          rgba(124, 58, 237, 0.18),
          transparent 32%
        ),
        radial-gradient(
          circle at top left,
          rgba(59, 130, 246, 0.08),
          transparent 28%
        ),
        var(--bg);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    /* =================================
       HEADER
    ================================= */

    .eg-header {
      width: 100%;

      position: sticky;
      top: 0;
      z-index: 100;

      background: rgba(7, 11, 26, 0.9);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .eg-nav {
      width: min(1180px, calc(100% - 32px));
      min-height: 76px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .eg-logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;

      font-weight: 800;
    }

    .eg-logo-mark {
      width: 40px;
      height: 40px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          var(--purple-light),
          var(--purple)
        );

      color: white;

      font-size: 20px;
      font-weight: 900;

      box-shadow:
        0 8px 24px rgba(124, 58, 237, 0.35);
    }

    .eg-logo-word {
      font-size: 22px;
      color: white;
    }

    .eg-logo-word span {
      color: var(--purple-light);
    }

    /*
      IMPORTANT:
      This points to the ADMIN dashboard.
      It does NOT point to the member dashboard.
    */

    .eg-dashboard-button {
      min-height: 42px;

      padding: 0 18px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(167, 139, 250, 0.25);
      border-radius: 11px;

      background: rgba(124, 58, 237, 0.12);

      color: #ddd6fe;

      font-size: 14px;
      font-weight: 700;

      transition: 0.2s ease;
    }

    .eg-dashboard-button:hover {
      background: rgba(124, 58, 237, 0.24);
      border-color: rgba(167, 139, 250, 0.5);

      transform: translateY(-1px);
    }

    /* =================================
       PAGE
    ================================= */

    .page {
      width: min(1180px, calc(100% - 32px));

      margin: 0 auto;

      padding: 42px 0 60px;
    }

    .page-heading {
      margin-bottom: 28px;
    }

    .page-heading h1 {
      font-size: clamp(28px, 4vw, 40px);

      line-height: 1.15;

      letter-spacing: -1px;

      margin-bottom: 9px;
    }

    .page-heading p {
      color: var(--muted);

      font-size: 15px;
    }

    /* =================================
       MESSAGE
    ================================= */

    .message {
      display: none;

      margin-bottom: 24px;

      padding: 14px 16px;

      border-radius: 12px;

      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.success {
      background: rgba(34, 197, 94, 0.12);

      border: 1px solid rgba(34, 197, 94, 0.25);

      color: #86efac;
    }

    .message.error {
      background: rgba(239, 68, 68, 0.12);

      border: 1px solid rgba(239, 68, 68, 0.25);

      color: #fca5a5;
    }

    .message.info {
      background: rgba(59, 130, 246, 0.12);

      border: 1px solid rgba(59, 130, 246, 0.25);

      color: #93c5fd;
    }

    /* =================================
       SUMMARY CARDS
    ================================= */

    .summary-grid {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 16px;

      margin-bottom: 34px;
    }

    .summary-card {
      position: relative;

      overflow: hidden;

      padding: 21px;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.045),
          rgba(255, 255, 255, 0.015)
        ),
        var(--card);

      border: 1px solid var(--border);

      box-shadow:
        0 14px 35px rgba(0, 0, 0, 0.18);
    }

    .summary-card::after {
      content: "";

      position: absolute;

      width: 90px;
      height: 90px;

      right: -30px;
      top: -35px;

      border-radius: 50%;

      background: rgba(124, 58, 237, 0.08);
    }

    .summary-label {
      color: var(--muted);

      font-size: 13px;

      margin-bottom: 8px;
    }

    .summary-value {
      font-size: 28px;

      font-weight: 800;
    }

    .summary-card.total .summary-value {
      color: #c4b5fd;
    }

    .summary-card.pending .summary-value {
      color: #fbbf24;
    }

    .summary-card.approved .summary-value {
      color: #4ade80;
    }

    .summary-card.rejected .summary-value {
      color: #f87171;
    }

    /* =================================
       SECTION
    ================================= */

    .section-header {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 16px;

      margin-bottom: 18px;
    }

    .section-title {
      font-size: 21px;

      font-weight: 800;
    }

    .section-subtitle {
      color: var(--muted);

      font-size: 13px;

      margin-top: 3px;
    }

    .refresh-button {
      padding: 10px 14px;

      border-radius: 10px;

      border: 1px solid var(--border);

      background: rgba(255, 255, 255, 0.04);

      color: #e2e8f0;

      cursor: pointer;

      font-size: 13px;

      font-weight: 700;

      transition: 0.2s ease;
    }

    .refresh-button:hover {
      background: rgba(124, 58, 237, 0.14);

      border-color:
        rgba(167, 139, 250, 0.3);
    }

    .refresh-button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    /* =================================
       TASK LIST
    ================================= */

    .tasks-list {
      display: grid;

      gap: 16px;
    }

    .task-card {
      padding: 22px;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.035),
          rgba(255, 255, 255, 0.01)
        ),
        var(--card);

      border: 1px solid var(--border);

      transition: 0.2s ease;
    }

    .task-card:hover {
      transform: translateY(-2px);

      background: var(--card-hover);

      border-color:
        rgba(167, 139, 250, 0.2);
    }

    .task-top {
      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 18px;

      margin-bottom: 14px;
    }

    .task-title {
      font-size: 19px;

      font-weight: 800;

      margin-bottom: 7px;
    }

    .task-category {
      display: inline-flex;

      padding: 5px 9px;

      border-radius: 7px;

      background:
        rgba(124, 58, 237, 0.12);

      color: #c4b5fd;

      font-size: 11px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.4px;
    }

    .status-badge {
      flex-shrink: 0;

      padding: 6px 10px;

      border-radius: 8px;

      background:
        rgba(245, 158, 11, 0.12);

      color: #fbbf24;

      font-size: 11px;

      font-weight: 800;

      text-transform: uppercase;

      letter-spacing: 0.4px;
    }

    .task-description {
      color: #cbd5e1;

      font-size: 14px;

      line-height: 1.65;

      margin-bottom: 17px;

      white-space: pre-wrap;

      word-break: break-word;
    }

    .task-meta {
      display: grid;

      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 10px;

      margin-bottom: 18px;
    }

    .meta-item {
      padding: 12px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.025);

      border:
        1px solid rgba(255, 255, 255, 0.05);
    }

    .meta-label {
      color: var(--muted);

      font-size: 11px;

      margin-bottom: 4px;
    }

    .meta-value {
      color: white;

      font-size: 14px;

      font-weight: 700;

      word-break: break-word;
    }

    .task-link {
      margin-bottom: 18px;
    }

    .task-link a {
      color: #a78bfa;

      font-size: 13px;

      font-weight: 600;

      overflow-wrap: anywhere;
    }

    .task-link a:hover {
      text-decoration: underline;
    }

    .task-actions {
      display: flex;

      gap: 10px;

      padding-top: 17px;

      border-top:
        1px solid var(--border);
    }

    .action-button {
      min-height: 42px;

      padding: 0 16px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 13px;

      font-weight: 800;

      border:
        1px solid transparent;

      transition: 0.2s ease;
    }

    .action-button:hover {
      transform: translateY(-1px);
    }

    .action-button:disabled {
      opacity: 0.5;

      cursor: not-allowed;

      transform: none;
    }

    .approve-button {
      background:
        rgba(34, 197, 94, 0.14);

      border-color:
        rgba(34, 197, 94, 0.25);

      color: #86efac;
    }

    .approve-button:hover {
      background:
        rgba(34, 197, 94, 0.23);
    }

    .reject-button {
      background:
        rgba(239, 68, 68, 0.12);

      border-color:
        rgba(239, 68, 68, 0.24);

      color: #fca5a5;
    }

    .reject-button:hover {
      background:
        rgba(239, 68, 68, 0.2);
    }

    /* =================================
       LOADING
    ================================= */

    .loading {
      padding: 45px 20px;

      text-align: center;

      color: var(--muted);

      font-size: 14px;
    }

    .spinner {
      width: 26px;
      height: 26px;

      margin: 0 auto 12px;

      border-radius: 50%;

      border:
        3px solid rgba(255, 255, 255, 0.1);

      border-top-color:
        var(--purple-light);

      animation:
        spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =================================
       EMPTY STATE
    ================================= */

    .empty-state {
      padding: 50px 20px;

      text-align: center;

      border-radius: 17px;

      border:
        1px dashed rgba(255, 255, 255, 0.09);

      background:
        rgba(255, 255, 255, 0.02);
    }

    .empty-icon {
      width: 54px;
      height: 54px;

      margin: 0 auto 15px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      background:
        rgba(124, 58, 237, 0.12);

      color: #c4b5fd;

      font-size: 23px;
    }

    .empty-state h3 {
      font-size: 17px;

      margin-bottom: 6px;
    }

    .empty-state p {
      color: var(--muted);

      font-size: 13px;
    }

    /* =================================
       FOOTER
    ================================= */

    .footer {
      width: min(1180px, calc(100% - 32px));

      margin: 0 auto;

      padding: 22px 0 35px;

      border-top:
        1px solid var(--border);

      text-align: center;

      color: #64748b;

      font-size: 12px;
    }

    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 850px) {

      .summary-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .task-meta {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {

      .eg-nav {
        width: calc(100% - 22px);

        min-height: 68px;
      }

      .eg-logo-mark {
        width: 36px;
        height: 36px;

        border-radius: 10px;
      }

      .eg-logo-word {
        font-size: 20px;
      }

      .eg-dashboard-button {
        min-height: 38px;

        padding: 0 12px;

        font-size: 12px;
      }

      .page {
        width: calc(100% - 22px);

        padding-top: 30px;
      }

      .summary-grid {
        gap: 10px;

        margin-bottom: 27px;
      }

      .summary-card {
        padding: 16px;

        border-radius: 14px;
      }

      .summary-value {
        font-size: 23px;
      }

      .section-header {
        align-items: flex-start;
      }

      .section-title {
        font-size: 19px;
      }

      .task-card {
        padding: 17px;

        border-radius: 14px;
      }

      .task-top {
        flex-direction: column;

        gap: 10px;
      }

      .status-badge {
        align-self: flex-start;
      }

      .task-title {
        font-size: 17px;
      }

      .task-meta {
        grid-template-columns:
          1fr 1fr;
      }

      .task-actions {
        flex-direction: column;
      }

      .action-button {
        width: 100%;
      }
    }

    @media (max-width: 380px) {

      .eg-logo-word {
        font-size: 18px;
      }

      .eg-dashboard-button {
        padding: 0 10px;
      }

      .task-meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- =================================
       HEADER
       BOTH LINKS GO TO ADMIN DASHBOARD
  ================================= -->

  <header class="eg-header">

    <div class="eg-nav">

      <!-- EarnGig Admin Logo -->
      <a

  <!-- =================================

  ================================= -->

  <main class="page">

        Task Management
      </h1>

      </p>

    <section class="summary-grid">

      <div class="summary-card total">

        </div>

        <div

  <!-- =================================
       FOOTER
  ================================= -->

  <footer class="footer">
    © 2026 EarnGig. Admin Task Management.
  </footer>


  <!-- =================================
       JAVASCRIPT
  ================================= -->

  <script>

    /* =================================
       HELPERS
    ================================= */

    function formatNaira(amount) {

      const value =
        Number(amount || 0);

      return new Intl.NumberFormat(
        "en-NG",
        {
          style: "currency",
          currency: "NGN",
          maximumFractionDigits: 2
        }
      ).format(value);
    }


    function escapeHtml(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    function formatDate(value) {

      if (!value) {
        return "Unknown";
      }

      const date =
        new Date(value);

      if (
        Number.isNaN(
          date.getTime()
        )
      ) {
        return "Unknown";
      }

      return date.toLocaleString(
        "en-NG",
        {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        }
      );
    }


    function showMessage(
      text,
      type = "info"
    ) {

      const element =
        document.getElementById(
          "message"
        );

      element.textContent = text;

      element.className =
        `message show ${type}`;
    }


    function clearMessage() {

      const element =
        document.getElementById(
          "message"
        );

      element.textContent = "";

      element.className =
        "message";
    }


    /* =================================
       CHECK SUPABASE
    ================================= */

    async function checkSupabase() {

      if (
        typeof supabaseClient ===
        "undefined" ||
        !supabaseClient
      ) {

        throw new Error(
          "Supabase client could not be loaded. Please check supabase.js."
        );
      }
    }


    /* =================================
       CHECK LOGIN
    ================================= */

    async function checkLogin() {

      await checkSupabase();


      const {
        data,
        error
      } =
        await supabaseClient.auth.getUser();


      if (error) {

        console.error(
          "Auth error:",
          error
        );

        throw new Error(
          `Authentication failed: ${error.message}`
        );
      }


      if (
        !data ||
        !data.user
      ) {

        throw new Error(
          "No active admin login session. Please log in again."
        );
      }


      return data.user;
    }


    /* =================================
       LOAD STATISTICS
    ================================= */

    async function loadTaskStatistics() {

      const results =
        await Promise.all([

          supabaseClient
            .from("tasks")
            .select(
              "id",
              {
                count: "exact",
                head: true
              }
            ),

          supabaseClient
            .from("tasks")
            .select(
              "id",
              {
                count: "exact",
                head: true
              }
            )
            .eq(
              "status",
              "pending"
            ),

          supabaseClient
            .from("tasks")
            .select(
              "id",
              {
                count: "exact",
                head: true
              }
            )
            .eq(
              "status",
              "approved"
            ),

          supabaseClient
            .from("tasks")
            .select(
              "id",
              {
                count: "exact",
                head: true
              }
            )
            .eq(
              "status",
              "rejected"
            )

        ]);


      const [
        total,
        pending,
        approved,
        rejected
      ] = results;


      if (total.error) {

        throw new Error(
          `Unable to load total tasks: ${total.error.message}`
        );
      }


      if (pending.error) {

        throw new Error(
          `Unable to load pending task count: ${pending.error.message}`
        );
      }


      if (approved.error) {

        throw new Error(
          `Unable to load approved task count: ${approved.error.message}`
        );
      }


      if (rejected.error) {

        throw new Error(
          `Unable to load rejected task count: ${rejected.error.message}`
        );
      }


      document.getElementById(
        "totalTasks"
      ).textContent =
        total.count || 0;


      document.getElementById(
        "pendingTasks"
      ).textContent =
        pending.count || 0;


      document.getElementById(
        "approvedTasks"
      ).textContent =
        approved.count || 0;


      document.getElementById(
        "rejectedTasks"
      ).textContent =
        rejected.count || 0;
    }


    /* =================================
       LOAD PENDING TASKS
    ================================= */

    async function loadTasks() {

      const container =
        document.getElementById(
          "tasksContainer"
        );


      container.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          Loading pending tasks...
        </div>
      `;


      const {
        data,
        error
      } =
        await supabaseClient
          .from("tasks")
          .select(`
            id,
            title,
            description,
            category,
            task_link,
            reward_amount,
            max_participants,
            participant_count,
            platform_fee,
            total_amount,
            status,
            user_id,
            created_at
          `)
          .eq(
            "status",
            "pending"
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (error) {

        console.error(
          "Task query error:",
          error
        );

        throw new Error(
          `Unable to load pending tasks: ${error.message}`
        );
      }


      if (
        !data ||
        data.length === 0
      ) {

        container.innerHTML = `
          <div class="empty-state">

            <div class="empty-icon">
              ✓
            </div>

            <h3>
              No pending tasks
            </h3>

            <p>
              There are currently no tasks waiting for review.
            </p>

          </div>
        `;

        return;
      }


      container.innerHTML =
        data
          .map(
            createTaskCard
          )
          .join("");
    }


    /* =================================
       CREATE TASK CARD
    ================================= */

    function createTaskCard(task) {

      const id =
        escapeHtml(task.id);

      const title =
        escapeHtml(
          task.title ||
          "Untitled Task"
        );

      const description =
        escapeHtml(
          task.description ||
          "No description provided."
        );

      const category =
        escapeHtml(
          task.category ||
          "General"
        );


      let taskLink = "";


      if (task.task_link) {

        taskLink = `
          <div class="task-link">

            <a
              href="${escapeHtml(task.task_link)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Open Task Link →
            </a>

          </div>
        `;
      }


      return `

        <article
          class="task-card"
          id="task-${id}"
        >

          <div class="task-top">

            <div>

              <div class="task-title">
                ${title}
              </div>

              <span class="task-category">
                ${category}
              </span>

            </div>

            <span class="status-badge">
              Pending
            </span>

          </div>


          <div class="task-description">
            ${description}
          </div>


          <div class="task-meta">

            <div class="meta-item">

              <div class="meta-label">
                Reward
              </div>

              <div class="meta-value">
                ${formatNaira(
                  task.reward_amount
                )}
              </div>

            </div>


            <div class="meta-item">

              <div class="meta-label">
                Participants
              </div>

              <div class="meta-value">
                ${escapeHtml(
                  task.participant_count || 0
                )}
                /
                ${escapeHtml(
                  task.max_participants || 0
                )}
              </div>

            </div>


            <div class="meta-item">

              <div class="meta-label">
                Total Amount
              </div>

              <div class="meta-value">
                ${formatNaira(
                  task.total_amount
                )}
              </div>

            </div>


            <div class="meta-item">

              <div class="meta-label">
                Submitted
              </div>

              <div class="meta-value">
                ${formatDate(
                  task.created_at
                )}
              </div>

            </div>

          </div>


          ${taskLink}


          <div class="task-actions">

            <button
              type="button"
              class="action-button approve-button"
              onclick="approveTask('${id}')"
            >
              ✓ Approve Task
            </button>


            <button
              type="button"
              class="action-button reject-button"
              onclick="rejectTask('${id}')"
            >
              ✕ Reject & Refund
            </button>

          </div>

        </article>
      `;
    }


    /* =================================
       APPROVE TASK
    ================================= */

    async function approveTask(taskId) {

      if (!taskId) {
        return;
      }


      const confirmed =
        confirm(
          "Approve this task?\n\n" +
          "The task will be marked as approved."
        );


      if (!confirmed) {
        return;
      }


      clearMessage();


      const card =
        document.getElementById(
          `task-${taskId}`
        );


      const buttons =
        card
          ? card.querySelectorAll(
              ".action-button"
            )
          : [];


      buttons.forEach(
        button => {
          button.disabled = true;
        }
      );


      try {

        const {
          error
        } =
          await supabaseClient
            .from("tasks")
            .update({
              status: "approved",

              updated_at:
                new Date()
                  .toISOString()
            })
            .eq(
              "id",
              taskId
            )
            .eq(
              "status",
              "pending"
            );


        if (error) {
          throw error;
        }


        showMessage(
          "Task approved successfully.",
          "success"
        );


        await Promise.all([
          loadTaskStatistics(),
          loadTasks()
        ]);

      } catch (error) {

        console.error(
          "Approve task error:",
          error
        );


        buttons.forEach(
          button => {
            button.disabled = false;
          }
        );


        showMessage(
          error.message ||
          "Unable to approve task.",
          "error"
        );
      }
    }


    /* =================================
       REJECT TASK + REFUND
    ================================= */

    async function rejectTask(taskId) {

      if (!taskId) {
        return;
      }


      const confirmed =
        confirm(
          "Reject this task?\n\n" +
          "The full task payment will be refunded to the task owner's wallet.\n\n" +
          "The refund will NOT count as earnings."
        );


      if (!confirmed) {
        return;
      }


      clearMessage();


      const card =
        document.getElementById(
          `task-${taskId}`
        );


      const buttons =
        card
          ? card.querySelectorAll(
              ".action-button"
            )
          : [];


      buttons.forEach(
        button => {
          button.disabled = true;
        }
      );


      try {

        /*
          IMPORTANT:
          This uses the existing secure
          Supabase RPC for rejection + refund.
        */

        const {
          data,
          error
        } =
          await supabaseClient.rpc(
            "reject_task_with_refund",
            {
              p_task_id: taskId
            }
          );


        if (error) {
          throw error;
        }


        console.log(
          "Reject/refund response:",
          data
        );


        if (
          !data ||
          data.success !== true
        ) {

          throw new Error(
            data &&
            data.message
              ? data.message
              : "Task rejection and refund failed."
          );
        }


        const refundedAmount =
          Number(
            data.amount_refunded || 0
          );


        const newBalance =
          Number(
            data.new_wallet_balance || 0
          );


        showMessage(
          `Task rejected successfully. ${formatNaira(
            refundedAmount
          )} refunded to the task owner's wallet. New wallet balance: ${formatNaira(
            newBalance
          )}. The refund was not counted as earnings.`,
          "success"
        );


        await Promise.all([
          loadTaskStatistics(),
          loadTasks()
        ]);

      } catch (error) {

        console.error(
          "Reject/refund error:",
          error
        );


        buttons.forEach(
          button => {
            button.disabled = false;
          }
        );


        showMessage(
          error.message ||
          "Unable to reject task and process refund.",
          "error"
        );
      }
    }


    /* =================================
       REFRESH
    ================================= */

    async function refreshTasks() {

      const button =
        document.getElementById(
          "refreshButton"
        );


      button.disabled = true;

      button.textContent =
        "Refreshing...";


      clearMessage();


      try {

        await Promise.all([
          loadTaskStatistics(),
          loadTasks()
        ]);

      } catch (error) {

        console.error(
          "Refresh error:",
          error
        );


        showMessage(
          error.message ||
          "Unable to refresh task data.",
          "error"
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "Refresh";
      }
    }


    /* =================================
       INITIALIZE
    ================================= */

    async function initializePage() {

      try {

        await checkLogin();


        await Promise.all([
          loadTaskStatistics(),
          loadTasks()
        ]);

      } catch (error) {

        console.error(
          "Admin task page initialization error:",
          error
        );


        document.getElementById(
          "tasksContainer"
        ).innerHTML = `

          <div class="empty-state">

            <div class="empty-icon">
              !
            </div>

            <h3>
              Unable to load task management
            </h3>

            <p>
              ${escapeHtml(
                error.message ||
                "An unexpected error occurred."
              )}
            </p>

          </div>

        `;


        showMessage(
          error.message ||
          "Unable to load task management.",
          "error"
        );
      }
    }


    /* =================================
       EVENTS
    ================================= */

    document
      .getElementById(
        "refreshButton"
      )
      .addEventListener(
        "click",
        refreshTasks
      );


    /* =================================
       START
    ================================= */

    initializePage();

  </script>

</body>
</html>
