<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Users - Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        /* ================================
           HEADER
        ================================= */

        .header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 18px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .header h1 {
            font-size: 24px;
        }

        .back-btn {
            text-decoration: none;
            background: #111827;
            color: white;

            padding: 10px 16px;

            border-radius: 8px;

            font-size: 14px;
        }

        /* ================================
           CONTAINER
        ================================= */

        .container {
            max-width: 1350px;

            margin: 30px auto;

            padding: 0 20px;
        }

        /* ================================
           ERROR
        ================================= */

        .error {
            padding: 16px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 8px;

            margin-bottom: 20px;

            display: none;

            line-height: 1.5;
        }

        /* ================================
           STATS
        ================================= */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 18px;

            margin-bottom: 25px;
        }

        .stat-card {
            background: white;

            padding: 20px;

            border-radius: 12px;

            border: 1px solid #e8e8e8;
        }

        .stat-card h3 {
            color: #777;

            font-size: 14px;

            font-weight: normal;

            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 28px;

            font-weight: bold;

            color: #111827;
        }

        /* ================================
           SEARCH
        ================================= */

        .top-section {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;

            min-width: 250px;
        }

        .search-box input {
            width: 100%;

            padding: 14px;

            border-radius: 8px;

            border: 1px solid #ddd;

            font-size: 15px;

            background: white;
        }

        .search-box input:focus {
            outline: none;

            border-color: #9ca3af;
        }

        /* ================================
           TABLE
        ================================= */

        .table-card {
            background: white;

            border-radius: 12px;

            border: 1px solid #e8e8e8;

            overflow: hidden;
        }

        .table-header {
            padding: 20px;

            border-bottom: 1px solid #eee;
        }

        .table-header h2 {
            font-size: 18px;

            margin-bottom: 5px;
        }

        .table-header p {
            color: #777;

            font-size: 13px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 1000px;
        }

        th {
            background: #fafafa;

            color: #666;

            font-size: 13px;

            text-align: left;

            padding: 15px;
        }

        td {
            padding: 16px 15px;

            border-top: 1px solid #eee;

            font-size: 14px;
        }

        tr:hover {
            background: #fafafa;
        }

        /* ================================
           USER
        ================================= */

        .user-name {
            font-weight: bold;
        }

        .user-phone {
            color: #777;

            font-size: 12px;

            margin-top: 4px;
        }

        .user-referral {
            color: #777;

            font-size: 12px;

            margin-top: 3px;
        }

        /* ================================
           BADGES
        ================================= */

        .badge {
            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            display: inline-block;

            white-space: nowrap;
        }

        .active {
            background: #dcfce7;

            color: #15803d;
        }

        .inactive {
            background: #fee2e2;

            color: #b91c1c;
        }

        .pending {
            background: #fef3c7;

            color: #92400e;
        }

        .expired {
            background: #fee2e2;

            color: #991b1b;
        }

        .unknown {
            background: #f3f4f6;

            color: #555;
        }

        .legacy {
            background: #fef3c7;

            color: #92400e;
        }

        /* ================================
           PLAN
        ================================= */

        .plan-name {
            font-weight: bold;
        }

        .plan-price {
            color: #777;

            font-size: 12px;

            margin-top: 3px;
        }

        /* ================================
           WALLET
        ================================= */

        .wallet-balance {
            font-weight: bold;
        }

        .no-wallet {
            color: #999;
        }

        /* ================================
           BUTTON
        ================================= */

        .view-btn {
            border: none;

            background: #111827;

            color: white;

            padding: 9px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 13px;
        }

        .view-btn:hover {
            opacity: 0.85;
        }

        /* ================================
           LOADING
        ================================= */

        .loading {
            padding: 40px;

            text-align: center;

            color: #777;
        }

        .empty {
            padding: 40px;

            text-align: center;

            color: #777;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                padding: 0 12px;

                margin-top: 20px;
            }

            th,
            td {
                padding: 12px;
            }

        }

    </style>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<div class="header">

    <h1>
        Manage Users
    </h1>

    <a
        href="admin-dashboard.html"
        class="back-btn"
    >

    </a>

</div>


<!-- =====================================
     MAIN
===================================== -->

<div class="container">


    <!-- ERROR -->

    <div
        id="errorBox"
        class="error"
    ></div>


    <!-- =====================================
         STATISTICS
    ===================================== -->

    <div class="stats">


        <div class="stat-card">

            <h3>
                Total Users
            </h3>

            <div
                id="totalUsers"
                class="number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Active Users
            </h3>

            <div
                id="activeUsers"
                class="number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Inactive Users
            </h3>

            <div
                id="inactiveUsers"
                class="number"
            >
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Users With Wallets
            </h3>

            <div
                id="walletUsers"
                class="number"
            >
                0
            </div>

        </div>


    </div>


    <!-- =====================================
         SEARCH
    ===================================== -->

    <div class="top-section">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name, phone, referral code or user ID..."
            >

        </div>

    </div>


    <!-- =====================================
         USERS TABLE
    ===================================== -->

    <div class="table-card">


        <div class="table-header">

            <h2>
                Registered Users
            </h2>

            <p>
                Account and membership overview. Open User Details for complete information.
            </p>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            User
                        </th>

                        <th>
                            Joined
                        </th>

                        <th>
                            Wallet
                        </th>

                        <th>
                            Membership
                        </th>

                        <th>
                            Plan
                        </th>

                        <th>
                            Account Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody
                    id="usersTableBody"
                >

                    <tr>

                        <td
                            colspan="7"
                            class="loading"
                        >
                            Loading users...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>


    </div>


</div>


<script>


/* =========================================
   SUPABASE CONNECTION
========================================= */

const SUPABASE_URL =
    "https://ytvtdelwefykeqwztcyo.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_CLTeqgEB6JSQ7Kqq6rQARw_RV31Ccg3";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================
   GLOBAL DATA
========================================= */

let allUsers = [];


/* =========================================
   PLAN INFORMATION
========================================= */

const PLAN_NAMES = {

    starter: "Starter",

    standard: "Standard",

    premium: "Premium",

    elite: "Elite"

};


const PLAN_PRICES = {

    starter: 4500,

    standard: 9000,

    premium: 18000,

    elite: 36000

};


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   USER NAME
========================================= */

function getUserName(user) {

    if (!user) {

        return "Unknown User";

    }

    return (
        user.full_name ||
        "Unnamed User"
    );

}


/* =========================================
   FORMAT DATE
========================================= */

function formatDate(dateValue) {

    if (!dateValue) {

        return "—";

    }

    const date =
        new Date(dateValue);


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "—";

    }

    return new Intl.DateTimeFormat(
        "en-NG",
        {
            timeZone: "Africa/Lagos",

            year: "numeric",

            month: "short",

            day: "numeric"
        }
    ).format(date);

}


/* =========================================
   FORMAT MONEY
========================================= */

function formatMoney(amount) {

    const value =
        Number(amount || 0);

    return new Intl.NumberFormat(
        "en-NG",
        {
            style: "currency",

            currency: "NGN",

            minimumFractionDigits: 0,

            maximumFractionDigits: 2
        }
    ).format(value);

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(message) {

    const errorBox =
        document.getElementById(
            "errorBox"
        );

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================
   HIDE ERROR
========================================= */

function hideError() {

    document
        .getElementById(
            "errorBox"
        )
        .style.display =
        "none";

}


/* =========================================
   ADMIN CHECK
========================================= */

async function checkAdmin() {

    try {

        const {
            data: {
                user
            },
            error: authError
        } =
            await supabaseClient
                .auth
                .getUser();


        if (
            authError ||
            !user
        ) {

            window.location.href =
                "login.html";

            return false;

        }


        const {
            data: profile,
            error
        } =
            await supabaseClient

                .from("profiles")

                .select(
                    "id, account_status, is_admin"
                )

                .eq(
                    "id",
                    user.id
                )

                .single();


        if (
            error ||
            !profile ||
            profile.is_admin !== true ||
            profile.account_status !== "active"
        ) {

            alert(
                "You do not have permission to access this page."
            );

            window.location.href =
                "dashboard.html";

            return false;

        }


        return true;

    }

    catch (error) {

        showError(
            "Unable to verify admin access: " +
            (
                error.message ||
                "Unknown error"
            )
        );

        return false;

    }

}


/* =========================================
   ACCOUNT STATUS
========================================= */

function getAccountStatus(user) {

    const status =
        String(
            user.account_status ||
            "inactive"
        ).toLowerCase();


    if (
        status === "active"
    ) {

        return {

            label: "Active",

            className: "active"

        };

    }


    if (
        status === "pending"
    ) {

        return {

            label: "Pending",

            className: "pending"

        };

    }


    return {

        label: "Inactive",

        className: "inactive"

    };

}


/* =========================================
   MEMBERSHIP STATUS
========================================= */

function getMembershipStatus(
    membership
) {

    if (!membership) {

        return {

            label: "No Membership",

            className: "unknown"

        };

    }


    if (
        membership.status !==
        "active"
    ) {

        if (
            membership.status ===
            "pending"
        ) {

            return {

                label: "Pending",

                className: "pending"

            };

        }


        return {

            label: "Inactive",

            className: "inactive"

        };

    }


    if (
        membership.current_period_end
    ) {

        const expiry =
            new Date(
                membership.current_period_end
            ).getTime();


        if (
            !Number.isNaN(expiry) &&
            expiry < Date.now()
        ) {

            return {

                label: "Expired",

                className: "expired"

            };

        }

    }


    return {

        label: "Active",

        className: "active"

    };

}


/* =========================================
   PLAN DISPLAY
========================================= */

function getPlanHtml(
    membership
) {

    if (!membership) {

        return `
            <span class="badge unknown">
                No Plan
            </span>
        `;

    }


    if (
        !membership.plan_code
    ) {

        return `
            <span class="badge legacy">
                Legacy / Unconfigured
            </span>
        `;

    }


    const plan =
        PLAN_NAMES[
            membership.plan_code
        ] ||
        membership.plan_code;


    const price =
        PLAN_PRICES[
            membership.plan_code
        ];


    return `

        <div class="plan-name">
            ${escapeHtml(plan)}
        </div>

        ${
            price
                ? `
                    <div class="plan-price">
                        ${formatMoney(price)}
                    </div>
                `
                : ""
        }

    `;

}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers() {

    hideError();


    const tableBody =
        document.getElementById(
            "usersTableBody"
        );


    tableBody.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="loading"
            >
                Loading users...
            </td>

        </tr>

    `;


    try {


        /* =====================================
           LOAD PROFILES
        ===================================== */

        const {
            data: profiles,
            error: profilesError
        } =
            await supabaseClient

                .from("profiles")

                .select(`
                    id,
                    full_name,
                    phone,
                    referral_code,
                    account_status,
                    is_admin,
                    created_at
                `)

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (
            profilesError
        ) {

            throw new Error(
                "Profiles: " +
                profilesError.message
            );

        }


        /* =====================================
           LOAD WALLETS
        ===================================== */

        const {
            data: wallets,
            error: walletsError
        } =
            await supabaseClient

                .from("wallets")

                .select(
                    "user_id, balance"
                );


        if (
            walletsError
        ) {

            console.warn(
                "Wallet loading error:",
                walletsError
            );

        }


        /* =====================================
           LOAD MEMBERSHIPS
        ===================================== */

        const {
            data: memberships,
            error: membershipsError
        } =
            await supabaseClient

                .from("memberships")

                .select(`
                    id,
                    user_id,
                    status,
                    plan_code,
                    current_period_start,
                    current_period_end,
                    payment_count
                `);


        if (
            membershipsError
        ) {

            throw new Error(
                "Memberships: " +
                membershipsError.message
            );

        }


        /* =====================================
           WALLET MAP
        ===================================== */

        const walletMap =
            new Map();


        (
            wallets || []
        ).forEach(
            wallet => {

                if (
                    wallet.user_id
                ) {

                    walletMap.set(
                        wallet.user_id,
                        wallet
                    );

                }

            }
        );


        /* =====================================
           MEMBERSHIP MAP
        ===================================== */

        const membershipMap =
            new Map();


        (
            memberships || []
        ).forEach(
            membership => {

                if (
                    membership.user_id
                ) {

                    membershipMap.set(
                        membership.user_id,
                        membership
                    );

                }

            }
        );


        /* =====================================
           COMBINE USERS
        ===================================== */

        allUsers =
            (
                profiles || []
            ).map(
                user => {

                    return {

                        ...user,

                        wallet:
                            walletMap.get(
                                user.id
                            ) || null,

                        membership:
                            membershipMap.get(
                                user.id
                            ) || null

                    };

                }
            );


        /* =====================================
           STATISTICS
        ===================================== */

        updateStatistics();


        /* =====================================
           DISPLAY
        ===================================== */

        displayUsers(
            allUsers
        );


    }

    catch (error) {

        console.error(
            "Users loading error:",
            error
        );


        showError(
            error.message ||
            "Unable to load users."
        );


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >
                    Unable to load users.
                </td>

            </tr>

        `;

    }

}


/* =========================================
   UPDATE STATISTICS
========================================= */

function updateStatistics() {

    const total =
        allUsers.length;


    const active =
        allUsers.filter(
            user =>
                String(
                    user.account_status ||
                    ""
                ).toLowerCase() ===
                "active"
        ).length;


    const inactive =
        allUsers.filter(
            user =>
                String(
                    user.account_status ||
                    ""
                ).toLowerCase() !==
                "active"
        ).length;


    const withWallet =
        allUsers.filter(
            user =>
                user.wallet !== null
        ).length;


    document
        .getElementById(
            "totalUsers"
        )
        .textContent =
        total;


    document
        .getElementById(
            "activeUsers"
        )
        .textContent =
        active;


    document
        .getElementById(
            "inactiveUsers"
        )
        .textContent =
        inactive;


    document
        .getElementById(
            "walletUsers"
        )
        .textContent =
        withWallet;

}


/* =========================================
   DISPLAY USERS
========================================= */

function displayUsers(
    users
) {

    const tableBody =
        document.getElementById(
            "usersTableBody"
        );


    if (
        !users ||
        users.length === 0
    ) {

        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="empty"
                >
                    No users found.
                </td>

            </tr>

        `;

        return;

    }


    tableBody.innerHTML = "";


    users.forEach(
        user => {

            const row =
                document.createElement(
                    "tr"
                );


            const accountStatus =
                getAccountStatus(
                    user
                );


            const membershipStatus =
                getMembershipStatus(
                    user.membership
                );


            const walletHtml =
                user.wallet

                    ?

                    `
                        <span class="wallet-balance">
                            ${formatMoney(
                                user.wallet.balance
                            )}
                        </span>
                    `

                    :

                    `
                        <span class="no-wallet">
                            No wallet
                        </span>
                    `;


            row.innerHTML = `

                <td>

                    <div class="user-name">
                        ${escapeHtml(
                            getUserName(user)
                        )}
                    </div>


                    ${
                        user.phone
                            ? `
                                <div class="user-phone">
                                    ${escapeHtml(
                                        user.phone
                                    )}
                                </div>
                            `
                            : ""
                    }


                    ${
                        user.referral_code
                            ? `
                                <div class="user-referral">
                                    Referral:
                                    ${escapeHtml(
                                        user.referral_code
                                    )}
                                </div>
                            `
                            : ""
                    }

                </td>


                <td>

                    ${formatDate(
                        user.created_at
                    )}

                </td>


                <td>

                    ${walletHtml}

                </td>


                <td>

                    <span
                        class="badge ${membershipStatus.className}"
                    >
                        ${membershipStatus.label}
                    </span>

                </td>


                <td>

                    ${getPlanHtml(
                        user.membership
                    )}

                </td>


                <td>

                    <span
                        class="badge ${accountStatus.className}"
                    >
                        ${accountStatus.label}
                    </span>

                </td>


                <td>

                    <button
                        type="button"
                        class="view-btn"
                        data-user-id="${escapeHtml(
                            user.id
                        )}"
                    >
                        View User
                    </button>

                </td>

            `;


            tableBody.appendChild(
                row
            );

        }
    );


    /* =====================================
       VIEW USER BUTTONS
    ===================================== */

    document
        .querySelectorAll(
            ".view-btn"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    function () {

                        openUser(
                            this.dataset.userId
                        );

                    }
                );

            }
        );

}


/* =========================================
   OPEN USER DETAILS
========================================= */

function openUser(
    userId
) {

    window.location.href =
        "admin-user-details.html?id=" +
        encodeURIComponent(
            userId
        );

}


/* =========================================
   SEARCH
========================================= */

document
    .getElementById(
        "searchInput"
    )
    .addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .toLowerCase()
                    .trim();


            if (!search) {

                displayUsers(
                    allUsers
                );

                return;

            }


            const filtered =
                allUsers.filter(
                    user => {

                        const name =
                            String(
                                user.full_name ||
                                ""
                            )
                            .toLowerCase();


                        const phone =
                            String(
                                user.phone ||
                                ""
                            )
                            .toLowerCase();


                        const referral =
                            String(
                                user.referral_code ||
                                ""
                            )
                            .toLowerCase();


                        const id =
                            String(
                                user.id ||
                                ""
                            )
                            .toLowerCase();


                        const plan =
                            String(
                                user.membership
                                    ?.plan_code ||
                                ""
                            )
                            .toLowerCase();


                        return (

                            name.includes(
                                search
                            )

                            ||

                            phone.includes(
                                search
                            )

                            ||

                            referral.includes(
                                search
                            )

                            ||

                            id.includes(
                                search
                            )

                            ||

                            plan.includes(
                                search
                            )

                        );

                    }
                );


            displayUsers(
                filtered
            );

        }
    );


/* =========================================
   INITIALIZE
========================================= */

async function init() {

    const allowed =
        await checkAdmin();


    if (!allowed) {

        return;

    }


    await loadUsers();

}


init();
