<script>


/* =========================================
   GLOBAL VARIABLES
========================================= */


let currentAdmin = null;


let allTransactions = [];


/* =========================================
   ESCAPE HTML
========================================= */


function escapeHtml(value) {


  if (

    value === null ||

    value === undefined

  ) {

    return "—";

  }


  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   FORMAT MONEY
========================================= */


function formatMoney(amount) {


  const value =
    Number(amount || 0);


  return new Intl.NumberFormat(

    "en-NG",

    {

      style:
        "currency",

      currency:
        "NGN",

      minimumFractionDigits:
        0,

      maximumFractionDigits:
        2

    }

  ).format(value);

}


/* =========================================
   FORMAT DATE
========================================= */


function formatDate(date) {


  if (!date) {

    return "—";

  }


  try {


    return new Date(date)

      .toLocaleString(

        "en-NG",

        {

          year:
            "numeric",

          month:
            "short",

          day:
            "numeric",

          hour:
            "2-digit",

          minute:
            "2-digit"

        }

      );


  }

  catch (error) {


    return "—";

  }

}


/* =========================================
   ADMIN SECURITY CHECK
========================================= */


async function checkAdmin() {


  try {


    const {

      data:
      {
        user
      },

      error

    }

    =

    await supabaseClient
      .auth
      .getUser();



    if (

      error ||

      !user

    ) {


      window.location.href =
        "index.html";


      return null;

    }



    const {

      data:
      profile,

      error:
      profileError

    }

    =

    await supabaseClient

      .from(
        "profiles"
      )

      .select(

        `
          full_name,
          is_admin,
          account_status
        `

      )

      .eq(
        "id",
        user.id
      )

      .single();



    if (

      profileError ||

      !profile ||

      profile.is_admin !== true

    ) {


      await supabaseClient
        .auth
        .signOut();


      alert(

        "Access denied. Administrator privileges are required."

      );


      window.location.href =
        "index.html";


      return null;

    }



    if (

      profile.account_status &&

      profile.account_status !==
      "active"

    ) {


      await supabaseClient
        .auth
        .signOut();


      alert(

        "This administrator account is not active."

      );


      window.location.href =
        "index.html";


      return null;

    }


    currentAdmin =
      user;


    return user;


  }

  catch (error) {


    console.error(

      "Admin check error:",

      error

    );


    document.getElementById(
      "transactionList"
    ).innerHTML = `

      <div class="error-box">

        <strong>

          Administrator verification failed.

        </strong>

        <p>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </p>

      </div>

    `;


    return null;

  }

}


/* =========================================
   LOAD TRANSACTIONS
========================================= */


async function loadTransactions() {


  const list =
    document.getElementById(
      "transactionList"
    );


  list.innerHTML = `

    <div class="loading">

      Loading transactions...

    </div>

  `;


  try {


    const {

      data:
      transactions,

      error

    }

    =

    await supabaseClient

      .from(
        "transactions"
      )

      .select(

        `
          id,
          user_id,
          type,
          amount,
          status,
          description,
          reference,
          metadata,
          balance_after,
          processed_at,
          created_at
        `

      )

      .order(

        "created_at",

        {

          ascending:
            false

        }

      )

      .limit(
        500
      );



    if (error) {

      throw error;

    }


    allTransactions =
      transactions || [];


    populateFilters();


    updateStatistics();


    displayTransactions();


  }

  catch (error) {


    console.error(

      "Transaction loading error:",

      error

    );


    list.innerHTML = `

      <div class="error-box">

        <strong>

          Transactions could not be loaded.

        </strong>

        <p>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </p>

      </div>

    `;


    document.getElementById(
      "statsGrid"
    ).innerHTML = `

      <div class="error-box">

        <strong>

          Transaction statistics could not be loaded.

        </strong>

        <p>

          ${escapeHtml(
            error.message ||
            "Unknown error"
          )}

        </p>

      </div>

    `;

  }

}


/* =========================================
   POPULATE FILTERS
========================================= */


function populateFilters() {


  const typeFilter =
    document.getElementById(
      "typeFilter"
    );


  const statusFilter =
    document.getElementById(
      "statusFilter"
    );


  const currentType =
    typeFilter.value;


  const currentStatus =
    statusFilter.value;



  const types = [

    ...new Set(

      allTransactions

        .map(

          transaction =>

            String(
              transaction.type ||
              ""
            ).trim()

        )

        .filter(
          Boolean
        )

    )

  ].sort();



  const statuses = [

    ...new Set(

      allTransactions

        .map(

          transaction =>

            String(
              transaction.status ||
              ""
            ).trim()

        )

        .filter(
          Boolean
        )

    )

  ].sort();



  typeFilter.innerHTML = `

    <option value="">

      All Types

    </option>

  `;


  types.forEach(

    type => {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        type;


      option.textContent =
        type;


      typeFilter.appendChild(
        option
      );


    }

  );



  statusFilter.innerHTML = `

    <option value="">

      All Statuses

    </option>

  `;


  statuses.forEach(

    status => {


      const option =
        document.createElement(
          "option"
        );


      option.value =
        status;


      option.textContent =
        status;


      statusFilter.appendChild(
        option
      );


    }

  );



  typeFilter.value =
    currentType;


  statusFilter.value =
    currentStatus;

}


/* =========================================
   UPDATE STATISTICS
========================================= */


function updateStatistics() {


  const totalCount =
    allTransactions.length;


  const completed =
    allTransactions.filter(

      transaction =>

        String(
          transaction.status ||
          ""
        )

        .toLowerCase()

        ===

        "completed"

    );


  const pending =
    allTransactions.filter(

      transaction =>

        String(
          transaction.status ||
          ""
        )

        .toLowerCase()

        ===

        "pending"

    );


  const failed =
    allTransactions.filter(

      transaction =>

        [

          "failed",

          "rejected"

        ]

        .includes(

          String(
            transaction.status ||
            ""
          )
          .toLowerCase()

        )

    );



  const totalAmount =
    allTransactions.reduce(

      (
        total,
        transaction
      )

      =>

        total +

        Number(
          transaction.amount || 0
        ),

      0

    );



  const completedAmount =
    completed.reduce(

      (
        total,
        transaction
      )

      =>

        total +

        Number(
          transaction.amount || 0
        ),

      0

    );



  document.getElementById(
    "statsGrid"
  ).innerHTML = `


    <div class="stat-card">

      <small>

        Total Transactions

      </small>

      <strong>

        ${totalCount.toLocaleString()}

      </strong>

    </div>



    <div class="stat-card">

      <small>

        Completed

      </small>

      <strong>

        ${completed.length.toLocaleString()}

      </strong>

    </div>



    <div class="stat-card">

      <small>

        Pending

      </small>

      <strong>

        ${pending.length.toLocaleString()}

      </strong>

    </div>



    <div class="stat-card">

      <small>

        Failed / Rejected

      </small>

      <strong>

        ${failed.length.toLocaleString()}

      </strong>

    </div>



    <div class="stat-card">

      <small>

        Total Transaction Value

      </small>

      <strong class="money">

        ${formatMoney(
          totalAmount
        )}

      </strong>

    </div>



    <div class="stat-card">

      <small>

        Completed Value

      </small>

      <strong class="money">

        ${formatMoney(
          completedAmount
        )}

      </strong>

    </div>


  `;

}


/* =========================================
   GET FILTERED TRANSACTIONS
========================================= */


function getFilteredTransactions() {


  const search =
    document.getElementById(
      "searchInput"
    )

    .value

    .trim()

    .toLowerCase();


  const selectedType =
    document.getElementById(
      "typeFilter"
    ).value;


  const selectedStatus =
    document.getElementById(
      "statusFilter"
    ).value;



  return allTransactions.filter(

    transaction => {


      const type =
        String(
          transaction.type ||
          ""
        );


      const status =
        String(
          transaction.status ||
          ""
        );


      const searchableText =

        [

          transaction.description,

          transaction.reference,

          transaction.user_id,

          transaction.id,

          transaction.type,

          transaction.status

        ]

        .join(
          " "
        )

        .toLowerCase();



      const matchesSearch =

        !search ||

        searchableText.includes(
          search
        );



      const matchesType =

        !selectedType ||

        type ===
        selectedType;



      const matchesStatus =

        !selectedStatus ||

        status ===
        selectedStatus;



      return (

        matchesSearch &&

        matchesType &&

        matchesStatus

      );

    }

  );

}


/* =========================================
   DISPLAY TRANSACTIONS
========================================= */


function displayTransactions() {


  const list =
    document.getElementById(
      "transactionList"
    );


  const transactions =
    getFilteredTransactions();



  if (

    transactions.length === 0

  ) {


    list.innerHTML = `


      <div class="empty-state">


        <div class="empty-icon">

          📭

        </div>


        <h3>

          No transactions found

        </h3>


        <p>

          There are no transactions matching
          your current filters.

        </p>


      </div>


    `;


    return;

  }



  list.innerHTML =

    transactions

      .map(

        transaction =>

          createTransactionCard(
            transaction
          )

      )

      .join("");

}


/* =========================================
   GET TRANSACTION ICON
========================================= */


function getTransactionIcon(
  type
) {


  const value =
    String(
      type ||
      ""
    )
    .toLowerCase();



  if (

    value.includes(
      "withdraw"
    ) ||

    value.includes(
      "debit"
    ) ||

    value.includes(
      "payment"
    )

  ) {

    return {

      icon:
        "↓",

      className:
        "icon-debit"

    };

  }



  if (

    value.includes(
      "reward"
    ) ||

    value.includes(
      "earning"
    ) ||

    value.includes(
      "credit"
    ) ||

    value.includes(
      "bonus"
    )

  ) {

    return {

      icon:
        "↑",

      className:
        "icon-credit"

    };

  }



  return {

    icon:
      "↔",

    className:
      "icon-other"

  };

}


/* =========================================
   GET STATUS CLASS
========================================= */


function getStatusClass(
  status
) {


  const value =
    String(
      status ||
      ""
    )
    .toLowerCase();



  if (

    value ===
    "completed"

  ) {

    return "status-completed";

  }



  if (

    value ===
    "pending"

  ) {

    return "status-pending";

  }



  if (

    value ===
    "failed" ||

    value ===
    "rejected"

  ) {

    return "status-failed";

  }


  return "status-default";

}


/* =========================================
   GET AMOUNT CLASS
========================================= */


function getAmountClass(
  transaction
) {


  const type =
    String(
      transaction.type ||
      ""
    )
    .toLowerCase();



  if (

    type.includes(
      "withdraw"
    ) ||

    type.includes(
      "debit"
    ) ||

    type.includes(
      "payment"
    )

  ) {

    return "amount-negative";

  }



  if (

    type.includes(
      "reward"
    ) ||

    type.includes(
      "earning"
    ) ||

    type.includes(
      "credit"
    ) ||

    type.includes(
      "bonus"
    )

  ) {

    return "amount-positive";

  }


  return "amount-neutral";

}


/* =========================================
   CREATE TRANSACTION CARD
========================================= */


function createTransactionCard(
  transaction
) {


  const transactionIcon =
    getTransactionIcon(
      transaction.type
    );


  const statusClass =
    getStatusClass(
      transaction.status
    );


  const amountClass =
    getAmountClass(
      transaction
    );


  const description =

    transaction.description ||

    transaction.type ||

    "Transaction";



  return `


    <article
      class="transaction-card"
    >


      <div
        class="transaction-top"
      >


        <div
          class="transaction-left"
        >


          <div
            class="
              transaction-icon
              ${transactionIcon.className}
            "
          >

            ${transactionIcon.icon}

          </div>



          <div
            class="transaction-title"
          >


            <h3>

              ${escapeHtml(
                description
              )}

            </h3>


            <p>

              ${formatDate(
                transaction.created_at
              )}

            </p>


          </div>


        </div>



        <div
          class="transaction-right"
        >


          <div
            class="
              transaction-amount
              ${amountClass}
            "
          >

            ${formatMoney(
              transaction.amount
            )}

          </div>



          <div
            class="badges"
          >


            <span
              class="
                badge
                type-badge
              "
            >

              ${escapeHtml(
                transaction.type ||
                "unknown"
              )}

            </span>



            <span
              class="
                badge
                ${statusClass}
              "
            >

              ${escapeHtml(
                transaction.status ||
                "unknown"
              )}

            </span>


          </div>


        </div>


      </div>



      <div
        class="transaction-details"
      >


        <div
          class="detail"
        >

          <small>

            Reference

          </small>


          <strong>

            ${escapeHtml(
              transaction.reference
            )}

          </strong>

        </div>



        <div
          class="detail"
        >

          <small>

            User ID

          </small>


          <strong>

            ${escapeHtml(
              transaction.user_id
            )}

          </strong>

        </div>



        <div
          class="detail"
        >

          <small>

            Balance After

          </small>


          <strong>

            ${

              transaction.balance_after === null ||

              transaction.balance_after === undefined

              ?

              "—"

              :

              formatMoney(
                transaction.balance_after
              )

            }

          </strong>

        </div>



        <div
          class="detail"
        >

          <small>

            Processed

          </small>


          <strong>

            ${formatDate(
              transaction.processed_at
            )}

          </strong>

        </div>


      </div>



      <button

        type="button"

        class="view-details-btn"

        onclick="
          openTransactionDetails(
            '${transaction.id}'
          )
        "

      >

        View Full Details

      </button>


    </article>


  `;

}


/* =========================================
   OPEN TRANSACTION DETAILS
========================================= */


function openTransactionDetails(
  transactionId
) {


  const transaction =
    allTransactions.find(

      item =>

        String(item.id) ===
        String(transactionId)

    );


  if (!transaction) {

    return;

  }


  let metadata =
    "—";


  if (

    transaction.metadata !== null &&

    transaction.metadata !== undefined

  ) {


    try {


      metadata =

        typeof transaction.metadata ===
        "string"

        ?

        transaction.metadata

        :

        JSON.stringify(

          transaction.metadata,

          null,

          2

        );


    }

    catch (error) {


      metadata =
        String(
          transaction.metadata
        );

    }

  }



  document.getElementById(
    "modalDetails"
  ).innerHTML = `


    <div class="modal-detail">

      <small>

        Transaction ID

      </small>

      <strong>

        ${escapeHtml(
          transaction.id
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        User ID

      </small>

      <strong>

        ${escapeHtml(
          transaction.user_id
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Type

      </small>

      <strong>

        ${escapeHtml(
          transaction.type
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Status

      </small>

      <strong>

        ${escapeHtml(
          transaction.status
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Amount

      </small>

      <strong>

        ${formatMoney(
          transaction.amount
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Description

      </small>

      <strong>

        ${escapeHtml(
          transaction.description
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Reference

      </small>

      <strong>

        ${escapeHtml(
          transaction.reference
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Balance After

      </small>

      <strong>

        ${

          transaction.balance_after === null ||

          transaction.balance_after === undefined

          ?

          "—"

          :

          formatMoney(
            transaction.balance_after
          )

        }

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Created At

      </small>

      <strong>

        ${formatDate(
          transaction.created_at
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Processed At

      </small>

      <strong>

        ${formatDate(
          transaction.processed_at
        )}

      </strong>

    </div>



    <div class="modal-detail">

      <small>

        Metadata

      </small>

      <strong
        style="
          white-space:pre-wrap;
          font-family:monospace;
        "
      >

        ${escapeHtml(
          metadata
        )}

      </strong>

    </div>


  `;


  document.getElementById(
    "transactionModal"
  ).classList.add(
    "active"
  );

}


/* =========================================
   CLOSE TRANSACTION MODAL
========================================= */


function closeTransactionModal() {


  document.getElementById(
    "transactionModal"
  ).classList.remove(
    "active"
  );

}


/* =========================================
   SEARCH
========================================= */


document.getElementById(
  "searchInput"
)

.addEventListener(

  "input",

  function() {

    displayTransactions();

  }

);


/* =========================================
   TYPE FILTER
========================================= */


document.getElementById(
  "typeFilter"
)

.addEventListener(

  "change",

  function() {

    displayTransactions();

  }

);


/* =========================================
   STATUS FILTER
========================================= */


document.getElementById(
  "statusFilter"
)

.addEventListener(

  "change",

  function() {

    displayTransactions();

  }

);


/* =========================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
========================================= */


document.getElementById(
  "transactionModal"
)

.addEventListener(

  "click",

  function(event) {


    if (

      event.target ===
      this

    ) {

      closeTransactionModal();

    }

  }

);


/* =========================================
   START APPLICATION
========================================= */


(async function() {


  const admin =
    await checkAdmin();


  if (!admin) {

    return;

  }


  await loadTransactions();


})();


</script>
