<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Users - Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        /* ================================
           HEADER
        ================================= */

        .header {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 18px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 24px;
        }

        .back-btn {
            text-decoration: none;
            background: #111827;
            color: white;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
        }

        /* ================================
           CONTAINER
        ================================= */

        .container {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* ================================
           TOP SECTION
        ================================= */

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 15px;
        }

        /* ================================
           STATS
        ================================= */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 18px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e8e8e8;
        }

        .stat-card h3 {
            color: #777;
            font-size: 14px;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 28px;
            font-weight: bold;
        }

        /* ================================
           TABLE
        ================================= */

        .table-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #e8e8e8;
            overflow: hidden;
        }

        .table-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .table-header h2 {
            font-size: 18px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fafafa;
            color: #666;
            font-size: 13px;
            text-align: left;
            padding: 15px;
        }

        td {
            padding: 16px 15px;
            border-top: 1px solid #eee;
            font-size: 14px;
        }

        tr:hover {
            background: #fafafa;
        }

        .user-name {
            font-weight: bold;
            cursor: pointer;
        }

        .user-name:hover {
            text-decoration: underline;
        }

        /* ================================
           BADGES
        ================================= */

        .badge {
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }

        .active {
            background: #dcfce7;
            color: #15803d;
        }

        .inactive {
            background: #fee2e2;
            color: #b91c1c;
        }

        .unknown {
            background: #f3f4f6;
            color: #555;
        }

        /* ================================
           BUTTON
        ================================= */

        .view-btn {
            border: none;
            background: #111827;
            color: white;

            padding: 9px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-size: 13px;
        }

        .view-btn:hover {
            opacity: 0.85;
        }

        /* ================================
           LOADING
        ================================= */

        .loading {
            padding: 40px;
            text-align: center;
            color: #777;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: #777;
        }

        .error {
            padding: 20px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .container {
                padding: 0 12px;
                margin-top: 20px;
            }

            th,
            td {
                padding: 12px;
            }

        }

    </style>

</head>

<body>


<!-- =====================================
     HEADER
===================================== -->

<div class="header">

    <h1>Manage Users</h1>

    <a href="admin.html"
       class="back-btn">

        ← Admin Dashboard

    </a>

</div>


<!-- =====================================
     MAIN CONTAINER
===================================== -->

<div class="container">


    <!-- ERROR MESSAGE -->

    <div id="errorBox"
         class="error">

    </div>


    <!-- =====================================
         STATISTICS
    ===================================== -->

    <div class="stats">

        <div class="stat-card">

            <h3>Total Users</h3>

            <div id="totalUsers"
                 class="number">

                0

            </div>

        </div>


        <div class="stat-card">

            <h3>Active Users</h3>

            <div id="activeUsers"
                 class="number">

                0

            </div>

        </div>


        <div class="stat-card">

            <h3>Users With Wallets</h3>

            <div id="walletUsers"
                 class="number">

                0

            </div>

        </div>


    </div>


    <!-- =====================================
         SEARCH
    ===================================== -->

    <div class="top-section">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search by name or email..."
            >

        </div>

    </div>


    <!-- =====================================
         USERS TABLE
    ===================================== -->

    <div class="table-card">


        <div class="table-header">

            <h2>Registered Users</h2>

        </div>


        <div class="table-wrapper">


            <table>


                <thead>

                    <tr>

                        <th>User</th>

                        <th>Email</th>

                        <th>Joined</th>

                        <th>Wallet</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="usersTableBody">

                    <tr>

                        <td colspan="6"
                            class="loading">

                            Loading users...

                        </td>

                    </tr>

                </tbody>


            </table>


        </div>


    </div>


</div>



<!-- =====================================
     JAVASCRIPT
===================================== -->

<script>


/* =========================================
   SUPABASE CONFIGURATION

   IMPORTANT:

   Replace these TWO values with the SAME
   Supabase URL and ANON KEY used in your
   existing EarnGig files.
========================================= */


const SUPABASE_URL = "YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
    supabase.createClient(

        SUPABASE_URL,

        SUPABASE_ANON_KEY

    );


/* =========================================
   GLOBAL VARIABLES
========================================= */


let allUsers = [];


/* =========================================
   GET USER DISPLAY NAME
========================================= */


function getUserName(user) {


    if (!user) {

        return "Unknown User";

    }


    return (

        user.full_name ||

        user.name ||

        user.username ||

        user.display_name ||

        user.email ||

        "Unknown User"

    );

}


/* =========================================
   FORMAT DATE
========================================= */


function formatDate(date) {


    if (!date) {

        return "—";

    }


    try {

        return new Date(date)
            .toLocaleDateString(

                "en-NG",

                {

                    year: "numeric",

                    month: "short",

                    day: "numeric"

                }

            );

    }

    catch (error) {

        return "—";

    }

}


/* =========================================
   FORMAT NAIRA
========================================= */


function formatMoney(amount) {


    const value = Number(amount || 0);


    return new Intl.NumberFormat(

        "en-NG",

        {

            style: "currency",

            currency: "NGN",

            minimumFractionDigits: 0,

            maximumFractionDigits: 2

        }

    ).format(value);

}


/* =========================================
   SHOW ERROR
========================================= */


function showError(message) {


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.textContent =
        message;


    errorBox.style.display =
        "block";

}


/* =========================================
   HIDE ERROR
========================================= */


function hideError() {


    document
        .getElementById(
            "errorBox"
        )
        .style.display =
        "none";

}


/* =========================================
   LOAD USERS

   This tries to load users from
   the profiles table.
========================================= */


async function loadUsers() {


    hideError();


    const tableBody =
        document.getElementById(
            "usersTableBody"
        );


    tableBody.innerHTML = `

        <tr>

            <td colspan="6"
                class="loading">

                Loading users...

            </td>

        </tr>

    `;


    try {


        /* =====================================
           LOAD USERS FROM PROFILES
        ===================================== */


        const {

            data: users,

            error: usersError

        }

        =

        await supabaseClient

            .from("profiles")

            .select("*")

            .order(

                "created_at",

                {

                    ascending: false

                }

            );


        if (usersError) {


            throw usersError;

        }


        allUsers =
            users || [];


        /* =====================================
           LOAD WALLETS
        ===================================== */


        const {

            data: wallets,

            error: walletsError

        }

        =

        await supabaseClient

            .from("wallets")

            .select("*");


        if (walletsError) {


            console.log(
                "Wallet error:",
                walletsError
            );

        }


        const walletMap =
            new Map();


        (wallets || [])
            .forEach(

                wallet => {


                    if (

                        wallet.user_id

                    ) {


                        walletMap.set(

                            wallet.user_id,

                            wallet

                        );

                    }

                }

            );


        /* =====================================
           ATTACH WALLET TO USER
        ===================================== */


        allUsers =
            allUsers.map(

                user => {


                    return {

                        ...user,

                        wallet:

                            walletMap.get(
                                user.id
                            )

                            ||

                            null

                    };

                }

            );


        /* =====================================
           UPDATE STATISTICS
        ===================================== */


        updateStatistics();


        /* =====================================
           DISPLAY USERS
        ===================================== */


        displayUsers(
            allUsers
        );


    }


    catch (error) {


        console.error(
            error
        );


        showError(

            "Unable to load users: " +

            error.message

        );


        tableBody.innerHTML = `

            <tr>

                <td colspan="6"
                    class="empty">

                    Unable to load users.

                </td>

            </tr>

        `;


    }


}


/* =========================================
   UPDATE STATISTICS
========================================= */


function updateStatistics() {


    const total =
        allUsers.length;


    const active =
        allUsers.filter(

            user => {


                if (

                    user.status === "inactive"

                ) {

                    return false;

                }


                return true;

            }

        ).length;


    const withWallet =
        allUsers.filter(

            user =>

                user.wallet

        ).length;


    document
        .getElementById(
            "totalUsers"
        )
        .textContent =
        total;


    document
        .getElementById(
            "activeUsers"
        )
        .textContent =
        active;


    document
        .getElementById(
            "walletUsers"
        )
        .textContent =
        withWallet;


}


/* =========================================
   DISPLAY USERS
========================================= */


function displayUsers(users) {


    const tableBody =
        document.getElementById(
            "usersTableBody"
        );


    /* =====================================
       NO USERS
    ===================================== */


    if (

        !users ||

        users.length === 0

    ) {


        tableBody.innerHTML = `

            <tr>

                <td colspan="6"
                    class="empty">

                    No users found.

                </td>

            </tr>

        `;


        return;

    }


    tableBody.innerHTML = "";


    /* =====================================
       CREATE USER ROWS
    ===================================== */


    users.forEach(

        user => {


            const row =
                document.createElement(
                    "tr"
                );


            const userName =
                getUserName(
                    user
                );


            const email =

                user.email

                ||

                "—";


            const joined =

                formatDate(

                    user.created_at

                );


            const walletBalance =

                user.wallet

                    ?

                    formatMoney(

                        user.wallet.balance

                    )

                    :

                    "No wallet";


            let statusText =
                "Active";


            let statusClass =
                "active";


            if (

                user.status ===
                "inactive"

            ) {


                statusText =
                    "Inactive";


                statusClass =
                    "inactive";


            }


            row.innerHTML = `


                <td>

                    <span

                        class="user-name"

                        data-user-id="${user.id}"

                    >

                        ${escapeHtml(
                            userName
                        )}

                    </span>

                </td>


                <td>

                    ${escapeHtml(
                        email
                    )}

                </td>


                <td>

                    ${joined}

                </td>


                <td>

                    ${walletBalance}

                </td>


                <td>

                    <span

                        class="badge ${statusClass}"

                    >

                        ${statusText}

                    </span>

                </td>


                <td>

                    <button

                        class="view-btn"

                        data-user-id="${user.id}"

                    >

                        View User

                    </button>

                </td>


            `;


            tableBody
                .appendChild(
                    row
                );


        }

    );


    /* =====================================
       CLICK USER NAME
    ===================================== */


    document
        .querySelectorAll(
            ".user-name"
        )
        .forEach(

            element => {


                element.addEventListener(

                    "click",

                    function () {


                        openUser(

                            this.dataset.userId

                        );


                    }

                );


            }

        );


    /* =====================================
       CLICK VIEW BUTTON
    ===================================== */


    document
        .querySelectorAll(
            ".view-btn"
        )
        .forEach(

            button => {


                button.addEventListener(

                    "click",

                    function () {


                        openUser(

                            this.dataset.userId

                        );


                    }

                );


            }

        );


}


/* =========================================
   OPEN USER DETAILS
========================================= */


function openUser(userId) {


    window.location.href =

        "admin-user-details.html?id="

        +

        encodeURIComponent(
            userId
        );


}


/* =========================================
   SEARCH USERS
========================================= */


document
    .getElementById(
        "searchInput"
    )
    .addEventListener(

        "input",

        function () {


            const search =
                this.value
                    .toLowerCase()
                    .trim();


            const filtered =
                allUsers.filter(

                    user => {


                        const name =
                            getUserName(
                                user
                            )
                            .toLowerCase();


                        const email =
                            (
                                user.email ||

                                ""
                            )
                            .toLowerCase();


                        return (

                            name.includes(
                                search
                            )

                            ||

                            email.includes(
                                search
                            )

                        );


                    }

                );


            displayUsers(
                filtered
            );


        }

    );


/* =========================================
   ESCAPE HTML
========================================= */


function escapeHtml(value) {


    if (

        value === null ||

        value === undefined

    ) {

        return "—";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );


}


/* =========================================
   START
========================================= */


loadUsers();


</script>


</body>

</html>
