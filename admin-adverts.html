<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Advert Management | EarnGig Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5fa;
      color: #17172b;
    }

    .page {
      max-width: 1250px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
      color: #7c3aed;
    }

    .back-btn {
      text-decoration: none;
      padding: 11px 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: white;
      color: #292943;
      font-weight: 600;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 26px;
      color: #73738a;
      line-height: 1.5;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat {
      background: white;
      border: 1px solid #e5e5ed;
      border-radius: 15px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(20, 20, 50, 0.04);
    }

    .stat-label {
      color: #77778b;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: 800;
    }

    /* FILTERS */

    .filter-box {
      background: white;
      border: 1px solid #e5e5ed;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .filter-btn {
      border: 1px solid #dddde7;
      background: #fff;
      color: #45455c;
      border-radius: 9px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .filter-btn.active {
      background: #7c3aed;
      color: white;
      border-color: #7c3aed;
    }

    /* LIST */

    .campaign-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .campaign-row {
      display: grid;
      grid-template-columns:
        minmax(180px, 1.5fr)
        minmax(130px, 1fr)
        120px
        125px
        75px;

      align-items: center;
      gap: 16px;

      background: white;
      border: 1px solid #e4e4ec;
      border-radius: 11px;

      padding: 12px 15px;

      text-decoration: none;
      color: inherit;

      transition:
        transform 0.15s ease,
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .campaign-row:hover {
      transform: translateY(-1px);
      border-color: #9b6cff;
      box-shadow: 0 5px 16px rgba(60, 30, 120, 0.08);
    }

    .campaign-main {
      min-width: 0;
    }

    .campaign-name {
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .campaign-id {
      margin-top: 3px;
      color: #9999aa;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .advertiser {
      min-width: 0;
    }

    .advertiser-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .advertiser-id {
      margin-top: 3px;
      color: #9999aa;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .placement {
      color: #55556b;
      font-size: 13px;
    }

    .amount {
      font-weight: 800;
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: 120px;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .status.pending {
      background: #fff3cd;
      color: #8a6500;
    }

    .status.revision {
      background: #fff0d6;
      color: #a05b00;
    }

    .status.approved {
      background: #dcfce7;
      color: #166534;
    }

    .status.paid {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .status.active {
      background: #dcfce7;
      color: #166534;
    }

    .status.rejected {
      background: #fee2e2;
      color: #b91c1c;
    }

    .view {
      text-align: right;
      color: #7c3aed;
      font-weight: 800;
      font-size: 13px;
    }

    /* MOBILE */

    @media (max-width: 850px) {

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .campaign-row {
        grid-template-columns: minmax(150px, 1fr) auto auto;
        gap: 10px;
        padding: 12px;
      }

      .advertiser,
      .placement {
        display: none;
      }

      .view {
        text-align: right;
      }
    }

    @media (max-width: 520px) {

      .page {
        padding: 20px 12px 50px;
      }

      .topbar {
        margin-bottom: 20px;
      }

      .brand {
        font-size: 22px;
      }

      h1 {
        font-size: 25px;
      }

      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat {
        padding: 13px;
      }

      .stat-value {
        font-size: 22px;
      }

      .campaign-row {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .status {
        display: none;
      }

      .amount {
        text-align: right;
      }
    }

    .empty {
      background: white;
      border: 1px solid #e5e5ed;
      border-radius: 14px;
      padding: 45px 20px;
      text-align: center;
      color: #77778b;
    }

    .loading {
      background: white;
      border: 1px solid #e5e5ed;
      border-radius: 14px;
      padding: 35px;
      text-align: center;
      color: #77778b;
    }

    .error {
      background: #fff1f2;
      color: #b91c1c;
      border: 1px solid #fecdd3;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

<div class="page">

  <div class="topbar">

    <div class="brand">
      EarnGig Admin
    </div>

    <a
      href="admin-dashboard.html"
      class="back-btn"
    >
      ← Dashboard
    </a>

  </div>


  <h1>
    Advert Management
  </h1>

  <p class="subtitle">
    Review advertiser submissions, approve campaigns,
    request changes or reject campaigns before payment
    and publication.
  </p>


  <div
    id="error-box"
    class="error"
    style="display:none;"
  ></div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <div class="stat-label">
        Total Campaigns
      </div>

      <div
        id="total-count"
        class="stat-value"
      >
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-label">
        Pending Review
      </div>

      <div
        id="pending-count"
        class="stat-value"
      >
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-label">
        Changes Requested
      </div>

      <div
        id="revision-count"
        class="stat-value"
      >
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-label">
        Awaiting Payment
      </div>

      <div
        id="payment-count"
        class="stat-value"
      >
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-label">
        Active
      </div>

      <div
        id="active-count"
        class="stat-value"
      >
        0
      </div>
    </div>

  </div>


  <!-- FILTERS -->

  <div class="filter-box">

    <button
      class="filter-btn active"
      data-filter="all"
    >
      All
    </button>

    <button
      class="filter-btn"
      data-filter="pending_review"
    >
      Pending Review
    </button>

    <button
      class="filter-btn"
      data-filter="revision_required"
    >
      Changes Requested
    </button>

    <button
      class="filter-btn"
      data-filter="approved_payment_required"
    >
      Awaiting Payment
    </button>

    <button
      class="filter-btn"
      data-filter="paid"
    >
      Paid
    </button>

    <button
      class="filter-btn"
      data-filter="active"
    >
      Active
    </button>

    <button
      class="filter-btn"
      data-filter="rejected"
    >
      Rejected
    </button>

  </div>


  <!-- CAMPAIGNS -->

  <div
    id="campaign-list"
    class="campaign-list"
  >

    <div class="loading">
      Loading adverts...
    </div>

  </div>

</div>


<script>

let allCampaigns = [];

let currentFilter = "all";

let profileMap = {};



function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}



function formatNaira(amount) {

  return "₦" +
    Number(amount || 0)
      .toLocaleString("en-NG");

}



function getStatus(campaign) {

  return (
    campaign.status ||
    campaign.approval_status ||
    ""
  ).toLowerCase();

}



function getStatusLabel(status) {

  const labels = {

    pending_review:
      "Pending Review",

    revision_required:
      "Changes Requested",

    approved_payment_required:
      "Awaiting Payment",

    paid:
      "Paid",

    active:
      "Active",

    rejected:
      "Rejected"

  };

  return labels[status] || status || "Unknown";

}



function getStatusClass(status) {

  if (
    status === "pending_review"
  ) {

    return "pending";

  }

  if (
    status === "revision_required"
  ) {

    return "revision";

  }

  if (
    status === "approved_payment_required"
  ) {

    return "approved";

  }

  if (
    status === "paid"
  ) {

    return "paid";

  }

  if (
    status === "active"
  ) {

    return "active";

  }

  if (
    status === "rejected"
  ) {

    return "rejected";

  }

  return "pending";

}



function getPlacementLabel(value) {

  if (!value) {
    return "—";
  }

  const parts =
    String(value)
      .split(",");

  const labels = [];

  if (
    parts.includes(
      "watch_and_earn"
    )
  ) {

    labels.push(
      "EarnGig"
    );

  }

  if (
    parts.includes(
      "tiktok"
    )
  ) {

    labels.push(
      "TikTok"
    );

  }

  return labels.join(" + ") || value;

}



function getAdvertiserName(
  campaign
) {

  const profile =
    profileMap[
      campaign.brand_id
    ];

  if (!profile) {

    return campaign.brand_id
      ? String(
          campaign.brand_id
        ).slice(0, 8) + "..."
      : "Unknown";

  }

  return (
    profile.name ||
    profile.full_name ||
    profile.display_name ||
    profile.username ||
    profile.user_name ||
    (
      [
        profile.first_name,
        profile.last_name
      ]
      .filter(Boolean)
      .join(" ")
    ) ||
    String(
      campaign.brand_id
    ).slice(0, 8) + "..."
  );

}



async function verifyAdmin() {

  const {
    data: {
      user
    },
    error
  } =
    await supabaseClient.auth.getUser();

  if (
    error ||
    !user
  ) {

    window.location.href =
      "login.html";

    return null;

  }


  const {
    data: profile,
    error: profileError
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,is_admin,account_status"
      )
      .eq(
        "id",
        user.id
      )
      .maybeSingle();


  if (
    profileError ||
    !profile ||
    !profile.is_admin ||
    profile.account_status !== "active"
  ) {

    alert(
      "Administrator privileges are required."
    );

    window.location.href =
      "dashboard.html";

    return null;

  }

  return user;

}



async function loadProfiles(
  campaigns
) {

  const ids = [
    ...new Set(
      campaigns
        .map(
          item => item.brand_id
        )
        .filter(Boolean)
    )
  ];

  if (!ids.length) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select("*")
      .in(
        "id",
        ids
      );


  if (error) {

    console.warn(
      "Could not load advertiser profiles:",
      error
    );

    return;

  }


  profileMap = {};

  (data || []).forEach(
    profile => {

      profileMap[
        profile.id
      ] = profile;

    }
  );

}



async function loadCampaigns() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("brand_ad_campaigns")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    throw new Error(
      "Unable to load adverts: " +
      error.message
    );

  }


  allCampaigns =
    data || [];


  await loadProfiles(
    allCampaigns
  );


  updateStats();

  renderCampaigns();

}



function updateStats() {

  const pending =
    allCampaigns.filter(
      item =>
        getStatus(item) ===
        "pending_review"
    ).length;


  const revision =
    allCampaigns.filter(
      item =>
        getStatus(item) ===
        "revision_required"
    ).length;


  const payment =
    allCampaigns.filter(
      item =>
        getStatus(item) ===
        "approved_payment_required"
    ).length;


  const active =
    allCampaigns.filter(
      item =>
        getStatus(item) ===
        "active"
    ).length;


  document.getElementById(
    "total-count"
  ).textContent =
    allCampaigns.length;


  document.getElementById(
    "pending-count"
  ).textContent =
    pending;


  document.getElementById(
    "revision-count"
  ).textContent =
    revision;


  document.getElementById(
    "payment-count"
  ).textContent =
    payment;


  document.getElementById(
    "active-count"
  ).textContent =
    active;

}



function renderCampaigns() {

  const container =
    document.getElementById(
      "campaign-list"
    );


  let campaigns =
    allCampaigns;


  if (
    currentFilter !==
    "all"
  ) {

    campaigns =
      campaigns.filter(
        campaign =>
          getStatus(campaign) ===
          currentFilter
      );

  }


  if (!campaigns.length) {

    container.innerHTML = `
      <div class="empty">
        No adverts found in this section.
      </div>
    `;

    return;

  }


  container.innerHTML =
    campaigns
      .map(
        campaign => {

          const status =
            getStatus(
              campaign
            );

          const advertiser =
            getAdvertiserName(
              campaign
            );

          const campaignName =
            campaign.campaign_name ||
            campaign.ad_title ||
            "Untitled Campaign";


          return `
            <a
              class="campaign-row"
              href="admin-advert-detail.html?id=${encodeURIComponent(campaign.id)}"
            >

              <div class="campaign-main">

                <div class="campaign-name">
                  ${escapeHtml(campaignName)}
                </div>

                <div class="campaign-id">
                  ${escapeHtml(campaign.id)}
                </div>

              </div>


              <div class="advertiser">

                <div class="advertiser-name">
                  ${escapeHtml(advertiser)}
                </div>

                <div class="advertiser-id">
                  Advertiser
                </div>

              </div>


              <div class="placement">
                ${escapeHtml(
                  getPlacementLabel(
                    campaign.placement
                  )
                )}
              </div>


              <div>

                <span
                  class="status ${getStatusClass(status)}"
                >
                  ${escapeHtml(
                    getStatusLabel(status)
                  )}
                </span>

              </div>


              <div class="amount">
                ${formatNaira(
                  campaign.campaign_budget
                )}
              </div>


              <div class="view">
                View →
              </div>

            </a>
          `;

        }
      )
      .join("");

}



document
  .querySelectorAll(
    ".filter-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".filter-btn"
            )
            .forEach(
              item =>
                item.classList.remove(
                  "active"
                )
            );


          button.classList.add(
            "active"
          );


          currentFilter =
            button.dataset.filter;


          renderCampaigns();

        }
      );

    }
  );



async function initialise() {

  try {

    const admin =
      await verifyAdmin();

    if (!admin) {
      return;
    }


    await loadCampaigns();

  } catch (error) {

    console.error(
      error
    );


    const errorBox =
      document.getElementById(
        "error-box"
      );


    errorBox.textContent =
      error.message ||
      "Unable to load adverts.";


    errorBox.style.display =
      "block";


    document.getElementById(
      "campaign-list"
    ).innerHTML = "";

  }

}



initialise();

</script>

</body>
</html>
