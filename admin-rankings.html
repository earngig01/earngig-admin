<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rankings | EarnGig Admin</title>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background:
        #070817;

      color:
        #ffffff;

    }


    /* ========================================
       HEADER
    ======================================== */

    header {

      background:
        #0d1038;

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

    }


    .nav {

      max-width:
        1200px;

      margin:
        auto;

      padding:
        16px 20px;

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      gap:
        15px;

    }


    .brand {

      color:
        white;

      text-decoration:
        none;

      font-size:
        22px;

      font-weight:
        700;

    }


    .brand span {

      color:
        #7c5cff;

    }


    .back-btn {

      border:
        1px solid
        rgba(255,255,255,.12);

      background:
        rgba(255,255,255,.04);

      color:
        #ffffff;

      padding:
        9px 14px;

      border-radius:
        9px;

      text-decoration:
        none;

      font-size:
        13px;

    }


    .back-btn:hover {

      background:
        rgba(255,255,255,.08);

    }



    /* ========================================
       MAIN
    ======================================== */

    main {

      max-width:
        1200px;

      margin:
        auto;

      padding:
        30px 20px 60px;

    }


    .page-title {

      margin-bottom:
        22px;

    }


    .page-title h1 {

      margin:
        0 0 7px;

      font-size:
        30px;

    }


    .page-title p {

      margin:
        0;

      color:
        #8d90aa;

      font-size:
        14px;

    }



    /* ========================================
       CONTROL PANEL
    ======================================== */

    .controls {

      background:
        #101331;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:
        14px;

      padding:
        18px;

      margin-bottom:
        18px;

    }


    .controls-grid {

      display:
        grid;

      grid-template-columns:
        1fr
        1fr;

      gap:
        14px;

    }


    .field label {

      display:
        block;

      margin-bottom:
        7px;

      color:
        #aeb1c8;

      font-size:
        12px;

      font-weight:
        700;

    }


    select {

      width:
        100%;

      background:
        #080a1b;

      color:
        white;

      border:
        1px solid
        #292d54;

      border-radius:
        9px;

      padding:
        12px;

      outline:
        none;

    }


    select:focus {

      border-color:
        #6d4aff;

    }


    .refresh-btn {

      width:
        100%;

      height:
        43px;

      border:
        0;

      border-radius:
        9px;

      background:
        #6d4aff;

      color:
        white;

      font-weight:
        700;

      cursor:
        pointer;

      margin-top:
        19px;

    }


    .refresh-btn:hover {

      opacity:
        .9;

    }



    /* ========================================
       RESULTS
    ======================================== */

    .results {

      background:
        #101331;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:
        14px;

      overflow:
        hidden;

    }


    .results-header {

      padding:
        17px 18px;

      border-bottom:
        1px solid
        rgba(255,255,255,.08);

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        10px;

    }


    .results-header h2 {

      margin:
        0;

      font-size:
        18px;

    }


    .period-label {

      color:
        #8d90aa;

      font-size:
        12px;

    }


    .loading {

      padding:
        45px 20px;

      text-align:
        center;

      color:
        #8d90aa;

    }


    .error {

      margin:
        18px;

      padding:
        16px;

      background:
        rgba(255,70,70,.08);

      border:
        1px solid
        rgba(255,70,70,.25);

      border-radius:
        10px;

      color:
        #ffb2b2;

      line-height:
        1.5;

    }



    /* ========================================
       TABLE
    ======================================== */

    .table-wrap {

      overflow-x:
        auto;

    }


    table {

      width:
        100%;

      border-collapse:
        collapse;

      min-width:
        650px;

    }


    th {

      text-align:
        left;

      padding:
        13px 15px;

      background:
        #0c0f29;

      color:
        #8d90aa;

      font-size:
        11px;

      text-transform:
        uppercase;

      letter-spacing:
        .04em;

    }


    td {

      padding:
        14px 15px;

      border-top:
        1px solid
        rgba(255,255,255,.06);

      font-size:
        14px;

    }


    tbody tr:hover {

      background:
        rgba(255,255,255,.025);

    }


    .rank {

      width:
        65px;

      font-weight:
        700;

    }


    .top-rank {

      color:
        #c4a7ff;

    }


    .name {

      font-weight:
        700;

    }


    .user-id {

      color:
        #777b99;

      font-size:
        11px;

      word-break:
        break-all;

    }


    .amount {

      font-weight:
        700;

      color:
        #ffffff;

    }


    .empty {

      padding:
        45px 20px;

      text-align:
        center;

      color:
        #8d90aa;

    }



    /* ========================================
       MOBILE
    ======================================== */

    @media (
      max-width: 650px
    ) {


      main {

        padding:
          24px 14px 45px;

      }


      .nav {

        padding:
          14px;

      }


      .page-title h1 {

        font-size:
          26px;

      }


      .controls-grid {

        grid-template-columns:
          1fr;

      }


      .refresh-btn {

        margin-top:
          0;

      }


    }

  </style>

</head>



<body>


<header>

  <div class="nav">

    <a
      href="admin-dashboard.html"
      class="brand"
    >
      Earn<span>Gig</span>
    </a>


    <a
      href="admin-dashboard.html"
      class="back-btn"
    >
      ← Dashboard
    </a>

  </div>

</header>



<main>


  <section class="page-title">

    <h1>
      Rankings
    </h1>

    <p>
      Member performance rankings and award periods
    </p>

  </section>



  <section class="controls">


    <div class="controls-grid">


      <div class="field">

        <label for="period">
          Period
        </label>

        <select id="period">

          <option value="this_month">
            This Month
          </option>

          <option value="previous_month">
            Previous Month
          </option>

          <option value="all_time">
            All Time
          </option>

        </select>

      </div>


      <div>

        <button
          type="button"
          class="refresh-btn"
          id="refreshButton"
        >
          Refresh Rankings
        </button>

      </div>


    </div>


  </section>



  <section class="results">


    <div class="results-header">

      <h2 id="rankingTitle">
        Referrals
      </h2>

      <span
        class="period-label"
        id="periodLabel"
      >
        This Month
      </span>

    </div>


    <div id="rankingContent">

      <div class="loading">
        Loading rankings...
      </div>

    </div>


  </section>


</main>



<script>


/* ========================================
   ADMIN SECURITY CHECK
   SAME LOGIC AS WORKING DASHBOARD
======================================== */

async function checkAdmin() {


  const {

    data: {
      user
    },

    error

  } =
  await supabaseClient
    .auth
    .getUser();



  /*
   * USER NOT LOGGED IN
   */

  if (
    error ||
    !user
  ) {

    window.location.href =
      "index.html";

    return null;

  }



  /*
   * LOAD ADMIN PROFILE
   */

  const {

    data: profile,

    error: profileError

  } =
  await supabaseClient

    .from("profiles")

    .select(`

      full_name,
      is_admin,
      account_status

    `)

    .eq(
      "id",
      user.id
    )

    .single();



  /*
   * CHECK ADMIN ACCESS
   */

  if (

    profileError ||

    !profile ||

    profile.is_admin !== true

  ) {

    console.error(
      "Rankings admin profile error:",
      profileError
    );

    await supabaseClient
      .auth
      .signOut();

    alert(
      "Access denied. Administrator privileges are required."
    );

    window.location.href =
      "index.html";

    return null;

  }



  /*
   * CHECK ACCOUNT STATUS
   */

  if (

    profile.account_status &&

    profile.account_status !==
    "active"

  ) {

    await supabaseClient
      .auth
      .signOut();

    alert(
      "This administrator account is not active."
    );

    window.location.href =
      "index.html";

    return null;

  }



  return user;

}



/* ========================================
   PERIOD HELPERS
======================================== */

function getPeriodDates() {


  const selected =
    document.getElementById(
      "period"
    ).value;


  const now =
    new Date();


  let start;
  let end;


  /*
   * THIS MONTH
   */

  if (
    selected ===
    "this_month"
  ) {

    start =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        1
      );

    end =
      new Date(
        now.getFullYear(),
        now.getMonth() + 1,
        1
      );

  }


  /*
   * PREVIOUS MONTH
   */

  else if (
    selected ===
    "previous_month"
  ) {

    start =
      new Date(
        now.getFullYear(),
        now.getMonth() - 1,
        1
      );

    end =
      new Date(
        now.getFullYear(),
        now.getMonth(),
        1
      );

  }


  /*
   * ALL TIME
   */

  else {

    start = null;
    end = null;

  }


  return {
    start,
    end
  };

}



/* ========================================
   PERIOD LABEL
======================================== */

function updatePeriodLabel() {


  const selected =
    document.getElementById(
      "period"
    ).value;


  const label =
    document.getElementById(
      "periodLabel"
    );


  if (
    selected ===
    "this_month"
  ) {

    label.textContent =
      "This Month";

  }

  else if (
    selected ===
    "previous_month"
  ) {

    label.textContent =
      "Previous Month";

  }

  else {

    label.textContent =
      "All Time";

  }

}



/* ========================================
   LOAD REFERRAL RANKINGS
======================================== */

async function loadRankings() {


  const content =
    document.getElementById(
      "rankingContent"
    );


  content.innerHTML = `

    <div class="loading">
      Loading rankings...
    </div>

  `;


  updatePeriodLabel();


  const {
    start,
    end
  } =
  getPeriodDates();



  try {


    /*
     * IMPORTANT:
     *
     * Referrals are recorded in
     * referral_bonus_ledger.
     *
     * We count DISTINCT referred users,
     * not ledger rows.
     */


    let query =
      supabaseClient

        .from(
          "referral_bonus_ledger"
        )

        .select(
          `
            referrer_user_id,
            referred_user_id,
            created_at,
            bonus_amount
          `
        );



    /*
     * APPLY PERIOD
     */

    if (start) {

      query =
        query.gte(
          "created_at",
          start.toISOString()
        );

    }


    if (end) {

      query =
        query.lt(
          "created_at",
          end.toISOString()
        );

    }



    const {

      data,
      error

    } =
    await query;



    if (error) {

      throw error;

    }



    /*
     * GROUP REFERRALS
     */

    const rankings =
      new Map();



    for (
      const row of
      data || []
    ) {


      if (
        !row.referrer_user_id ||
        !row.referred_user_id
      ) {

        continue;

      }



      if (
        !rankings.has(
          row.referrer_user_id
        )
      ) {

        rankings.set(
          row.referrer_user_id,
          {
            user_id:
              row.referrer_user_id,

            referred:
              new Set(),

            bonus:
              0
          }
        );

      }



      const item =
        rankings.get(
          row.referrer_user_id
        );


      item.referred.add(
        row.referred_user_id
      );


      item.bonus +=
        Number(
          row.bonus_amount || 0
        );

    }



    const rows =
      Array.from(
        rankings.values()
      )
      .map(
        item => ({

          user_id:
            item.user_id,

          referral_count:
            item.referred.size,

          bonus:
            item.bonus

        })
      )
      .sort(
        (a, b) =>
          b.referral_count -
          a.referral_count
      );



    /*
     * NO RESULTS
     */

    if (!rows.length) {

      content.innerHTML = `

        <div class="empty">

          No referral records were found
          for this period.

        </div>

      `;

      return;

    }



    /*
     * LOAD MEMBER NAMES
     */

    const userIds =
      rows.map(
        row => row.user_id
      );


    const {

      data: profiles,
      error: profilesError

    } =
    await supabaseClient

      .from("profiles")

      .select(`
        id,
        full_name
      `)

      .in(
        "id",
        userIds
      );



    if (profilesError) {

      throw profilesError;

    }



    const profileMap =
      new Map(
        (profiles || [])
          .map(
            profile => [
              profile.id,
              profile.full_name
            ]
          )
      );



    /*
     * RENDER
     */

    let html = `

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>
                Rank
              </th>

              <th>
                Member
              </th>

              <th>
                Referrals
              </th>

              <th>
                Referral Bonus
              </th>

              <th>
                User ID
              </th>

            </tr>

          </thead>

          <tbody>

    `;



    rows.forEach(
      (row, index) => {


        const rank =
          index + 1;


        const name =
          profileMap.get(
            row.user_id
          ) ||
          "Unknown Member";



        html += `

          <tr>

            <td
              class="
                rank
                ${
                  rank <= 3
                    ? "top-rank"
                    : ""
                }
              "
            >

              #${rank}

            </td>


            <td>

              <div class="name">

                ${
                  escapeHtml(
                    name
                  )
                }

              </div>

            </td>


            <td>

              <span class="amount">

                ${
                  Number(
                    row.referral_count
                  ).toLocaleString()
                }

              </span>

            </td>


            <td>

              <span class="amount">

                ₦${
                  Number(
                    row.bonus
                  ).toLocaleString(
                    "en-NG"
                  )
                }

              </span>

            </td>


            <td>

              <div class="user-id">

                ${
                  escapeHtml(
                    row.user_id
                  )
                }

              </div>

            </td>

          </tr>

        `;

      }
    );



    html += `

          </tbody>

        </table>

      </div>

    `;



    content.innerHTML =
      html;


  }


  catch (error) {


    console.error(
      "Rankings error:",
      error
    );


    content.innerHTML = `

      <div class="error">

        <strong>
          Rankings could not be loaded.
        </strong>

        <br><br>

        ${
          escapeHtml(
            error.message ||
            "Unknown error"
          )
        }

      </div>

    `;

  }

}



/* ========================================
   HTML ESCAPE
======================================== */

function escapeHtml(value) {

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}



/* ========================================
   EVENTS
======================================== */

document
  .getElementById(
    "refreshButton"
  )
  .addEventListener(
    "click",
    loadRankings
  );


document
  .getElementById(
    "period"
  )
  .addEventListener(
    "change",
    loadRankings
  );



/* ========================================
   START
======================================== */

(async function() {


  const user =
    await checkAdmin();


  if (!user) {

    return;

  }


  await loadRankings();


})();


</script>


</body>

</html>
